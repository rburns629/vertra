{{/*
Log search (values.yaml's logs, console/src/core/logs.ts): a single Loki,
and Grafana Alloy collecting every step's output and the platform's own
through the Kubernetes API (files/alloy.alloy). Neither carries the
console's selector labels, so neither may reach a database. Loki accepts
the collector's pushes and the console's queries, nothing else: its API has
no users, so a caller's visibility is the console's to add.
*/}}
{{- define "execution-console.lokiConfig" -}}
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /var/loki
  replication_factor: 1
  ring:
    kvstore: {store: inmemory}
  storage:
    {{- if eq $.Values.logs.storage.type "gcs" }}
    gcs: {bucket_name: {{ $.Values.logs.storage.bucket | quote }}}
    {{- else if eq $.Values.logs.storage.type "s3" }}
    s3: {bucketnames: {{ $.Values.logs.storage.bucket | quote }}, region: {{ $.Values.logs.storage.region | quote }}}
    {{- else }}
    filesystem: {chunks_directory: /var/loki/chunks, rules_directory: /var/loki/rules}
    {{- end }}
schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: {{ $.Values.logs.storage.type }}
      schema: v13
      index: {prefix: index_, period: 24h}
limits_config:
  allow_structured_metadata: true
  # Only the labels the collector sets.
  discover_service_name: []
  discover_log_levels: false
  # Deleted after keepDays; archived (by the bucket) after searchDays.
  retention_period: {{ mul (int $.Values.logs.keepDays) 24 }}h
  max_query_lookback: {{ mul (int $.Values.logs.keepDays) 24 }}h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
compactor:
  working_directory: /var/loki/compactor
  retention_enabled: true
  delete_request_store: {{ $.Values.logs.storage.type }}
analytics:
  reporting_enabled: false
{{- end }}
{{- if .Values.logs.enabled }}
{{- $logs := .Values.logs }}
{{- $loki := printf "%s-loki" (include "execution-console.fullname" .) }}
{{- $lokiAccount := $logs.serviceAccountName | default $loki }}
{{- $collector := printf "%s-logs-collector" (include "execution-console.fullname" .) }}
{{- $lokiLabels := dict "app.kubernetes.io/name" (printf "%s-loki" (include "execution-console.name" .)) "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/component" "loki" }}
{{- $collectorLabels := dict "app.kubernetes.io/name" (printf "%s-logs-collector" (include "execution-console.name" .)) "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/component" "logs-collector" }}
{{- if not (has $logs.storage.type (list "filesystem" "gcs" "s3")) }}
{{- fail "logs.storage.type is filesystem, gcs or s3." }}
{{- end }}
{{- if and (ne $logs.storage.type "filesystem") (not $logs.storage.bucket) }}
{{- fail "logs.storage.bucket: the bucket Loki keeps logs in." }}
{{- end }}
{{- if lt (int $logs.keepDays) (int $logs.searchDays) }}
{{- fail "logs.keepDays can't be shorter than logs.searchDays." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $loki }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
data:
  loki.yaml: |
    {{- include "execution-console.lokiConfig" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $lokiAccount }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
  {{- with $logs.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if eq $logs.storage.type "filesystem" }}
automountServiceAccountToken: false
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $loki }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  replicas: 1
  serviceName: {{ $loki }}
  selector:
    matchLabels:
      {{- toYaml $lokiLabels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml $lokiLabels | nindent 8 }}
      annotations:
        checksum/config: {{ include "execution-console.lokiConfig" . | sha256sum }}
    spec:
      serviceAccountName: {{ $lokiAccount }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: loki
          image: {{ include "execution-console.image" $logs.loki.image | quote }}
          args: ["-config.file=/etc/loki/loki.yaml", "-target=all"]
          ports:
            - {name: http, containerPort: 3100}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml $logs.loki.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /var/loki}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ $loki }}}
        - {name: tmp, emptyDir: {}}
        {{- if ne $logs.storage.type "filesystem" }}
        - {name: data, emptyDir: {sizeLimit: 5Gi}}
        {{- end }}
  {{- if eq $logs.storage.type "filesystem" }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $logs.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $logs.storage.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $loki }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
spec:
  selector:
    {{- toYaml $lokiLabels | nindent 4 }}
  ports:
    - {name: http, port: 3100, targetPort: http}
---
# The collector reads Pods and their logs, everywhere: steps run in every
# team's namespace. Read-only; nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $collector }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $collector }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $collector }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $collector }}
subjects:
  - kind: ServiceAccount
    name: {{ $collector }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $collector }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
data:
  config.alloy: |-
    {{- .Files.Get "files/alloy.alloy" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $collector }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
    app.kubernetes.io/component: logs-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- toYaml $collectorLabels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml $collectorLabels | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/alloy.alloy" | sha256sum }}
    spec:
      serviceAccountName: {{ $collector }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: alloy
          image: {{ include "execution-console.image" $logs.collector.image | quote }}
          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - --disable-reporting
          env:
            - name: LOKI_URL
              value: "http://{{ $loki }}.{{ .Release.Namespace }}.svc.cluster.local:3100"
            - name: PLATFORM_NAMESPACE
              value: {{ .Release.Namespace | quote }}
          ports:
            - {name: metrics, containerPort: 12345}
          readinessProbe:
            httpGet: {path: /-/ready, port: metrics}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml $logs.collector.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/alloy}
            - {name: data, mountPath: /var/lib/alloy}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ $collector }}}
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
{{- if .Values.networkPolicy.enabled }}
---
# Loki: the collector's pushes and the console's queries only. Its /metrics
# shares the port with its query API, so scrapers aren't let in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $loki }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $lokiLabels | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml $collectorLabels | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "execution-console.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: app
      ports:
        - {port: 3100, protocol: TCP}
---
# The collector serves only its metrics (and debugging UI): scrapers only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $collector }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $collectorLabels | nindent 6 }}
  policyTypes: ["Ingress"]
  {{- with .Values.networkPolicy.metricsFrom }}
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - {port: 12345, protocol: TCP}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
{{- end }}
