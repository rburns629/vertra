{{/*
When the console runs its own Postgres, only this release's Pods (the
console and its migrations and backups) may connect to it; in particular,
no step's Pod can. The console itself stays reachable: it's the front door.
(When the kernel's Postgres hosts the console's database instead, the
kernel chart's policy covers it.)

Enforced only by a CNI that implements NetworkPolicy (kindnet, GKE Dataplane
V2, Calico, Cilium, ...); elsewhere it's accepted and silently ignored.
*/}}
{{- if and .Values.networkPolicy.enabled .Values.postgres.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "execution-console.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "execution-console.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "execution-console.selectorLabels" . | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
