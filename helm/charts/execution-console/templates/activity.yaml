{{/*
When the console was last used (values.yaml's activity, console/src/
activity.ts), for the kernel chart's sleeper. The console may update this
one ConfigMap and nothing else of its kind; the sleeper may read it.
No data here: the console writes it, and an upgrade leaves it alone.
*/}}
{{- if .Values.activity.enabled }}
{{- $name := printf "%s-activity" (include "execution-console.fullname" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "execution-console.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
