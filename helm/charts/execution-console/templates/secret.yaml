{{- if and (not .Values.postgres.enabled) (not .Values.externalDatabaseUrl) (not .Values.existingSecret) }}
{{- fail "Set postgres.enabled=true, or provide externalDatabaseUrl, or provide existingSecret." }}
{{- end }}
{{/*
jwt-secret is generated once, on first install, and then kept stable
across every subsequent `helm upgrade` by reading it back out of the
Secret that's already running -- re-rendering a fresh random value on
every upgrade (the naive approach) would silently invalidate every
signed-in session's token on every deploy. .Values.jwtSecret always wins
if the operator sets one explicitly.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "execution-console.secretName" .) }}
{{- $existingData := (($existing).data) | default dict }}
{{- $jwtSecret := .Values.jwtSecret }}
{{- if not $jwtSecret }}
  {{- if hasKey $existingData "jwt-secret" }}
    {{- $jwtSecret = index $existingData "jwt-secret" | b64dec }}
  {{- else }}
    {{- $jwtSecret = randAlphaNum 48 }}
  {{- end }}
{{- end }}
{{- /* Once per render: on a fresh install every call is a new random value. */}}
{{- $postgresPassword := include "execution-console.postgresPassword" . }}
{{- /* The gateway's role on this chart's own Postgres: generated once, kept. */}}
{{- $gatewayPassword := randAlphaNum 32 }}
{{- if hasKey $existingData "gateway-db-password" }}
  {{- $gatewayPassword = index $existingData "gateway-db-password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "execution-console.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ $jwtSecret | quote }}
  {{- if not .Values.existingSecret }}
  database-url: {{ include "execution-console.databaseUrl" (dict "root" . "password" $postgresPassword) | quote }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  # Sourced by the bundled postgres Deployment's own POSTGRES_PASSWORD env
  # var (via secretKeyRef), so the password exists in exactly one place.
  postgres-password: {{ $postgresPassword | quote }}
  {{- if and .Values.gateway.enabled (not .Values.gateway.database.existingSecret) }}
  # The gateway's own role (gateway.database), made by the migration Job.
  gateway-db-password: {{ $gatewayPassword | quote }}
  gateway-database-url: "postgresql://{{ .Values.gateway.database.role }}:{{ $gatewayPassword }}@{{ include "execution-console.fullname" . }}-postgres:5432/{{ .Values.postgres.auth.database }}"
  {{- end }}
  {{- end }}
  {{- if .Values.bootstrapAdmin.password }}
  bootstrap-admin-password: {{ .Values.bootstrapAdmin.password | quote }}
  {{- end }}
