apiVersion: v1
kind: Service
metadata:
  name: {{ include "execution-console.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector:
    {{- include "execution-console.selectorLabels" . | nindent 4 }}
    # See templates/deployment.yaml's comment -- without this, this
    # Service also matches the bundled Postgres pod and silently routes
    # some fraction of requests into it instead.
    app.kubernetes.io/component: app
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
