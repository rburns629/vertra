{{- if not .Values.kernelApiUrl }}
{{- fail "Set kernelApiUrl to execution-kernel's kernel-api Service URL -- execution-console is its only authorized caller (see console/src/core/executions.ts)." }}
{{- end }}
{{- $sig := .Values.catalog.signature }}
{{- if and (or $sig.publicKeys $sig.keyless.issuer) (not .Values.scanning.enabled) }}
{{- fail "catalog.signature needs scanning.enabled: a release is verified by a Job run as the scan Jobs are." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "execution-console.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
data:
{{- include "execution-console.configData" . }}
  DATABASE_POOL_SIZE: {{ .Values.databasePoolSize | quote }}
  # The chat agent (values.yaml's chat): off without a model. The console's
  # alone: the migration Job has no use for it, nor its key.
  CHAT_MODEL: {{ .Values.chat.model | quote }}
  CHAT_PROVIDER: {{ .Values.chat.provider | quote }}
  CHAT_ENDPOINT: {{ .Values.chat.endpoint | quote }}
  CHAT_MAX_STEPS: {{ .Values.chat.maxSteps | quote }}
  CHAT_TIMEOUT_SECONDS: {{ .Values.chat.timeoutSeconds | quote }}
  CHAT_MAX_TOKENS: {{ .Values.chat.maxTokens | quote }}
  CHAT_EFFORT: {{ .Values.chat.effort | quote }}
  CHAT_CONTEXT_TOKENS: {{ .Values.chat.contextTokens | quote }}
  CHAT_VERTEX_PROJECT: {{ .Values.chat.vertex.project | quote }}
  CHAT_VERTEX_LOCATION: {{ .Values.chat.vertex.location | quote }}
  CHAT_BEDROCK_REGION: {{ .Values.chat.bedrock.region | quote }}
---
# The migration Job's own copy, made by the same hook just before it: a
# pre-upgrade Job reading the ConfigMap above would get the previous
# release's settings (an upgrade turning single sign-on off would hand it
# OIDC_ISSUER without its secret, and the upgrade would fail).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "execution-console.fullname" . }}-migrate-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
{{- include "execution-console.configData" . }}

{{- define "execution-console.configData" }}
  PORT: {{ .Values.service.port | quote }}
  DATABASE_IAM_AUTH: {{ .Values.database.iamAuth | quote }}
  DATABASE_IAM_REGION: {{ .Values.database.region | quote }}
  METRICS_PORT: {{ .Values.monitoring.port | quote }}
  {{- if .Values.writeFence.enabled }}
  WRITE_FENCE_POLICY: {{ printf "%s-write-fence" (include "execution-console.fullname" .) | quote }}
  {{- end }}
  {{- if .Values.logs.enabled }}
  LOKI_URL: "http://{{ include "execution-console.fullname" . }}-loki.{{ .Release.Namespace }}.svc.cluster.local:3100"
  {{- end }}
  LOG_SEARCH_DAYS: {{ .Values.logs.searchDays | quote }}
  {{- with .Values.audit.export }}
  {{- if .bucket }}
  AUDIT_EXPORT_BUCKET: {{ .bucket | quote }}
  AUDIT_EXPORT_PROVIDER: {{ .provider | quote }}
  AUDIT_EXPORT_REGION: {{ .region | quote }}
  AUDIT_EXPORT_ENDPOINT: {{ .endpoint | quote }}
  AUDIT_EXPORT_PREFIX: {{ .prefix | quote }}
  AUDIT_EXPORT_MINUTES: {{ .minutes | quote }}
  AUDIT_EXPORT_KEEP_DAYS: {{ .keepDays | quote }}
  AUDIT_EXPORT_LOCK: {{ .lock | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.monitoring }}
  # Which Prometheus scrapes it (empty: none), and where Grafana is: shown only.
  MONITORING_PROVIDER: {{ ternary .provider "" (or .podMonitor.enabled .alerts.enabled .dashboard.enabled .prometheus.enabled) | quote }}
  GRAFANA_URL: {{ .grafanaUrl | quote }}
  {{- end }}
  IMAGE_SIGNATURE_POLICY_NAME: {{ .Values.imageSignature.policyName | quote }}
  KERNEL_API_URL: {{ .Values.kernelApiUrl | quote }}
  ENVIRONMENT_LABEL: {{ .Values.environmentLabel | quote }}
  # The console's own version: its image's tag, for the Admin page.
  CONSOLE_VERSION: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
  {{- $host := .Values.ingress.host | default .Values.gatewayApi.host }}
  # Where people reach it, for links in chat webhook posts.
  CONSOLE_URL: {{ .Values.notifications.consoleUrl | default (ternary (printf "https://%s" $host) "" (ne $host "")) | quote }}
  NOTIFY_WEBHOOK_HOSTS: {{ join "," .Values.notifications.webhookHosts | quote }}
  ORDER_CALLBACK_HOSTS: {{ join "," .Values.orders.callbackHosts | quote }}
  ORDER_RATE_PER_MINUTE: {{ .Values.orders.ratePerMinute | quote }}
  {{- with .Values.notifications.email }}
  {{- if .host }}
  {{- if not .from }}
  {{- fail "notifications.email.host is set, so notifications.email.from is needed too." }}
  {{- end }}
  SMTP_HOST: {{ .host | quote }}
  SMTP_PORT: {{ .port | quote }}
  SMTP_TLS: {{ .tls | quote }}
  SMTP_FROM: {{ .from | quote }}
  SMTP_USERNAME: {{ .username | quote }}
  {{- if .passwordSecret.name }}
  SMTP_PASSWORD_FILE: /var/run/secrets/vertra/smtp/password
  {{- end }}
  {{- end }}
  {{- end }}
  KEYLESS_ISSUERS: {{ join "," .Values.keyless.issuers | quote }}
  KEYLESS_AUDIENCE: {{ .Values.keyless.audience | quote }}
  JWT_TTL: {{ .Values.jwtTtl | quote }}
  ALLOW_SELF_REGISTRATION: {{ .Values.allowSelfRegistration | quote }}
  {{- with .Values.sso }}
  {{- if .issuer }}
  {{- if not (and .clientId .clientSecret.name .redirectUrl .allowedDomains) }}
  {{- fail "sso.issuer is set, so sso.clientId, sso.clientSecret.name, sso.redirectUrl and sso.allowedDomains are needed too." }}
  {{- end }}
  OIDC_ISSUER: {{ .issuer | quote }}
  OIDC_CLIENT_ID: {{ .clientId | quote }}
  OIDC_REDIRECT_URL: {{ .redirectUrl | quote }}
  OIDC_ALLOWED_DOMAINS: {{ join "," .allowedDomains | quote }}
  OIDC_LABEL: {{ .label | quote }}
  {{- end }}
  {{- end }}
  TRUST_PROXY: {{ join "," .Values.trustProxy | quote }}
  # The kernel's image admission policy, whose allowed-source list the
  # Admin page edits (the execution-kernel chart's image-policy.yaml).
  IMAGE_POLICY_NAME: {{ .Values.imagePolicy.policyName | quote }}
  # The kernel's identity admission policy, whose product list the console
  # keeps current (the execution-kernel chart's identity-policy.yaml).
  IDENTITY_POLICY_NAME: {{ .Values.identityPolicy.policyName | quote }}
  POLICY_SYNC_INTERVAL_SECONDS: {{ .Values.policySyncIntervalSeconds | quote }}
  EXECUTION_RETENTION_DAYS: {{ .Values.retention.executionDays | quote }}
  AUDIT_RETENTION_DAYS: {{ .Values.retention.auditDays | quote }}
  SCAN_RETENTION_DAYS: {{ .Values.retention.scanDays | quote }}
  # Image scanning (values.yaml's scanning).
  SCANNING_ENABLED: {{ .Values.scanning.enabled | quote }}
  {{- if .Values.scanning.enabled }}
  SCANNER_SERVER_URL: {{ printf "http://%s-trivy:4954" (include "execution-console.fullname" .) | quote }}
  SCANNER_IMAGE: {{ include "execution-console.image" .Values.scanning.image | quote }}
  SCANNER_SERVICE_ACCOUNT: {{ printf "%s-scanner" (include "execution-console.fullname" .) | quote }}
  SCANNER_PULL_SECRET: {{ ternary "vertra-registry-token" .Values.registryCheck.pullSecretName (ne (include "execution-console.registryFederationAudience" .) "") | quote }}
  SCAN_WAIT_SECONDS: {{ .Values.scanning.waitSeconds | quote }}
  SCAN_RESCAN_HOURS: {{ .Values.scanning.rescanHours | quote }}
  SCAN_POLICY_NAME: {{ .Values.scanning.policyName | quote }}
  SCAN_PLATFORM: {{ .Values.scanning.platform | quote }}
  {{- if gt (int .Values.scanning.idleMinutes) 0 }}
  SCANNER_DEPLOYMENT: {{ printf "%s-trivy" (include "execution-console.fullname" .) | quote }}
  SCANNER_IDLE_MINUTES: {{ .Values.scanning.idleMinutes | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.activity.enabled }}
  ACTIVITY_CONFIGMAP: {{ printf "%s-activity" (include "execution-console.fullname" .) | quote }}
  {{- end }}
  # The catalog release (values.yaml's catalog).
  CATALOG_RELEASE: {{ .Values.catalog.release | quote }}
  CATALOG_NEWEST_VERSION: {{ .Values.catalog.newestVersion | quote }}
  CATALOG_POLL_SECONDS: {{ .Values.catalog.pollSeconds | quote }}
  CATALOG_EXTERNAL: {{ .Values.catalog.external | quote }}
  CATALOG_SIGNATURE_PUBLIC_KEYS: {{ .Values.catalog.signature.publicKeys | toJson | quote }}
  CATALOG_SIGNATURE_KEYLESS_ISSUER: {{ .Values.catalog.signature.keyless.issuer | quote }}
  CATALOG_SIGNATURE_KEYLESS_SUBJECT_REGEXP: {{ .Values.catalog.signature.keyless.subjectRegExp | quote }}
  CATALOG_VERIFIER_IMAGE: {{ include "execution-console.image" .Values.catalog.verifier.image | quote }}
  # Team namespaces (values.yaml's teamNamespaces).
  TEAM_NAMESPACES_MANAGE: {{ .Values.teamNamespaces.manage | quote }}
  TEAM_NAMESPACES_PURGE: {{ and .Values.teamNamespaces.manage .Values.teamNamespaces.purge | quote }}
  TEAM_NAMESPACE_LABEL: {{ .Values.writeFence.teamNamespaceLabel | quote }}
  PLATFORM_NAMESPACE: {{ .Release.Namespace | quote }}
  PROTECTED_NAMESPACES: {{ join "," .Values.teamNamespaces.protected | quote }}
  TEAM_NAMESPACE_POD_SECURITY: {{ .Values.teamNamespaces.podSecurity | quote }}
  TEAM_NAMESPACE_DEFAULT_DENY_INGRESS: {{ and .Values.teamNamespaces.manage .Values.teamNamespaces.defaultDenyIngress | quote }}
  TEAM_NAMESPACE_BLOCK_METADATA: {{ and .Values.teamNamespaces.manage .Values.teamNamespaces.defaultDenyIngress .Values.teamNamespaces.blockMetadata | quote }}
  {{- with (include "execution-console.schedulerLogs" . | fromJson) }}
  # The kernel scheduler's log reading, bound per team namespace (schedulerLogs.ts).
  TEAM_SCHEDULER_LOGS_ROLE: {{ .clusterRole | quote }}
  TEAM_SCHEDULER_SERVICE_ACCOUNT: {{ printf "%s/%s" .namespace .name | quote }}
  {{- end }}
  {{- if and .Values.gateway.enabled .Values.teamNamespaces.manage .Values.teamNamespaces.defaultDenyIngress }}
  # The gateway's Pods, let into each team's API backends (vertra-gateway-ingress).
  TEAM_GATEWAY_NAMESPACE: {{ .Release.Namespace | quote }}
  {{- $labels := list }}
  {{- range $k, $v := (include "execution-console.gatewaySelectorLabels" . | fromYaml) }}
  {{- $labels = append $labels (printf "%s=%s" $k $v) }}
  {{- end }}
  TEAM_GATEWAY_POD_LABELS: {{ join "," $labels | quote }}
  {{- end }}
  TEAM_QUOTA_CPU: {{ .Values.teamNamespaces.quota.cpu | quote }}
  TEAM_QUOTA_MEMORY: {{ .Values.teamNamespaces.quota.memory | quote }}
  TEAM_QUOTA_PODS: {{ .Values.teamNamespaces.quota.pods | quote }}
  TEAM_QUOTA_STEP_MEMORY: {{ .Values.teamNamespaces.quota.stepMemory | quote }}
  SECRET_SOURCES_CATALOG_REPO: {{ .Values.secretSources.catalogRepo | quote }}
  SECRET_SOURCES_CLUSTER_ISSUER: {{ .Values.secretSources.clusterIssuer | quote }}
  SECRET_SOURCES_GCP_WORKLOAD_IDENTITY_POOL: {{ .Values.secretSources.gcpWorkloadIdentityPool | quote }}
  SECRET_SOURCES_GKE_CLUSTER_NAME: {{ .Values.secretSources.gkeClusterName | quote }}
  SECRET_SOURCES_GKE_CLUSTER_LOCATION: {{ .Values.secretSources.gkeClusterLocation | quote }}
  # Only db/migrate.ts's one-time bootstrap seed reads this -- the running
  # server never does. Not secret by itself (an email address); the
  # matching password, if set, lives in the Secret instead.
  BOOTSTRAP_ADMIN_EMAIL: {{ .Values.bootstrapAdmin.email | quote }}
{{- end }}
