{{/*
TLS for this chart's own Postgres (tls.enabled with postgres.enabled): a CA
of this release's own and a certificate it signs for the Postgres
Service, so it requires TLS and every client checks it reached the real
one (sslmode=verify-full). Made once and kept, as the database password
is (_helpers.tpl's tlsMade, which the Pod's checksum reads too); delete both Secrets and upgrade to rotate. kernel-api's, and the
kernel's Postgres's, come from the kernel chart (tls.kernelCaSecret).
*/}}
{{- if and .Values.tls.enabled .Values.postgres.enabled }}
{{- $fullname := include "execution-console.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $name := printf "%s-tls" $fullname }}
{{- include "execution-console.tlsMade" . }}
{{- $made := index .Values.tls "_made" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ $made.ca.crt | b64enc }}
  ca.key: {{ $made.ca.key | b64enc }}
  postgres.crt: {{ $made.postgres.crt | b64enc }}
  postgres.key: {{ $made.postgres.key | b64enc }}
  postgres.hosts: {{ $made.postgres.hosts | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-ca
  namespace: {{ $ns }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ $made.ca.crt | b64enc }}
{{- end }}
