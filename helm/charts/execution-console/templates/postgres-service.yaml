{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "execution-console.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "execution-console.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
