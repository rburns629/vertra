# -- The execution-console image (built from console/'s own Dockerfile). One
# process serves both the API and the already-built frontend (see
# console/src/index.ts) -- there's no separate frontend workload to deploy.
image:
  # -- The released images (built, scanned and signed by the release
  # workflow). Local installs set their own (helm/values/kind/).
  repository: ghcr.io/rburns629/vertra/execution-console
  # -- Defaults to the chart's appVersion: the image released with it.
  tag: ""
  # -- Pin by digest ("sha256:…") so what runs can't change under a moved tag.
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# -- Most database connections each console process holds; the gateway's
# is gateway.databaseMaxConnections. Every size keeps the sum over all
# processes (the kernel's too, when they share a database) under
# postgres.settings.max_connections.
databasePoolSize: 10

# -- Copies on CPU load instead of replicaCount: a HorizontalPodAutoscaler
# (the `auto` size, sizes/auto.yaml). Needs the cluster's metrics API
# (metrics-server; built into GKE, EKS Auto Mode and AKS Automatic).
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# -- A PodDisruptionBudget whenever the console can run two or more copies:
# node drains and upgrades then evict one at a time.
podDisruptionBudget:
  enabled: true

service:
  type: ClusterIP
  port: 8080
  # -- Only meaningful for LoadBalancer/NodePort. With the Kubernetes
  # default ("Cluster") the node SNATs incoming traffic, so the console sees
  # every browser as the same node IP, and the login rate limit (keyed on
  # client IP + email, see console/src/rpc/services/auth.ts) can't tell attackers
  # apart from everyone else. "Local" keeps the real client IP. Its
  # trade-off is that only nodes running a console Pod take traffic, which
  # is fine at replicaCount 1. Left empty, the Kubernetes default applies.
  externalTrafficPolicy: ""
  annotations: {}

# -- Reaching the console from outside the cluster through an Ingress, e.g.
# for the catalog's CI. Behind one, set trustProxy too. The charts add no
# TLS of their own: give the Ingress a certificate (on GKE, the annotation
# networking.gke.io/managed-certificates naming a ManagedCertificate), and
# serve HTTPS only.
ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  # -- Refuse plain HTTP, for the controllers this chart knows (className):
  # traefik serves the console on its HTTPS entrypoint only, nginx
  # redirects to HTTPS, gce has no HTTP at all. Another controller: set its
  # own annotation. Browsers keep to HTTPS anyway once they've seen the
  # console's Strict-Transport-Security.
  httpsOnly: true
  # -- A Secret with the certificate, when it isn't managed by the cloud
  # or by cert-manager.
  tlsSecretName: ""
  # cert-manager (installed separately) issues and renews the certificate
  # into <release>-execution-console-tls.
  certManager:
    # -- The issuer to ask: a ClusterIssuer (issuerKind) you made, e.g. one
    # for your internal CA. Empty, with acme.email set: the chart's own.
    issuer: ""
    issuerKind: ClusterIssuer
    # -- Let's Encrypt: the chart makes an Issuer here that proves the host
    # over HTTP through this Ingress's class (className). The host must
    # resolve to the Ingress from the internet.
    acme:
      email: ""
      server: https://acme-v02.api.letsencrypt.org/directory

# -- Reaching the console through a Gateway (Gateway API) instead of an
# Ingress: an HTTPRoute for the host, attached to a Gateway someone else
# runs, whose HTTPS listener holds the certificate (cert-manager can issue it
# from an annotation on the Gateway).
gatewayApi:
  enabled: false
  host: ""
  # -- The Gateway's HTTPS listener, e.g. [{name: shared, namespace: infra, sectionName: https}].
  parentRefs: []
  # -- The same Gateway's plain-HTTP listener, answered with a redirect to
  # HTTPS (none when empty), e.g. [{name: shared, namespace: infra, sectionName: http}].
  redirectParentRefs: []

# -- The proxies in front of the console (addresses and CIDR ranges), whose
# X-Forwarded-For it believes, so the sign-in throttle and rate limits see
# real clients. Google's external Application Load Balancer: its front ends
# and its own address, ["35.191.0.0/16", "130.211.0.0/22", "<its IP>"].
# Empty: the header is ignored.
trustProxy: []

serviceAccount:
  create: true
  name: ""
  # -- Annotations on the console's ServiceAccount. For
  # registryCheck.gcpMetadataToken on GKE, the Workload Identity binding:
  #   iam.gke.io/gcp-service-account: <gsa>@<project>.iam.gserviceaccount.com
  annotations: {}

# -- The kernel's image admission policy, whose allowed-source list the
# Admin page edits: "<execution-kernel release name>-execution-kernel-image".
imagePolicy:
  policyName: kernel-execution-kernel-image

# -- The kernel's identity admission policy, whose list of registered
# products the console keeps current so the cluster enforces each product's
# ServiceAccount and Secrets: "<execution-kernel release name>-execution-kernel-identity".
# Empty: the console never writes it (then disable it in the kernel chart too,
# or only "default" with no Secrets can run).
identityPolicy:
  policyName: kernel-execution-kernel-identity

# -- How often the identity and scan policies are rewritten from the
# console's database whatever changed, so a failed write or a hand edit
# doesn't last (admins see the outcome on the Admin page: AdminService/GetPolicySync).
policySyncIntervalSeconds: 300

# -- How long records are kept, in days; 0 keeps them forever. executionDays:
# who may see an execution (keep it the kernel chart's executionRetentionDays,
# which deletes the executions themselves); auditDays: the audit log;
# scanDays: scan verdicts of images not used for that long.
retention:
  executionDays: 90
  auditDays: 365
  scanDays: 90

# -- Scanning every image before it's registered or run, whoever built it
# (console/src/scanning.ts): a Trivy server here holds the vulnerability
# database, and the console runs a short Trivy client Job per image digest
# against it, in this namespace. A HIGH or CRITICAL vulnerability with a fix,
# or a secret in the image, fails it: new registrations and runs of it are
# refused (never steps already running) until it's rescanned clean or an
# admin accepts it. Images in use are rescanned every rescanHours. The
# kernel chart's scan policy (scanPolicy) holds the failed digests, so the
# cluster refuses them too. The server downloads its database from the
# internet (mirror.gcr.io / ghcr.io) when it starts and every few hours.
scanning:
  enabled: true
  image:
    repository: aquasec/trivy
    tag: "0.74.0"
    digest: sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  # The kernel chart's scan admission policy.
  policyName: kernel-execution-kernel-scan
  # How long a submission waits for an image's first scan before asking the
  # caller to try again.
  waitSeconds: 60
  # -- Minutes with no scan asked for or running before the Trivy server is
  # scaled to zero; the next scan starts it again (its first scan then waits
  # for it, about a minute, and the database download). 0: always running.
  idleMinutes: 15
  rescanHours: 24
  # -- Which image of a multi-platform index to scan, e.g. linux/amd64:
  # what the cluster's nodes run. Empty: the console's own platform.
  platform: ""
  # On the scan Jobs' ServiceAccount, e.g. a cloud identity that may read a
  # private registry (GKE: iam.gke.io/gcp-service-account). For a pull
  # Secret, registryCheck.pullSecretName is used.
  serviceAccountAnnotations: {}
  server:
    # Ephemeral storage for its vulnerability database (over 1Gi once
    # unpacked): GKE Autopilot otherwise allows 1Gi and evicts it.
    resources:
      requests: {cpu: 100m, memory: 512Mi, ephemeral-storage: 4Gi}
      limits: {memory: 2Gi, ephemeral-storage: 4Gi}

# -- The API gateway's settings (decision 20), which the console shows and
# applies: an API product whose backend isn't under one of backendHosts is
# held, not published ("orders.example.com" exactly, or "*.a.run.app" for
# any name below it); only internetTeams' APIs may be reachable from the
# internet; url and publicUrl are where callers reach the gateway, inside
# the cluster and from outside.
# -- The audit log's write-once copy (console/src/auditExport.ts): every
# `minutes`, the entries since the last copy, their hash chain checked, as
# one JSON-lines object in a bucket that refuses deletes and overwrites (a
# GCS retention policy, S3 Object Lock; vertra makes it). A broken chain
# stops the copy there and shows on Observe. Empty bucket: off.
audit:
  export:
    bucket: ""
    # -- gcs (the console's Workload Identity) or s3 (its AWS identity).
    provider: gcs
    region: ""
    # -- An S3-compatible store's address (MinIO on kind); empty for S3.
    endpoint: ""
    # -- A Secret with access-key-id and secret-access-key, for a store
    # without the cloud's identities (MinIO); empty otherwise.
    credentialsSecret: ""
    prefix: vertra-audit/
    minutes: 5
    # -- What the bucket keeps each copy for, in days, and whether that
    # retention is locked (vertra.yaml's audit.keepDays and audit.lock). The
    # bucket enforces them; here they're only shown on the Admin page. 0: not
    # known.
    keepDays: 0
    lock: false

# -- Log search (Observe's Logs tab, console/src/core/logs.ts): Grafana
# Alloy reads every step's output, the API backends teams run (Pods
# labelled vertra/api-backend: "true") and the platform's own through the
# Kubernetes API, redacts credentials, and sends it to a single Loki here.
# The console queries Loki itself, adding each caller's visibility (a step's
# INFO lines to anyone who may see its run; the rest, and a backend's
# lines, to its team; the platform's to admins), so Loki is reachable from the console and Alloy
# only. Logs are searchable for searchDays, then archived: kept, in a
# bucket's archive storage class, until keepDays (filesystem storage, as on
# kind, has no archive class: there they're simply kept until keepDays).
logs:
  enabled: false
  searchDays: 30
  keepDays: 365
  storage:
    # -- filesystem (a volume here), gcs or s3. A bucket's lifecycle moves
    # chunks older than searchDays to its archive class (vertra creates the
    # bucket so; docs/operations.md, Logs).
    type: filesystem
    bucket: ""
    # s3 only.
    region: ""
    # -- Loki's volume: its write-ahead log and recent index (a few GiB is
    # plenty with a bucket); with filesystem, every log too.
    size: 10Gi
    storageClassName: ""
  # -- Loki's ServiceAccount (default: <release>-execution-console-loki):
  # the name its bucket identity is bound to (vertra uses vertra-loki).
  serviceAccountName: ""
  # -- On it: GKE's iam.gke.io/gcp-service-account (EKS binds a role to the
  # name by Pod Identity instead).
  serviceAccountAnnotations: {}
  loki:
    image:
      repository: grafana/loki
      tag: "3.7.8"
      digest: sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
  collector:
    image:
      repository: grafana/alloy
      tag: v1.20.1
      digest: sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}

gateway:
  backendHosts: []
  internetTeams: []
  url: ""
  publicUrl: ""
  # -- Run the gateway (gateway/): its Deployment and Service here, reading
  # this console's database. Off: API products are listed but not served.
  enabled: false
  # -- The gateway's own database role, granted only what it reads
  # (console/src/db/gatewayAccess.ts), so it never holds the console's
  # credentials. existingSecret holds its `database-url` (and `password`):
  # the kernel chart's <release>-execution-kernel-gateway-db when the
  # console's database is on the kernel's Postgres (it makes the role too).
  # With postgres.enabled it's made here. With another database, make the
  # role and Secret yourself.
  database:
    existingSecret: ""
    role: vertra_gateway
  # -- Most database connections each gateway holds (each request checks
  # who's calling there).
  databaseMaxConnections: 10
  # -- On its ServiceAccount: with a managed database on GKE, the Workload
  # Identity it signs in as (iam.gke.io/gcp-service-account).
  serviceAccountAnnotations: {}
  image:
    repository: ghcr.io/rburns629/vertra/execution-gateway
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  # -- A second listener (the Service's port public) for APIs reachable
  # from the internet; put an Ingress or load balancer in front of it.
  publicListener: false
  # -- An Ingress in front of the public listener (publicListener on), at
  # host, for publicUrl.
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    # A TLS Secret for host; empty with a controller that manages its own.
    tlsSecretName: ""
  # -- Where the gateway may connect, as NetworkPolicy egress peers (with
  # networkPolicy.enabled). Empty: anywhere but the cloud metadata server
  # (it mints every credential itself, so it never needs the node's).
  # Narrow it to your backends' ranges where you can, keeping the console's
  # Pods (it reads the console's session keys) and its database.
  egress: []
  # -- Requests a minute for a calling team an API's limits don't name.
  defaultPerMinute: 600
  # -- Close the gateway: every API answers 503 and nothing is forwarded.
  closed: false
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
  # -- Minting Google ID tokens (backend.auth.googleIdToken): the STS
  # audience an API ServiceAccount's token is exchanged for, and the
  # audience that token carries. On GKE, the cluster's Workload Identity
  # pool: tokenAudience <project>.svc.id.goog, stsAudience
  # identitynamespace:<project>.svc.id.goog:https://container.googleapis.com/v1/projects/<project>/locations/<location>/clusters/<cluster>
  # (vertra sets both). Elsewhere, a pool's provider trusting the cluster's
  # issuer: //iam.googleapis.com/projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>,
  # and its https:// form.
  gcp:
    stsAudience: ""
    tokenAudience: ""

# -- The catalog this console registers from (console/src/catalogSync.ts):
# its release, which catalog CI pushes from main beside the images
# (`vertra catalog release`, <registry>/catalog-release:latest). The console reads
# it every pollSeconds (and on the Admin page's Sync now), verifies its
# signature when `signature` trusts one, and applies it: teams, products and
# SecretStores, with the release's rights only (never purging). It reads the
# registry as registryCheck says (its pull Secret, cloud token and mirrors).
# Empty: no catalog; teams and products are an admin's to make.
catalog:
  release: ""
  # -- Follow the newest version (a vX.Y.Z tag of release's repository, which
  # a vX.Y.Z Git tag in the catalog repository makes: `vertra catalog
  # promote`) instead of release's own tag. Or pin one: release
  # <registry>/catalog-release:v1.4.0.
  newestVersion: false
  pollSeconds: 300
  # -- release is another install's catalog (vertra.yaml's externalCatalog),
  # not this install's own. Shown on the Admin page only.
  external: false
  # -- Who may sign a release: any of these cosign public keys (PEM), and/or
  # a keyless identity (both issuer and subjectRegExp). Usually the same as
  # the kernel chart's imageSignature. Empty: releases aren't verified, and
  # the registry's write access (main only) is the whole trust. Verifying
  # runs a short cosign Job as the scan Jobs do (scanning.enabled), signed in
  # to the registry with registryCheck.pullSecretName if set, else as their
  # ServiceAccount's cloud identity (scanning.serviceAccountAnnotations: GKE
  # Workload Identity, EKS). It must reach the registry by the name in
  # `release` (not kind's localhost:5001).
  signature:
    publicKeys: []
    keyless:
      issuer: ""
      subjectRegExp: ""
  verifier:
    image:
      repository: ghcr.io/sigstore/cosign/cosign
      tag: "v2.5.3"
      digest: sha256:f1946d0f30fc8e3777b02f2201e02efdba9fe38f4918162f937052fac98e083f

# -- Recording when the console was last used (any signed-in request, at most
# once a minute) in a ConfigMap, <release>-execution-console-activity, the
# only one it may change. The kernel chart's sleeper (scaleDown) reads it,
# so it doesn't put the platform to sleep under someone using the console.
activity:
  enabled: true

# -- Checking that a DAG's images still exist before submitting, rerunning
# or retrying it (see console/src/registry.ts). Only the registries configured
# here are ever contacted; images anywhere else are let through unchecked,
# and the kernel still fails a missing image at dispatch (IMAGE_NOT_FOUND).
registryCheck:
  # -- A Secret of type kubernetes.io/dockerconfigjson in this namespace,
  # the same format as an imagePullSecret, so any registry works (ACR, ECR,
  # GHCR, Docker Hub, Artifact Registry). Its credential only needs to read
  # manifests, unless it's also copied to teams (below).
  pullSecretName: ""
  # -- Also copy pullSecretName into every team namespace as `vertra-pull`,
  # so steps can run images from private registries; set the kernel chart's
  # scheduler.taskImagePullSecret to `vertra-pull` to match. Its credential
  # then needs to pull images, not just read manifests. Steps can't read it
  # (it's never a team secret); only the kubelet uses it. Kept in step with
  # the Secret on every policy resync, so a rotation reaches every team.
  copyToTeams: false
  # -- GKE only: mint short-lived Artifact Registry/GCR tokens from the
  # metadata server instead of storing a key. Needs Workload Identity on the
  # console's ServiceAccount (serviceAccount.annotations) bound to a GSA
  # with roles/artifactregistry.reader on the repositories to check.
  gcpMetadataToken: false
  # -- EKS only: short-lived ECR credentials from the console's own AWS
  # identity instead of a stored key. Needs an EKS Pod Identity association
  # for the console's ServiceAccount with a role that may
  # ecr:GetAuthorizationToken and read the repositories to check.
  ecrToken: false
  # -- A Google Artifact Registry on another cloud (another install's
  # catalog), read with no stored key: the console's ServiceAccount token,
  # projected for workloadIdentityProvider, is exchanged at Google's STS
  # (Workload Identity Federation) for an hour's access token, used as is,
  # or to impersonate serviceAccount when set. The console signs in to
  # `hosts` with it, and writes it every policy sync as `vertra-pull` in
  # every team namespace (set the kernel chart's
  # scheduler.taskImagePullSecret to `vertra-pull`) and as
  # `vertra-registry-token` here, for the verify and scan Jobs. The pool's
  # provider trusts this cluster's OIDC issuer; grant
  # roles/artifactregistry.reader on the repository to the console's
  # principal (principal://iam.googleapis.com/<pool>/subject/
  # system:serviceaccount:<namespace>:<console ServiceAccount>), or to
  # serviceAccount. docs/operations.md has the commands.
  gcpFederation:
    # projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
    workloadIdentityProvider: ""
    serviceAccount: ""
    # Such as us-central1-docker.pkg.dev.
    hosts: []
  # -- An Amazon ECR in another account, or read from another cloud
  # (another install's catalog), with no stored key: the console's
  # ServiceAccount token, projected for sts.amazonaws.com, assumes roleArn
  # (AssumeRoleWithWebIdentity), whose credentials get ECR's registry
  # token. It signs in to `hosts` with it and writes it, as gcpFederation
  # does, as `vertra-pull` in every team namespace and `vertra-registry-token`
  # here. The owner's role trusts this cluster's OIDC issuer for the
  # console's ServiceAccount alone, and may read only the catalog's
  # repositories (`vertra catalog grant`). Not with gcpFederation.
  awsFederation:
    # arn:aws:iam::<owner's account>:role/<name>
    roleArn: ""
    # Such as 123456789012.dkr.ecr.us-east-2.amazonaws.com.
    hosts: []
  # -- Where to reach a registry from inside the cluster when that differs
  # from its name in image references, as {host: url}. On kind:
  # {"localhost:5001": "http://kind-registry:5000"}.
  mirrors: {}
  # -- Pin every task's image to the digest its tag names at submission
  # (`required`: refuse one the registry can't resolve), so a DAG may say
  # `:latest` while what runs, and what's scanned, is an exact image. `off`
  # sends tags as they are.
  imagePinning: required

# -- This service is the authenticated front door to kernel-api (see
# console/src/core/executions.ts); kernel-api only accepts calls from it
# and should never be reachable directly from a browser. Point this at the
# execution-kernel release's own kernel-api Service, e.g.
# http://<execution-kernel release name>-execution-kernel-api.<namespace>.svc.cluster.local:8000
kernelApiUrl: ""

# -- How the console proves to kernel-api that it's the console: its
# ServiceAccount token, projected for `audience`, which must match the
# kernel chart's api.auth.audience (and the kernel must list this
# ServiceAccount in api.auth.allowedServiceAccounts).
kernelApiToken:
  enabled: true
  audience: vertra-kernel-api

# -- Cosmetic only, rendered as a badge in the UI (see console/src/config.ts) --
# lets a browser tab make it obvious whether it's talking to this
# deployment or to Compose, when both are reachable on localhost at once
# (e.g. a `kind load docker-image` demo cluster alongside `docker
# compose`). "Kubernetes" is deliberately generic rather than
# "Kubernetes (kind)" -- true for any real cluster this chart installs
# to, GKE included; override per-install if you want the badge to name
# the specific cluster.
environmentLabel: "Kubernetes"

# -- Keyless bots: the OIDC issuers whose ID tokens a team's bot may sign in
# with instead of a stored token (a CI job's own identity), and the audience
# those tokens must name. Empty audience: the console's URL (see
# notifications.consoleUrl), else "vertra".
keyless:
  issuers:
    - https://token.actions.githubusercontent.com
    - https://gitlab.com
  audience: ""

# -- Notifications (the inbox, and teams' chat webhooks).
notifications:
  # -- Email: an SMTP server the console sends notifications through, to
  # each person for the kinds they choose in Preferences. Empty host: no
  # email. tls: starttls (587, required), tls (465), or none (a local test
  # server only). The password comes from a Secret's key, mounted as a file.
  email:
    host: ""
    port: 587
    tls: starttls
    from: ""
    username: ""
    passwordSecret:
      name: ""
      key: password
  # -- Where people reach the console, for links in what's posted to chat
  # webhooks. Empty: https://<ingress.host or gatewayApi.host>, or none.
  consoleUrl: ""
  # -- The hosts a team's chat webhook may be under ("*." for any name
  # below one), so a webhook can't point the console anywhere else.
  webhookHosts:
    - hooks.slack.com
    - chat.googleapis.com
    - "*.webhook.office.com"
    - "*.logic.azure.com"

# -- Orders (decision 23): the hosts an ordering bot's callback or a team's
# outcome webhook may be under ("*." for any name below one), where runs'
# outcomes are posted, signed. Empty: none (systems poll GetExecution).
orders:
  callbackHosts: []
  # -- How many orders each ordering bot may place in any minute; past it,
  # 429 with Retry-After. Its schedules' runs and people aren't counted.
  ratePerMinute: 60

# -- Facts the Team page's "Connect a source" wizard shows a platform owner
# setting up secret syncing (External Secrets Operator). Display only; an
# empty value makes the wizard say that option isn't available here.
secretSources:
  # -- owner/repo of the catalog, where secret-stores/<team>/ lives. Empty:
  # the repository the applied catalog release came from.
  catalogRepo: ""
  # -- This cluster's service-account token issuer, which Azure and AWS
  # federate with. On GKE:
  # https://container.googleapis.com/v1/projects/<project>/locations/<location>/clusters/<cluster>
  clusterIssuer: ""
  # -- GKE Workload Identity pool, <project>.svc.id.goog.
  gcpWorkloadIdentityPool: ""
  # -- The GKE cluster's name and location, as a gcpsm SecretStore names them.
  gkeClusterName: ""
  gkeClusterLocation: ""

# -- Signs session JWTs. Leave empty to have one generated on install and
# kept stable across upgrades (see templates/secret.yaml's lookup against
# the existing Secret) -- set explicitly only if you have a specific
# reason to; there's nothing this needs to be shared with.
jwtSecret: ""

# -- How long a login session lasts before the user has to sign in again:
# a number followed by m, h, or d. Validated when the console starts (see
# console/src/config.ts). A password change or admin reset also ends a user's
# earlier sessions immediately, whatever this is set to.
jwtTtl: "8h"

# -- Off: admins create accounts on the Admin page, already in their teams.
# On lets anyone who can reach the console sign up (no email verification),
# so only for a console behind a trusted network boundary.
allowSelfRegistration: false

# -- Single sign-on with an OpenID Connect provider (console/src/auth/
# oidc.ts): Google's for now. People sign in as their verified email, if
# it's in an allowed Workspace domain; their first sign-in makes their
# account (no teams: admins and maintainers add them) or binds the one with
# that email. Turning it on changes nothing else: passwords still work,
# except for the members of a team an admin sets to require single sign-on
# (admins are exempt, a way in if the provider fails). Off while issuer is
# empty.
sso:
  issuer: ""            # https://accounts.google.com
  clientId: ""
  # -- A Secret you create holding the OAuth client's secret.
  clientSecret:
    name: ""
    key: client-secret
  # -- The console's own address, as people reach it, + /api/auth/oidc/callback;
  # registered with the provider as an authorized redirect URI.
  redirectUrl: ""
  # -- Workspace domains whose people may sign in (required).
  allowedDomains: []
  label: Google

bootstrapAdmin:
  email: "admin@example.com"
  # -- Leave empty to have migrate.ts generate one and print it exactly
  # once to the migration Job's own logs (see console/src/db/migrate.ts) --
  # deliberately never a hardcoded default password.
  password: ""

# console/'s own ServiceAccount needs a ClusterRole, for the same reason
# execution-kernel-scheduler's does (see that chart's values.yaml): it
# provisions Secrets and ServiceAccounts across every team's namespace, not
# one fixed namespace, and reading a Namespace at all (ensureNamespaceExists
# in console/src/k8s.ts, which deliberately never creates one) is a
# cluster-scoped resource a plain Role can't grant access to, regardless of
# scope.
#
# It can create and replace Secrets in any team namespace, so treat its
# token with real care. It can't grant RBAC: it may only delete Roles and
# RoleBindings (the per-secret ones older consoles created), never create
# or change them. Writes are fenced to team namespaces (writeFence below).
rbac:
  create: true

# -- Team namespaces. With `manage`, the console creates each team's
# namespace, labelled writeFence.teamNamespaceLabel=true, and relabels it
# `retired` or back as the team is retired or un-retired. So catalog CI needs
# no cluster credentials. templates/namespace-policy.yaml limits what it may
# do to namespaces. `protected`: namespaces no team may ever have, beyond
# kube-* and this release's own.
#
# `purge`: also delete a purged team's namespace (the kernel chart's purge
# policy must then list this release's ServiceAccount under
# purgePolicy.purgers). Off: the console could then both retire a namespace
# and delete it, so a compromised console could delete any team's. A purged
# team's namespace stays, labelled retired (nothing new runs there), for an
# operator to delete with their own identity.
# -- The chat agent (decision 24): a panel on every page whose agent answers
# from the docs and the catalog, looks at what the person's teams have, and
# fills their cart (they place the order). Off unless `model` is set, or
# `provider` is vertex or bedrock (vertex's model then google/gemini-3.5-flash, the one
# scored: name another only after scoring it, `npm run chat-eval`).
# `provider`: openai-compatible (LM Studio, Ollama; `endpoint` its base
# URL, http(s)://.../v1), anthropic (Claude through Anthropic's API, `model`
# such as claude-haiku-5-5; `endpoint` empty for Anthropic's own), vertex
# (Gemini through Vertex AI in `vertex.project`, signed in as the console's Workload Identity:
# no key; its Google service account needs roles/aiplatform.user there;
# a key given anyway is an access token used instead, for trying it off
# GKE, good for an hour), or bedrock (Claude in Amazon Bedrock in
# `bedrock.region`, each request signed as the console's own AWS identity,
# its EKS Pod Identity: no key; its model, Bedrock's name, defaults to
# anthropic.claude-sonnet-5). A key, when one's needed: a Secret's name, key
# `api-key`, never the key itself.
# What it's sent reaches the model's provider: on a cloud, choose one in
# the install's own cloud.
chat:
  model: ""
  provider: openai-compatible
  endpoint: ""
  apiKeySecret: ""
  # Model and tool calls in one answer, at most; how long one model call
  # may take; how long one model call's output may be ("": the provider's
  # default, 8000 on anthropic where thinking counts toward it, else 1500);
  # how hard Claude thinks (low, medium, high; "": the model's default);
  # the most one model call is sent, in tokens, the conversation and what
  # the tools returned ("": 64000 on anthropic, else 16000; at most the
  # model's own window). A longer conversation is refused: start a new one.
  maxSteps: 8
  timeoutSeconds: 180
  maxTokens: ""
  effort: ""
  contextTokens: ""
  # With provider vertex: the project whose Vertex AI answers, and where
  # (global, or a region to keep requests in it).
  vertex:
    project: ""
    location: global
  # With provider bedrock: the AWS region whose Bedrock answers. The
  # console's role needs bedrock-mantle:CreateInference on the model there
  # (vertra's aws module grants it, for that model only).
  bedrock:
    region: ""

teamNamespaces:
  manage: true
  purge: false
  protected: []
  # -- Pod Security enforced in the namespaces the console creates (the
  # kernel's step Pods meet `restricted`). Empty for none.
  podSecurity: restricted
  # -- A NetworkPolicy (vertra-default-deny) in every team namespace: its
  # Pods accept connections only from Pods in the same namespace, so one
  # team's steps can't reach another's. Written with each namespace and
  # rewritten on every policy resync. With gateway.enabled, a second one
  # (vertra-gateway-ingress) lets the gateway's Pods reach the Pods a team
  # labels vertra/api-backend: "true", its APIs' in-cluster backends. The
  # write fence accepts no other policy from the console. Needs a CNI that
  # enforces NetworkPolicy.
  defaultDenyIngress: true
  # -- With defaultDenyIngress, a third NetworkPolicy (vertra-no-metadata)
  # refusing connections from a team's Pods to the instance metadata server
  # (169.254.169.254; IPv4 clusters only), so a step can't take its node's
  # cloud credentials; everything else outward stays open. For EKS (on in
  # helm/values/eks). Never on GKE: Workload Identity, steps' own cloud
  # identity, is served at that address. Turning it off later leaves the
  # policies in place (the console never deletes one).
  blockMetadata: false
  # -- The kernel scheduler's log reading, bound in each team namespace (a
  # RoleBinding, vertra-scheduler-logs: the console's only RBAC write, held
  # to exactly that by the write fence) instead of cluster-wide. The kernel
  # chart's logs-only ClusterRole and its scheduler's ServiceAccount
  # (namespace/name; empty: this release's namespace, kernel-execution-kernel).
  # An empty clusterRole binds nothing (then set the kernel chart's
  # rbac.schedulerLogs: cluster).
  schedulerLogs:
    clusterRole: kernel-execution-kernel-scheduler-logs
    serviceAccount: ""
  # -- What each team's steps may use together, as a ResourceQuota
  # (vertra-team-quota) and LimitRange (vertra-team-limits) in its
  # namespace, unless an admin sets the team's own on its Settings tab.
  # Kubernetes quantities; empty: no limit. The cluster refuses a step over
  # them: one that can never fit fails (RESOURCES_NOT_ALLOWED), one waiting
  # for the team's other steps waits. CPU is capped only in total, never per
  # step, so a step may use spare CPU.
  quota:
    cpu: ""          # all its steps' CPU requests together, such as "8"
    memory: ""       # all their memory requests together, such as "32Gi"
    pods: ""         # its Pods at once, such as "20"
    stepMemory: ""   # the most one step may ask for, such as "8Gi"

# -- Fences the console's writes (Secrets, ServiceAccounts, Roles,
# RoleBindings, ExternalSecrets, SecretStores) to team namespaces: those carrying
# teamNamespaceLabel, as the kernel chart's dispatch policy uses
# (templates/write-fence-policy.yaml). Its ClusterRole alone would allow
# them anywhere.
writeFence:
  enabled: true
  teamNamespaceLabel: vertra/team

# -- Bundled Postgres, matching execution-kernel's own chart. To use your
# own instead, set postgres.enabled=false and either externalDatabaseUrl
# or existingSecret.
# -- TLS inside the cluster. enabled: this chart's own Postgres requires
# TLS, with a CA and certificate this chart makes once and keeps
# (templates/tls.yaml). kernelCaSecret: the kernel chart's CA
# (<release>-execution-kernel-tls-ca), which the console, its migration
# and the gateway trust for kernel-api (then https in kernelApiUrl) and the
# kernel's Postgres.
tls:
  enabled: true
  days: 3650
  kernelCaSecret: ""

postgres:
  enabled: true
  image:
    repository: postgres
    # Pinned, as every image the charts run is; the backup Jobs run it too
    # (pg_dump and pg_restore of the same major).
    tag: "16.15"
    digest: sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
  auth:
    username: postgres
    # -- Empty: generated on install and kept on upgrades (it lives in this
    # release's Secret). Set it only to choose your own (URL-safe) password.
    # Installs from before 2026-10-17 kept the old default, "postgres":
    # rotate it (docs/operations.md, "Databases").
    password: ""
    database: execution_console
  persistence:
    enabled: true
    size: 1Gi
    # -- Keep the volume (the data) when the release is uninstalled; delete
    # it explicitly when you mean to.
    keepOnUninstall: true
    storageClassName: ""
  # The `minimal` size's: each size (sizes/) sets these three together,
  # the settings to the memory. No CPU limit, so it can take a burst; memory
  # is limited to what's asked, and /dev/shm counts against it.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 512Mi
  # -- /dev/shm, for parallel queries (memory, counted in the limit above).
  sharedMemory: 128Mi
  # -- Postgres settings (postgres -c name=value). shared_buffers about a
  # quarter of the memory, effective_cache_size about three quarters; the
  # rest suit an SSD-backed volume. A key set here is added or replaces one.
  settings:
    shared_buffers: 128MB
    effective_cache_size: 384MB
    work_mem: 4MB
    maintenance_work_mem: 64MB
    max_connections: 100
    max_wal_size: 1GB
    checkpoint_completion_target: 0.9
    wal_compression: "on"
    random_page_cost: 1.1
    effective_io_concurrency: 200

# -- Only used when postgres.enabled is false: a full node-postgres URL,
# e.g. postgresql://user:pass@host:5432/dbname. Prefer existingSecret over
# this where possible -- this value is visible in `helm get values`.
externalDatabaseUrl: ""

# -- Only used when postgres.enabled is false: the name of a pre-existing
# Secret (in the release namespace) holding the database URL. Takes
# precedence over externalDatabaseUrl and never appears in Helm's own
# release history.
existingSecret: ""
existingSecretKey: "database-url"

# A managed database (postgres.enabled=false, its URL in existingSecret or
# externalDatabaseUrl):
database:
  # -- Sign in with the workload's own cloud identity instead of a
  # password: "gcp", Cloud SQL's IAM database authentication (Workload
  # Identity: serviceAccount.annotations, gateway.serviceAccountAnnotations),
  # or "aws", Amazon RDS's (EKS Pod Identity's roles, bound by
  # ServiceAccount name). The URLs then name a user and no password.
  iamAuth: ""
  # -- With iamAuth aws: the database's AWS region.
  region: ""
  # -- A Secret holding the server's CA (ca.crt), mounted at
  # /etc/vertra/tls-db for the URLs' sslrootcert.
  caSecret: ""

# -- A scheduled pg_dump of this chart's own Postgres (when the kernel's
# instance hosts the console's database, the kernel chart backs it up), checked with
# pg_restore --list, then copied to the chosen destination as
# <release>/<UTC timestamp>.pgdump. Only meaningful with postgres.enabled:
# an external database has its own backups, so this is skipped otherwise.
# Cloud destinations sign in with the cluster's workload identity (no
# stored key), except an S3-compatible service that has none. Restoring:
# docs/operations.md, "Backups".
backup:
  enabled: false
  schedule: "0 8 * * *"
  # -- gcs | s3 | azure | pvc
  destination: gcs
  # -- For gcs, s3 and azure: a pre-existing ServiceAccount in the release
  # namespace, bound to a cloud identity allowed to write to the
  # destination (GKE Workload Identity, EKS Pod Identity or IRSA, AKS
  # Workload Identity). Not created here: the kernel chart's backup can
  # share it. Unused for pvc.
  serviceAccountName: "vertra-pg-backup"
  gcs:
    # -- Bucket name, no gs://. The identity needs roles/storage.objectCreator
    # and roles/storage.objectViewer on it (gsutil reads before writing).
    bucket: ""
    image: "gcr.io/google.com/cloudsdktool/google-cloud-cli:586.0.0-slim"  # amd64 and arm64
  s3:
    # -- Bucket name, no s3://. The identity needs s3:PutObject on it.
    bucket: ""
    region: ""
    # -- Only for an S3-compatible service (MinIO, Cloudflare R2, ...):
    # its URL, e.g. https://minio.example:9000.
    endpoint: ""
    # -- Only where no workload identity exists (S3-compatible services):
    # a Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
    credentialsSecret: ""
    image: "amazon/aws-cli:2.37.0"
  azure:
    # -- The identity needs Storage Blob Data Contributor on the container;
    # the ServiceAccount carries azure.workload.identity/client-id.
    storageAccount: ""
    container: ""
    image: "mcr.microsoft.com/azure-cli:2.89.1"
  pvc:
    # -- A PersistentVolumeClaim you create in the release namespace. Not
    # created by the chart: most storage classes bind a volume only once a
    # Pod uses it, which here is the first backup, so `helm --wait` would
    # hang on it. A volume in the same cluster protects against bad data,
    # not against losing the cluster or its storage: prefer a bucket where
    # there is one.
    claimName: ""
    # -- Dumps older than this are deleted after each backup. (For buckets,
    # set a lifecycle rule on the bucket instead.)
    keepDays: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3


# -- Whether catalog images must be signed to run: set it as the kernel
# chart's imageSignature.enabled. Shown on the Admin page only; the kernel
# chart (policy-controller) enforces it.
imageSignature:
  required: false

# -- A NetworkPolicy (templates/networkpolicy.yaml): when the console runs its
# own Postgres, only this release's Pods may reach it. Needs a CNI that
# enforces NetworkPolicy; others ignore it silently.
networkPolicy:
  enabled: true
  # -- NetworkPolicy peers allowed to scrape /metrics (the console's and
  # the gateway's metrics ports; nothing else may reach those), e.g.
  #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
  metricsFrom: []

# Prometheus (off by default). monitoring.provider says which, as in the
# kernel chart (set both the same):
# - operator: the Prometheus Operator's PodMonitor and PrometheusRule
#   (kube-prometheus-stack, VictoriaMetrics, ...; needs its CRDs);
# - google: GKE Managed Service for Prometheus's PodMonitoring and Rules;
# - bundled: a Prometheus of this chart's own (monitoring.prometheus).
# List the scraper in networkPolicy.metricsFrom, in both charts.
monitoring:
  # -- The console's /metrics port, never served by its Ingress. 0: off.
  port: 9090
  provider: operator
  # -- Where the install's Grafana is (https://...), linked from the Admin
  # page and Observe's Metrics for its dashboard. Empty: not linked.
  grafanaUrl: ""
  google:
    # -- Where GKE's managed collector runs: gmp-system, or gke-gmp-system on
    # Autopilot.
    collectorNamespace: gmp-system
  # -- With provider bundled: one Prometheus in this namespace, scraping
  # this release's Pods and the kernel release's (found through the
  # Kubernetes API, this namespace only), with both charts' alerts (the
  # kernel's from its <release>-execution-kernel-prometheus-rules
  # ConfigMap, reloaded when it changes). No Alertmanager: firing alerts
  # show on its own page (kubectl port-forward to its Service, 9090).
  prometheus:
    enabled: false
    image:
      repository: quay.io/prometheus/prometheus
      tag: v3.15.1
      digest: sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    # -- How long it keeps samples.
    retentionDays: 15
    # -- Its volume. Vertra's few hundred series need well under 1Gi for
    # 15 days.
    size: 2Gi
    storageClassName: ""
    interval: 30s
    # -- The kernel chart's release name, for its rules and kernel-api's
    # TLS name (its Service's).
    kernelRelease: kernel
    # -- Its ServiceAccount (default: <release>-execution-console-prometheus):
    # the name an AWS role is bound to by Pod Identity (vertra uses
    # vertra-prometheus).
    serviceAccountName: ""
    # -- Labels on every sample it sends on and alert it raises (say, which
    # install).
    externalLabels: {}
    # -- Send every sample on to a remote store too (Amazon Managed Service
    # for Prometheus: its workspace's .../api/v1/remote_write), signed as
    # the Pod's AWS identity when sigv4Region is set.
    remoteWrite:
      url: ""
      sigv4Region: ""
    # -- Send firing alerts to an Alertmanager (Amazon Managed Service for
    # Prometheus: https://aps-workspaces.<region>.amazonaws.com/workspaces/
    # <id>/alertmanager/), signed likewise. Without one, they show only on
    # its own Alerts page.
    alertmanager:
      url: ""
      sigv4Region: ""
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {memory: 1Gi}
  podMonitor:
    # -- A PodMonitor (or PodMonitoring) for the console and the gateway;
    # not used with bundled.
    enabled: false
    interval: 30s
    # -- Labels your Prometheus selects PodMonitors by (kube-prometheus-
    # stack: release: <its release name>).
    labels: {}
  alerts:
    # -- A PrometheusRule (Rules; with bundled, the bundled Prometheus's own
    # rules): the console failing calls, the catalog not applying, the
    # gateway's backends failing.
    enabled: false
    labels: {}
  dashboard:
    # -- A ConfigMap holding Vertra's Grafana dashboard (steps, the console,
    # the gateway), for Grafana's dashboard sidecar to load.
    enabled: false
    # -- The label the sidecar looks for (kube-prometheus-stack's default).
    labels:
      grafana_dashboard: "1"
    # -- Its namespace, when the sidecar watches only Grafana's own.
    namespace: ""

migration:
  # Generous on purpose, same reasoning as execution-kernel's chart: the
  # migration Job isn't gated on Postgres actually being ready, so it
  # relies on the Job's own retry-with-backoff to ride out Postgres still
  # starting on a fresh install.
  backoffLimit: 10
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 256Mi

# -- Explicit, because without them GKE Autopilot assigns 500m CPU and
# 2Gi to every container and bills for it (measured use: under 25m and
# 100Mi). The CPU limit lets it burst (startup, password hashing) where
# the cluster allows bursting; elsewhere Autopilot sets limit = request.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 512Mi
