{{- if and (not .Values.postgres.enabled) (not .Values.externalDatabaseUrl) (not .Values.existingSecret) }}
{{- fail "Set postgres.enabled=true, or provide externalDatabaseUrl, or provide existingSecret." }}
{{- end }}
{{- if not .Values.existingSecret }}
{{- /* Once per render: on a fresh install every call is a new random value. */}}
{{- $postgresPassword := include "execution-kernel.postgresPassword" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "execution-kernel.databaseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ include "execution-kernel.databaseUrl" (dict "root" . "password" $postgresPassword) | quote }}
  {{- if .Values.postgres.enabled }}
  # Sourced by the bundled postgres Deployment's own POSTGRES_PASSWORD env
  # var (via secretKeyRef), so the password exists in exactly one place —
  # not also inline in that Deployment's plain-text spec.
  postgres-password: {{ $postgresPassword | quote }}
  {{- end }}
{{- end }}
