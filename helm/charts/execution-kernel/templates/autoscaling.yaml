{{- /*
Availability for the `resilient`, `scaled` and `auto` sizes (sizes/):
a HorizontalPodAutoscaler for kernel-api when api.autoscaling is on, and a
PodDisruptionBudget for each workload that can run two or more copies, so
drains and upgrades evict one copy at a time.
*/ -}}
{{- $fullname := include "execution-kernel.fullname" . }}
{{- $api := .Values.api }}
{{- if $api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}-api
  minReplicas: {{ $api.autoscaling.minReplicas }}
  maxReplicas: {{ $api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
{{- $apiMax := ternary $api.autoscaling.maxReplicas $api.replicaCount $api.autoscaling.enabled }}
{{- range $component, $copies := dict "api" $apiMax "scheduler" .Values.scheduler.replicaCount }}
{{- if ge (int $copies) 2 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "execution-kernel.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}
{{- end }}
