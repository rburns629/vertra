{{- if and .Values.postgres.enabled .Values.postgres.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "execution-kernel.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.postgres.persistence.keepOnUninstall }}
    # Uninstalling the release leaves the data; deleting it is a separate,
    # explicit step (vertra destroy asks).
    helm.sh/resource-policy: keep
    {{- end }}
    {{- if include "execution-kernel.postgresNonRoot" . }}
    # Made for Postgres running as its own user (postgres.nonRoot), or being
    # moved to it: the Pod's postgres-layout finishes a move when it starts.
    vertra.dev/postgres-layout: nonroot
    {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.postgres.persistence.storageClassName }}
  storageClassName: {{ .Values.postgres.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
{{- end }}
