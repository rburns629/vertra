apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "execution-kernel.fullname" . }}-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicaCount }}
  selector:
    matchLabels:
      {{- include "execution-kernel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "execution-kernel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.scheduler.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        # A ConfigMap change alone doesn't restart the Pod consuming it via
        # envFrom -- confirmed the hard way on execution-console's own
        # chart. Folding the rendered ConfigMap into this annotation
        # changes the pod template hash whenever it changes, so `helm
        # upgrade` rolls a fresh Pod automatically instead of silently
        # leaving the old env in place.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # The only workload in this chart that gets a ServiceAccount with any
      # Kubernetes API access — see templates/rbac.yaml. kernel-api never
      # touches the Kubernetes API, only Postgres.
      serviceAccountName: {{ include "execution-kernel.serviceAccountName" . }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "execution-kernel.appImage" . | quote }}
          # See kernel-api-deployment.yaml's identical comment -- an
          # unset imagePullPolicy defaults to Always for a "latest" tag.
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "-c"]
          args:
            - |
              import os, socket, time
              host = os.environ["POSTGRES_HOST"]
              port = int(os.environ["POSTGRES_PORT"])
              while True:
                  try:
                      socket.create_connection((host, port), timeout=2).close()
                      break
                  except OSError:
                      time.sleep(2)
          env:
            - name: POSTGRES_HOST
              value: {{ include "execution-kernel.fullname" . }}-postgres
            - name: POSTGRES_PORT
              value: "5432"
      {{- end }}
      containers:
        - name: scheduler
          image: {{ include "execution-kernel.appImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.scheduler"]
          ports:
            - name: metrics
              containerPort: {{ .Values.scheduler.metricsPort }}
          envFrom:
            - configMapRef:
                name: {{ include "execution-kernel.fullname" . }}-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "execution-kernel.databaseSecretName" . }}
                  key: {{ include "execution-kernel.databaseSecretKey" . }}
          # The scheduler touches its heartbeat file each time its loop comes
          # round (app/scheduler/__main__.py). A pass that hangs stops it, and
          # this restarts the Pod; the new one adopts the tasks it held.
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import os, sys, time
                  age = time.time() - os.path.getmtime({{ .Values.scheduler.heartbeatFile | quote }})
                  sys.exit(0 if age < {{ int .Values.scheduler.livenessSeconds }} else 1)
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
