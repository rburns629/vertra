apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "execution-kernel.fullname" . }}-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicaCount }}
  selector:
    matchLabels:
      {{- include "execution-kernel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "execution-kernel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.scheduler.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        # A ConfigMap change alone doesn't restart the Pod consuming it via
        # envFrom -- confirmed the hard way on execution-console's own
        # chart. Folding the rendered ConfigMap into this annotation
        # changes the pod template hash whenever it changes, so `helm
        # upgrade` rolls a fresh Pod automatically instead of silently
        # leaving the old env in place.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # The only workload in this chart that gets a ServiceAccount with any
      # Kubernetes API access — see templates/rbac.yaml. kernel-api never
      # touches the Kubernetes API, only Postgres.
      securityContext:
        {{- include "execution-kernel.podSecurityContext" . | nindent 8 }}
      volumes:
        - {name: tmp, emptyDir: {}}
      serviceAccountName: {{ include "execution-kernel.serviceAccountName" . }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "execution-kernel.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: scheduler
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "execution-kernel.appImage" . | quote }}
          securityContext:
            {{- include "execution-kernel.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          # See kernel-api-deployment.yaml's identical comment -- an
          # unset imagePullPolicy defaults to Always for a "latest" tag.
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/kernel", "wait-for-postgres", "{{ include "execution-kernel.fullname" . }}-postgres:5432"]
      {{- end }}
      containers:
        - name: scheduler
          image: {{ include "execution-kernel.appImage" . | quote }}
          securityContext:
            {{- include "execution-kernel.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/kernel", "scheduler"]
          ports:
            - name: metrics
              containerPort: {{ .Values.scheduler.metricsPort }}
          envFrom:
            - configMapRef:
                name: {{ include "execution-kernel.fullname" . }}-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "execution-kernel.databaseSecretName" . }}
                  key: {{ include "execution-kernel.databaseSecretKey" . }}
          # The scheduler touches its heartbeat file (SCHEDULER_HEARTBEAT_FILE)
          # each time its loop comes round (kernel/internal/scheduler/run.go).
          # A pass that hangs stops it, and this restarts the Pod; the new one
          # adopts the tasks it held.
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/kernel
                - check-heartbeat
                - {{ int .Values.scheduler.livenessSeconds | quote }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
