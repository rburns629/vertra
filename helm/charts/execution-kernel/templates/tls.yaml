{{/*
TLS inside the cluster (tls.enabled): a CA of this release's own, and the
certificates it signs for its Postgres and kernel-api, so every connection
to either is encrypted and every client checks it reached the real one
(sslmode=verify-full; HTTPS against this CA). No cert-manager or mesh
needed.

Made once, at install, and kept across upgrades by reading them back (as
the database passwords are; _helpers.tpl's tlsMade, which the Pods'
checksums read too); a server certificate is made again only when it's
missing or names other hosts. To rotate everything, delete both
Secrets and upgrade: the CA, then every certificate, is new, and every Pod
restarts with it (their checksum annotations).

Two Secrets: <release>-tls, the CA's key and the servers' certificates and
keys, mounted only by the server each is for (by item); and
<release>-tls-ca, the CA's certificate alone, which every client mounts,
the console chart's included (its kernelTls.caSecret).
*/}}
{{- if .Values.tls.enabled }}
{{- $fullname := include "execution-kernel.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $name := printf "%s-tls" $fullname }}
{{- include "execution-kernel.tlsMade" . }}
{{- $made := index .Values.tls "_made" }}
{{- $ca := $made.ca }}
{{- $certs := $made.certs }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ $ca.crt | b64enc }}
  ca.key: {{ $ca.key | b64enc }}
  {{- range $item, $cert := $certs }}
  {{ $item }}.crt: {{ $cert.crt | b64enc }}
  {{ $item }}.key: {{ $cert.key | b64enc }}
  {{ $item }}.hosts: {{ $cert.hosts | b64enc }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-ca
  namespace: {{ $ns }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ $ca.crt | b64enc }}
{{- end }}
