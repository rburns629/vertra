{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "execution-kernel.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# kernel-api's own identity: it only reviews callers' tokens (rbac.yaml),
# and has none of the scheduler's permissions over team namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "execution-kernel.apiServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
