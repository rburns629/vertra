{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "execution-kernel.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    # A ReadWriteOnce PVC can't be attached to two Pods at once — a rolling
    # update would deadlock waiting for a second Pod that can never mount it.
    type: Recreate
  selector:
    matchLabels:
      {{- include "execution-kernel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "execution-kernel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
      annotations:
        # kubectl logs and exec (and vertra's) reach this one, not the init container.
        kubectl.kubernetes.io/default-container: postgres
        {{- if .Values.tls.enabled }}
        # A rotated certificate (tls.yaml) or a changed pg_hba restarts it.
        checksum/tls: {{ (lookup "v1" "Secret" .Release.Namespace (printf "%s-tls" (include "execution-kernel.fullname" .))).data | toJson | sha256sum }}
        checksum/hba: {{ include "execution-kernel.pgHba" . | sha256sum }}
      {{- end }}
    spec:
      {{- $nonRoot := include "execution-kernel.postgresNonRoot" . }}
      {{- if $nonRoot }}
      # As its own user from the start (postgres.nonRoot): the volume's root
      # given its group once (OnRootMismatch), so it can make its data
      # directory, which then keeps the 0700 Postgres requires.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      {{- end }}
      {{- $layoutCheck := and $nonRoot .Values.postgres.persistence.enabled }}
      {{- if or $layoutCheck .Values.tls.enabled }}
      initContainers:
      {{- end }}
      {{- if $layoutCheck }}
        # The volume's layout, checked (and finished) before every start, as
        # Postgres's user. A volume made the image's way (as root) is moved
        # to this one by its first start here (postgres.nonRoot: true, never
        # by itself on an upgrade): its data is already pgdata/ (the root
        # layout's subPath), owned by 999 (the image's entrypoint chowned it),
        # so only its permissions change. The kubelet's first fsGroup pass
        # has, before any container runs, given the volume's group to every
        # file and opened them all (pgdata 2770, which Postgres refuses: it
        # wants 0700 or 0750). This closes them again, the contents first and
        # pgdata itself last, so a move interrupted anywhere is redone by the
        # next start, and a done one is left alone. Later starts get no
        # kubelet pass (OnRootMismatch: the volume's root is right by then).
        # (The image's entrypoint chmods pgdata itself to 0700 too, but not
        # what's in it, and refuses nothing.) Anything it can't move safely
        # it refuses, and Postgres doesn't start.
        - name: postgres-layout
          image: {{ include "execution-kernel.image" .Values.postgres.image | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              root=/var/lib/postgresql/data
              data=$root/pgdata
              refuse() {
                echo "postgres-layout: refusing to start: $*. Nothing was changed; see docs/operations.md, \"Moving Postgres to its own user\"." >&2
                exit 1
              }
              if [ ! -e "$data" ] && [ ! -L "$data" ]; then
                # A new volume: Postgres makes pgdata. Only ext4's lost+found
                # may be beside it, or this isn't a volume this chart made,
                # and Postgres would start an empty database next to its data.
                for f in "$root"/* "$root"/.[!.]* "$root"/..?*; do
                  if [ -e "$f" ] || [ -L "$f" ]; then
                    [ "$f" = "$root/lost+found" ] || refuse "the volume holds ${f#$root/} but no pgdata/, so it isn't one this chart made"
                  fi
                done
                echo "postgres-layout: a new volume"
                exit 0
              fi
              if [ -L "$data" ] || [ ! -d "$data" ]; then refuse "pgdata/ isn't a directory"; fi
              owner=$(stat -c %u "$data")
              [ "$owner" = 999 ] || refuse "pgdata/ is owned by user $owner, not Postgres's (999)"
              if [ -f "$data/PG_VERSION" ]; then
                version=$(cat "$data/PG_VERSION")
                [ "$version" = "$PG_MAJOR" ] || refuse "pgdata/ is Postgres $version's, this image is $PG_MAJOR"
              fi
              mode=$(stat -c %a "$data")
              if [ "$mode" = 750 ]; then
                # Group access chosen at initdb (its files 0640): left as it is.
                echo "postgres-layout: in place (pgdata 750)"
                exit 0
              fi
              open=$(find "$data" ! -type l -perm /2077 -print -quit)
              if [ "$mode" = 700 ] && [ -z "$open" ]; then
                echo "postgres-layout: in place"
                exit 0
              fi
              other=$(find "$data" ! -user 999 -print -quit)
              [ -z "$other" ] || refuse "${other#$root/} is owned by user $(stat -c %u "$other"), not Postgres's (999)"
              echo "postgres-layout: moving: pgdata $mode, its files opened by the volume's group; closing them"
              find "$data" -mindepth 1 ! -type l -perm /2077 -exec chmod g-rwxs,o-rwx {} +
              chmod u=rwx,g-rwxs,o-rwx "$data"
              echo "postgres-layout: moved"
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      {{- end }}
      {{- if .Values.tls.enabled }}
        # Postgres reads its key only if no one else can: copied from the
        # Secret into a directory of its own, owned by its user (999), 0600.
        # (fsGroup would do it for the Secret, but would also open the data
        # directory's permissions, which Postgres refuses.)
        - name: tls-key
          image: {{ include "execution-kernel.image" .Values.postgres.image | quote }}
          {{- if $nonRoot }}
          command: ["sh", "-c", "install -m 0644 /tls-secret/tls.crt /tls/tls.crt && install -m 0600 /tls-secret/tls.key /tls/tls.key"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          {{- else }}
          command: ["sh", "-c", "install -o 999 -g 999 -m 0644 /tls-secret/tls.crt /tls/tls.crt && install -o 999 -g 999 -m 0600 /tls-secret/tls.key /tls/tls.key"]
          {{- end }}
          volumeMounts:
            - {name: tls-secret, mountPath: /tls-secret, readOnly: true}
            - {name: tls, mountPath: /tls}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      {{- end }}
      containers:
        - name: postgres
          image: {{ include "execution-kernel.image" .Values.postgres.image | quote }}
          # Its settings, sized to its memory by the size (postgres.settings).
          # With TLS, pg_hba accepts only TLS connections from the network
          # (local ones, the Pod's own tools, stay as they were).
          args:
            - postgres
            {{- range $name, $value := .Values.postgres.settings }}
            - -c
            - {{ printf "%s=%v" $name $value | quote }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/tls/tls.crt
            - -c
            - ssl_key_file=/tls/tls.key
            - -c
            - hba_file=/etc/vertra/pg/pg_hba.conf
            {{- end }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "execution-kernel.databaseSecretName" . }}
                  key: postgres-password
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            {{- if and $nonRoot .Values.postgres.persistence.enabled }}
            # The volume's pgdata, as Postgres made it (the same place the
            # root layout's subPath puts it).
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            {{- end }}
          {{- if $nonRoot }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          {{- end }}
          volumeMounts:
            {{- if .Values.postgres.persistence.enabled }}
            - name: data
              mountPath: /var/lib/postgresql/data
              {{- if not $nonRoot }}
              # Not the PVC root directly: initdb refuses to run in a
              # non-empty directory, and a fresh PVC on some storage
              # classes already contains a lost+found directory. (As its
              # own user, PGDATA is that subdirectory, which it makes.)
              subPath: pgdata
              {{- end }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: hba, mountPath: /etc/vertra/pg, readOnly: true}
            {{- end }}
            # Parallel queries share memory through /dev/shm, which a
            # container otherwise gets only 64 MiB of.
            - {name: shm, mountPath: /dev/shm}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.postgres.sharedMemory | quote }}
        {{- if .Values.postgres.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "execution-kernel.fullname" . }}-postgres
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls-secret
          secret:
            secretName: {{ include "execution-kernel.fullname" . }}-tls
            items:
              - {key: postgres.crt, path: tls.crt}
              - {key: postgres.key, path: tls.key}
        - {name: tls, emptyDir: {medium: Memory}}
        - name: hba
          configMap:
            name: {{ include "execution-kernel.fullname" . }}-postgres-hba
        {{- end }}
{{- if .Values.tls.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "execution-kernel.fullname" . }}-postgres-hba
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
data:
  pg_hba.conf: |
    {{- include "execution-kernel.pgHba" . | nindent 4 }}
{{- end }}
{{- end }}
