{{/*
Only kernel-scheduler gets any Kubernetes API access — kernel-api talks
only to Postgres. A ClusterRole, not a Role: each task declares its own
owning `team`, which becomes its dispatch
namespace, so the scheduler must be able to create/watch Jobs across every
team namespace, not just one fixed namespace. See the rbac trade-off note
in values.yaml for the narrower per-namespace alternative this deliberately
isn't.
*/}}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "execution-kernel.fullname" . }}-scheduler
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
# Exactly the calls kernel/internal/executor makes: Jobs created, read
# (status included), listed for the orphan sweep, watched, deleted; their
# Pods listed and watched; the request ConfigMap created and deleted;
# events listed, to tell a Pod the team's limits refuse for good from one
# waiting for room in its quota. Its steps' logs: the role below.
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "execution-kernel.fullname" . }}-scheduler
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "execution-kernel.fullname" . }}-scheduler
subjects:
  - kind: ServiceAccount
    name: {{ include "execution-kernel.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Reading its steps' logs (their last lines, when they finish), apart: bound
# in each team namespace by the console (rbac.schedulerLogs: teamNamespaces,
# its only RBAC write), or cluster-wide (cluster).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "execution-kernel.fullname" . }}-scheduler-logs
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
{{- if eq .Values.rbac.schedulerLogs "cluster" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "execution-kernel.fullname" . }}-scheduler-logs
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "execution-kernel.fullname" . }}-scheduler-logs
subjects:
  - kind: ServiceAccount
    name: {{ include "execution-kernel.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else if ne .Values.rbac.schedulerLogs "teamNamespaces" }}
{{- fail "rbac.schedulerLogs must be teamNamespaces or cluster." }}
{{- end }}
{{- end }}
{{- if .Values.api.auth.enabled }}
---
# kernel-api checks each caller's token with a TokenReview
# (kernel/internal/api/auth.go). system:auth-delegator is Kubernetes' built-in role for exactly
# that: creating TokenReviews and SubjectAccessReviews, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "execution-kernel.fullname" . }}-api-token-review
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "execution-kernel.apiServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
