apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "execution-kernel.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "execution-kernel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "execution-kernel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # kubectl logs (and vertra logs) read this one, not the init container.
        kubectl.kubernetes.io/default-container: api
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        # See kernel-scheduler-deployment.yaml's identical annotation --
        # same ConfigMap, same fix.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.tls.enabled }}
        # A rotated certificate restarts it (tls.yaml).
        checksum/tls: {{ (lookup "v1" "Secret" .Release.Namespace (printf "%s-tls" (include "execution-kernel.fullname" .))).data | toJson | sha256sum }}
        {{- end }}
    spec:
      securityContext:
        {{- include "execution-kernel.podSecurityContext" . | nindent 8 }}
      volumes:
        - {name: tmp, emptyDir: {}}
        {{- include "execution-kernel.tlsCaVolume" . | nindent 8 }}
        {{- if .Values.tls.enabled }}
        # Its own certificate and key alone (tls.yaml), for HTTPS.
        - name: tls-server
          secret:
            secretName: {{ include "execution-kernel.fullname" . }}-tls
            items:
              - {key: api.crt, path: tls.crt}
              - {key: api.key, path: tls.key}
        {{- end }}
      serviceAccountName: {{ include "execution-kernel.apiServiceAccountName" . }}
      # Copies on different nodes where there's a choice, so one node's
      # maintenance doesn't take them all.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "execution-kernel.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "execution-kernel.appImage" . | quote }}
          securityContext:
            {{- include "execution-kernel.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          # Explicit, not left to default -- Kubernetes defaults an unset
          # imagePullPolicy to Always whenever the tag is "latest",
          # regardless of what's already on the node (confirmed directly:
          # this container attempted a live registry pull even with the
          # image already loaded via `kind load docker-image`, in
          # execution-console's near-identical initContainer, until this
          # was set there and here).
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/kernel", "wait-for-postgres", "{{ include "execution-kernel.fullname" . }}-postgres:5432"]
      {{- end }}
      containers:
        - name: api
          image: {{ include "execution-kernel.appImage" . | quote }}
          securityContext:
            {{- include "execution-kernel.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- include "execution-kernel.tlsCaMount" . | nindent 12 }}
            {{- if .Values.tls.enabled }}
            - {name: tls-server, mountPath: /etc/vertra/tls-server, readOnly: true}
            {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # KernelService over Connect, /health and /metrics, on API_PORT (8000).
          command: ["/usr/local/bin/kernel", "api"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "execution-kernel.fullname" . }}-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "execution-kernel.databaseSecretName" . }}
                  key: {{ include "execution-kernel.databaseSecretKey" . }}
            {{- if .Values.tls.enabled }}
            - {name: API_TLS_CERT_FILE, value: /etc/vertra/tls-server/tls.crt}
            - {name: API_TLS_KEY_FILE, value: /etc/vertra/tls-server/tls.key}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
