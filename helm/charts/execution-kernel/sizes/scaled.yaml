# The `scaled` size for the execution-kernel chart: three copies of the
# console and kernel-api and two schedulers, for many teams and steps.
#
# Layer it under your own values: helm upgrade --install kernel <chart> -f
# execution-kernel/sizes/scaled.yaml -f <yours>.
# Where steps run (Spot) depends on the cluster: set scheduler.taskPlacement yourself.
api:
  replicaCount: 3
scheduler:
  replicaCount: 2
  # Most steps at once, in all and per team; more wait their turn.
  maxRunningTasks: 200
  maxRunningTasksPerTeam: 50
  # The size of a step that doesn't set its own (product.yaml or the DAG).
  taskDefaultResources:
    cpu: 500m
    memory: 1Gi
  claimLimit: 100
  executorConcurrency: 32
executionRetentionDays: 90
postgres:
  persistence:
    # Volumes grow but never shrink: a smaller figure than an existing
    # volume's is refused by Kubernetes.
    size: 100Gi
