# Values for Sigstore's policy-controller on the GKE cluster, which verifies
# catalog image signatures for the execution-kernel chart's imageSignature:
#   helm upgrade --install policy-controller sigstore/policy-controller \
#     --version 0.10.8 -n cosign-system --create-namespace \
#     -f helm/values/gke/policy-controller.yaml
# Its GSA (vertra-signature-verifier) has artifactregistry.reader on
# catalog-products, through Workload Identity.
#
# Two things that bit when it was rolled out (2026-10-01):
#  - In every namespace it covers, it refuses ANY image it can't resolve to a
#    digest, not just the ones a policy matches. So it may only cover
#    namespaces whose images its identity can read. `default` is excluded
#    while the platform itself (platform-images) still runs there; covering
#    it blocked the kernel's migration hook and every rollout.
#  - It owns its webhooks' namespaceSelector, so changing the selector with
#    Helm needs --force-conflicts once.
webhook:
  replicaCount: 2
  # Team namespaces, minus `default`: on GKE the platform itself still runs
  # there, and policy-controller requires every image in a namespace it
  # covers to resolve to a digest, which it can't do for platform-images.
  # Drop the NotIn once the platform has moved to its own namespace.
  namespaceSelector:
    matchExpressions:
      - key: vertra/team
        operator: Exists
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: ["default"]
  configData:
    no-match-policy: allow
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: vertra-signature-verifier@my-gcp-project.iam.gserviceaccount.com
