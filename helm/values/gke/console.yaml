# execution-console on GKE (release `console`, namespace default):
#   make gke-deploy VERSION=v<x.y.z>   (the release's signed chart and images)
#   or: helm upgrade --install console oci://ghcr.io/rburns629/vertra/charts/execution-console --version <x.y.z> -n default \
#     --kube-context gke_my-gcp-project_us-central1_vertra-gke \
#     -f helm/values/gke/console.yaml
# No bootstrapAdmin.password here on purpose: a fresh install generates one
# and prints it once to the migration Job's log.
# A release's image, signed by its workflow (make gke-deploy VERSION=v...):
# no tag, so the release's chart runs its own (appVersion).
# gke-deploy-console-from-source overrides both for a working-copy build.
image:
  repository: ghcr.io/rburns629/vertra/execution-console
  pullPolicy: IfNotPresent
backup:
  enabled: false
kernelApiUrl: http://kernel-execution-kernel-api.default.svc.cluster.local:8000
# Public, over plain HTTP: put TLS in front of it before real use (TODO.md).
service:
  type: LoadBalancer
  # Keep each browser's real IP, so the login limit (per client IP and
  # email) applies per attacker. With the default, every client arrives as
  # one of the nodes' IPs and shares one counter: ten bad guesses then lock
  # the account out for everyone.
  externalTrafficPolicy: Local
# Checks a DAG's images exist in Artifact Registry before running it, with
# short-lived tokens from Workload Identity (no stored key).
registryCheck:
  gcpMetadataToken: true
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: vertra-console-registry@my-gcp-project.iam.gserviceaccount.com
# Scan Jobs pull the images they scan as the same read-only registry
# identity (its Workload Identity binding must also name the scanner
# ServiceAccount, console-execution-console-scanner).
scanning:
  serviceAccountAnnotations:
    iam.gke.io/gcp-service-account: vertra-console-registry@my-gcp-project.iam.gserviceaccount.com
# The catalog's release, which this console reads and applies (catalog CI
# pushes it from main). Signed with the same key as the images (the kernel
# values' imageSignature), so it's verified the same way.
catalog:
  release: us-central1-docker.pkg.dev/my-gcp-project/catalog-products/catalog-release:latest
  signature:
    publicKeys:
      - |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEaDo0mkZuGxOGub0gDZwZoWQnqL0t
        WwmAwv/QbAbjM8xn8prY+E+0b9cf4WaxdVdqaqC+G87jHxa4XNvgcCweKg==
        -----END PUBLIC KEY-----
# The "Connect a source" wizard: where the PR goes, and what GCP, Azure and
# AWS must trust for this cluster's ServiceAccounts.
secretSources:
  catalogRepo: my-org/vertra-catalog
  clusterIssuer: https://container.googleapis.com/v1/projects/my-gcp-project/locations/us-central1/clusters/vertra-gke
  gcpWorkloadIdentityPool: my-gcp-project.svc.id.goog
  gkeClusterName: vertra-gke
  gkeClusterLocation: us-central1

# What each team's steps may use together (teamNamespaces.quota in the
# chart); an admin can set a team's own on its Settings tab.
teamNamespaces:
  quota:
    cpu: "16"
    memory: "64Gi"
    pods: "50"
    stepMemory: "16Gi"
