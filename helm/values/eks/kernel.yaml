# execution-kernel on EKS (Auto Mode), as `vertra apply` writes it for an
# install of its own (vertra.yaml target: aws): an example to start from
# when installing with Helm by hand. Account 123456789012, us-east-2,
# install `vertra`, platform namespace vertra-system:
#   helm upgrade --install kernel oci://ghcr.io/rburns629/vertra/charts/execution-kernel --version <x.y.z> \
#     -n vertra-system --create-namespace --force-conflicts \
#     --kube-context <context> -f helm/values/eks/kernel.yaml
# The release's own image (appVersion): no image block.
backup:
  enabled: false
# One Postgres (in a Pod, on an EBS volume) for both databases, each with its
# own role: the console's console.yaml reads kernel-execution-kernel-console-db,
# and its gateway kernel-execution-kernel-gateway-db, both made here.
postgres:
  consoleDatabase:
    enabled: true
# Where catalog CI publishes product images (ECR, under one prefix). The
# image policy seeds from this on first install; afterwards the Admin page
# owns the list.
imagePolicy:
  sourceRegistry: 123456789012.dkr.ecr.us-east-2.amazonaws.com/vertra-products
# Catalog images must carry catalog CI's signature (needs policy-controller,
# policy-controller.yaml): the public half of the AWS KMS key only the
# catalog's CI may sign with (`aws kms get-public-key`, as PEM), and/or its
# keyless identity.
imageSignature:
  enabled: true
  publicKeys:
    - |
      -----BEGIN PUBLIC KEY-----
      <the KMS key's public half>
      -----END PUBLIC KEY-----
  keyless:
    issuer: ""
    subjectRegExp: ""
scaleDown:
  enabled: true
  idleAfterMinutes: 120
scheduler:
  # Steps run on their own node pool (a Karpenter NodePool, vertra-steps:
  # label vertra.dev/pool=steps, taint vertra.dev/steps=true:NoSchedule),
  # which scales from zero and takes Spot and on-demand nodes.
  taskPlacement:
    nodeSelector:
      vertra.dev/pool: steps
    tolerations:
      - {key: vertra.dev/steps, operator: Equal, value: "true", effect: NoSchedule}
  # Where a product asking for a kind of capacity (product.yaml's capacity)
  # runs instead: Karpenter's label picks one on the same pool.
  capacityPlacements:
    spot:
      nodeSelector: {vertra.dev/pool: steps, karpenter.sh/capacity-type: spot}
      tolerations:
        - {key: vertra.dev/steps, operator: Equal, value: "true", effect: NoSchedule}
    onDemand:
      nodeSelector: {vertra.dev/pool: steps, karpenter.sh/capacity-type: on-demand}
      tolerations:
        - {key: vertra.dev/steps, operator: Equal, value: "true", effect: NoSchedule}
