# execution-console on the local kind cluster (release `console`,
# namespace acyclix-system):
#   helm upgrade --install console helm/charts/execution-console -n acyclix-system \
#     --kube-context kind-acyclix-local -f helm/values/kind/console.yaml
kernelApiUrl: http://kernel-execution-kernel-api.acyclix-system.svc.cluster.local:8000
environmentLabel: Kubernetes
replicaCount: 1
image:
  repository: execution-console
  tag: latest
# No Postgres of its own: its database lives on the kernel's instance
# (postgres.consoleDatabase in kernel.yaml), which creates this Secret.
postgres:
  enabled: false
existingSecret: kernel-execution-kernel-console-db
existingSecretKey: database-url
# Demo-only, and only ever on this local cluster: the first admin is
# created with this password on a fresh install. Never reuse it anywhere
# reachable by anyone else.
# Pinning images to digests asks the local registry through the name it has
# inside the cluster (the nodes map localhost:5001 to it the same way).
registryCheck:
  mirrors:
    localhost:5001: http://kind-registry:5000
bootstrapAdmin:
  password: acyclix-local
# The "Connect a source" wizard. kind's tokens aren't trusted by any cloud,
# so only stored-credential sources (1Password) are offered here.
secretSources:
  catalogRepo: my-org/acyclix-catalog
