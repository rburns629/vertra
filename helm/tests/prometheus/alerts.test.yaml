# The charts' alerts as the bundled Prometheus evaluates them (both charts
# rendered with monitoring.provider bundled into rules/; run by
# helm/tests/prometheus-rules.sh). Release kernel and console, namespace
# vertra-system.
rule_files:
  - rules/kernel.rules.yaml
  - rules/console.rules.yaml
evaluation_interval: 30s

tests:
  # A scheduler Pod that can't be scraped (crashing, hung) is down.
  - interval: 30s
    input_series:
      - series: 'up{namespace="vertra-system", pod="kernel-execution-kernel-scheduler-abc", component="scheduler"}'
        values: '0x40'
      - series: 'kernel_scheduler_tick_duration_seconds_count{namespace="vertra-system", pod="kernel-execution-kernel-scheduler-abc"}'
        values: '_x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: VertraSchedulerDown
        exp_alerts: []
      - eval_time: 12m
        alertname: VertraSchedulerDown
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: No scheduler has finished a pass in 10 minutes.
              description: Nothing will start or finish. Check the scheduler's Pods and logs (docs/operations.md, Troubleshooting).

  # Up but finishing no passes is down too; passing is not; and asleep
  # (no Pod, so no series at all) is not.
  - interval: 30s
    input_series:
      - series: 'up{namespace="vertra-system", pod="kernel-execution-kernel-scheduler-abc", component="scheduler"}'
        values: '1x40'
      - series: 'kernel_scheduler_tick_duration_seconds_count{namespace="vertra-system", pod="kernel-execution-kernel-scheduler-abc"}'
        values: '100x40'
      - series: 'up{namespace="vertra-system", pod="kernel-execution-kernel-scheduler-def", component="scheduler"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: VertraSchedulerDown
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: No scheduler has finished a pass in 10 minutes.
              description: Nothing will start or finish. Check the scheduler's Pods and logs (docs/operations.md, Troubleshooting).
  - interval: 30s
    input_series:
      - series: 'up{namespace="vertra-system", pod="kernel-execution-kernel-scheduler-abc", component="scheduler"}'
        values: '1x40'
      - series: 'kernel_scheduler_tick_duration_seconds_count{namespace="vertra-system", pod="kernel-execution-kernel-scheduler-abc"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: VertraSchedulerDown
        exp_alerts: []
  - interval: 30s
    input_series:
      - series: 'up{namespace="vertra-system", pod="console-execution-console-abc", component="app"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: VertraSchedulerDown
        exp_alerts: []

  # Steps waiting past readyWaitSeconds (600).
  - interval: 30s
    input_series:
      - series: 'kernel_oldest_ready_task_age_seconds{namespace="vertra-system"}'
        values: '0+30x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: VertraStepsWaiting
        exp_alerts: []
      - eval_time: 16m
        alertname: VertraStepsWaiting
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: A step has waited 16m 0s to start.
              description: Steps are ready but not starting. The cluster may be out of room, a team at its limit, or the scheduler behind.

  # A started step's Pod with no node past unschedulableSeconds (600).
  - interval: 30s
    input_series:
      - series: 'kernel_oldest_unschedulable_step_age_seconds{namespace="vertra-system", pod="kernel-execution-kernel-scheduler-a"}'
        values: '0+30x40'
      - series: 'kernel_oldest_unschedulable_step_age_seconds{namespace="vertra-system", pod="kernel-execution-kernel-api-a"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: VertraStepsUnschedulable
        exp_alerts: []
      - eval_time: 16m
        alertname: VertraStepsUnschedulable
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: A step's Pod has had no node to run on for 16m 0s.
              description: Steps were started but no node has room for them, and the cluster isn't making one (at its node limit, or out of a quota such as the region's SSD). kubectl get events -A --field-selector reason=FailedScheduling says why; so does the autoscaler's NotTriggerScaleUp.

  # The console failing more than 5% of its calls.
  - interval: 30s
    input_series:
      - series: 'console_rpc_requests_total{namespace="vertra-system", procedure="vertra.console.v1.ExecutionService/GetExecution", code="ok"}'
        values: '0+90x60'
      - series: 'console_rpc_requests_total{namespace="vertra-system", procedure="vertra.console.v1.ExecutionService/GetExecution", code="internal"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: VertraConsoleFailing
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: More than 5% of the console's calls are failing.
              description: Each is logged in full by the console (maskErrors). Usually its database, kernel-api or the Kubernetes API.
      - eval_time: 20m
        alertname: VertraSignInBurst
        exp_alerts: []
