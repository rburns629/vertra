# Go for acyclixctl and catalogctl (`make proto`), from the plugins pinned
# as tools in cli/go.mod. Output is committed.
version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/rburns629/acyclix/cli/internal/gen
plugins:
  - local: protoc-gen-go
    out: cli/internal/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: cli/internal/gen
    opt: paths=source_relative
