# TypeScript for the console (`make proto`): its own API and kernel-api's,
# which it calls. From the console's own pinned @bufbuild/protoc-gen-es.
# Output is committed.
version: v2
clean: true
plugins:
  - local: console/node_modules/.bin/protoc-gen-es
    out: console/src/gen
    opt: [target=ts, import_extension=js]
