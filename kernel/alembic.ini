[alembic]
script_location = app/persistence/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# sqlalchemy.url is intentionally left blank here — app/persistence/migrations/env.py sources
# the real URL from app.config.get_settings() (DATABASE_URL / .env), so the
# same migration works locally, in CI, and in the Kubernetes migration Job
# without editing this file.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
