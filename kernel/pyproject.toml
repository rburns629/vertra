[project]
name = "execution-kernel"
version = "0.1.0"
description = "Lightweight, container-native DAG execution kernel"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "docker>=7.1",
    # <37 until the kernel is checked against it: 37.0.0 is the first to
    # ship type information, so mypy now checks every call (TODO.md).
    "kubernetes>=30.1,<37",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-docker>=7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic-generated; hand-editing them to satisfy line length or modern
# typing/import style fights autogenerate's template.
"app/persistence/migrations/versions/*.py" = ["E501", "I001", "UP007", "UP035"]
# `Depends(...)` as an argument default is FastAPI's documented pattern, not
# the mutable-default-argument bug B008 exists to catch.
"app/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
files = ["app", "tests"]
# Each example is a standalone script built into its own container image —
# not part of the app package, and (deliberately) shares no code with its
# sibling examples, so it isn't part of this project's typed package tree.
exclude = ["^examples/"]

[[tool.mypy.overrides]]
# No py.typed marker and no types-kubernetes stub package exists (unlike
# types-docker for the Docker SDK).
module = ["kubernetes.*"]
ignore_missing_imports = true
