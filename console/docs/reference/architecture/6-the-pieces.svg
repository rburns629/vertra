);"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="13" y="208">Kubernetes cluster</text></g></g></g><g data-cell-id="6-11"><g><rect x="21" y="221" width="720" height="215" rx="2.15" ry="2.15" fill="none" stroke="#d79b00" stroke-width="2" stroke-dasharray="6 6" pointer-events="all" style="stroke: rgb(215, 155, 0);"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="33" y="243">vertra-system · the platform</text></g></g></g><g data-cell-id="6-12"><g transform="translate(0.5,0.5)"><rect x="41" y="256" width="190" height="72" rx="4.32" ry="4.32" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: rgb(255, 230, 204); stroke: rgb(215, 155, 0);"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="136" y="280">kernel-scheduler</text></g></g><g data-cell-id="6-13"><g><rect x="41" y="282" width="190" height="46" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(0, 0, 0);"><text x="136" y="299">claims ready steps,</text><text x="136" y="312">starts and watches them</text></g></g></g></g><g data-cell-id="6-14"><g transform="translate(0.5,0.5)"><rect x="286" y="256" width="190" height="72" rx="4.32" ry="4.32" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: rgb(255, 230, 204); stroke: rgb(215, 155, 0);"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="381" y="280">kernel-api</text></g></g><g data-cell-id="6-15"><g><rect x="286" y="282" width="190" height="46" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-