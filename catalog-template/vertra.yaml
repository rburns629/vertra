# Where this catalog publishes, read by ./vertra, the
# same in CI and on a laptop. Anything here can be overridden per run with
# environment variables (shown on each line), which is how CI points the
# same files at a hosted registry.

# Images are pushed to <registry>/<team>/<product>, the path derived
# from the product's folder: teams/<team>/products/<product>/, and the
# catalog's release (`./vertra catalog release`) to <registry>/catalog-release,
# where each install's console reads it.
# VERTRA_REGISTRY. On kind: the local registry from `make kind-registry`.
registry: localhost:5001

# VERTRA_PLATFORM: what images are built for, such as linux/arm64 for a
# cluster of Arm nodes. Empty: this machine's own for a local registry,
# linux/amd64 for any other (so a Mac's builds run on a cloud cluster).
platform: ""

signing:
  # VERTRA_SIGNING_MODE:
  #   none     not signed (local installs, which don't verify signatures)
  #   key      a cosign key: a generated key pair or a cloud KMS key
  #   keyless  CI's OIDC identity, recorded in the public transparency log
  mode: none
  # VERTRA_SIGNING_KEY, for mode "key": a cosign key reference, such as
  # env://COSIGN_PRIVATE_KEY (a generated key, its password in
  # COSIGN_PASSWORD), gcpkms://..., awskms://..., azurekms://... or
  # hashivault://...
  key: ""
