name: check-secret-stores

# On a pull request that touches a team's secret-stores/, the same check
# the console makes before applying them (./catalogctl secret-stores check),
# so the author hears about a problem before review. No credentials.
on:
  pull_request:
    paths: ["teams/*/secret-stores/**", "tools/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check every team's SecretStore files
        run: ./catalogctl secret-stores check
