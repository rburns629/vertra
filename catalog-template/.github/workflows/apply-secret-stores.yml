name: apply-secret-stores

# After a merge to main, applies each team's reviewed
# teams/<team>/secret-stores/*.yaml through the console, which checks
# it again (this team's namespace only, ESO's own ServiceAccounts, a stored
# credential only from eso-auth) and applies it. Holds no cluster
# credentials. Push to main only: a pull request is checked by
# check-secret-stores.yml, and reviewed through CODEOWNERS (admins only).
#
#   vars.ACYCLIX_CONSOLE_URL      the console
#   secrets.ACYCLIX_TOKEN         a bot token with secret-stores:apply
#   BOOTSTRAP_CREDENTIAL          in the team's own GitHub Environment, only
#                                 for a provider that can't federate (a
#                                 1Password token): written to eso-auth
on:
  push:
    branches: [main]
    paths: ["teams/*/secret-stores/**"]
  # Re-applies every team's, for repairing drift.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      teams: ${{ steps.find.outputs.teams }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: find
        run: |
          # teams/<team>/secret-stores/*.yaml -> <team>
          teams=$(find teams -mindepth 3 -maxdepth 3 -path '*/secret-stores/*.yaml' | cut -d/ -f2 | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "teams=$teams" >> "$GITHUB_OUTPUT"

  apply:
    needs: discover
    if: needs.discover.outputs.teams != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        team: ${{ fromJson(needs.discover.outputs.teams) }}
    # So each team's job sees only its own BOOTSTRAP_CREDENTIAL.
    environment: ${{ matrix.team }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Apply this team's SecretStore
        env:
          TEAM: ${{ matrix.team }}
          ACYCLIX_CONSOLE_URL: ${{ vars.ACYCLIX_CONSOLE_URL }}
          ACYCLIX_TOKEN: ${{ secrets.ACYCLIX_TOKEN }}
          BOOTSTRAP_CREDENTIAL: ${{ secrets.BOOTSTRAP_CREDENTIAL }}
        run: ./catalogctl secret-stores apply "$TEAM"
