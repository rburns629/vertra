name: retire-teams

# The reversible first step of removing a team: runs when a merge to
# main removes a `teams/<team>/` folder. For each removed team the
# console:
#
#   - relabels its namespace acyclix/team=retired, so the kernel starts no
#     new step there, while anything already running finishes;
#   - retires its team: read-only (no new submissions, secrets, bots or
#     products), its products unregistered.
#
# Nothing is deleted. Restoring the folder re-onboards the team
# (apply-teams.yml). Deleting for real is purge-team.yml, run by hand after
# a grace period. Calls only the console, so it holds no cluster credentials.
#
#   vars.ACYCLIX_CONSOLE_URL   the console
#   secrets.ACYCLIX_TOKEN      a bot token with teams:retire
on:
  push:
    branches: [main]
    paths: ["teams/*/**"]

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # to see which folders existed before this push
      - name: Retire the teams this push removed
        env:
          # Without a usable "before" (a new branch, a force-push) nothing is
          # retired: the tool never guesses at that.
          BEFORE: ${{ github.event.before }}
          ACYCLIX_CONSOLE_URL: ${{ vars.ACYCLIX_CONSOLE_URL }}
          ACYCLIX_TOKEN: ${{ secrets.ACYCLIX_TOKEN }}
        run: ./catalogctl teams retire --removed-since "$BEFORE"
