name: check-new-team-names

# Fails a pull request that adds a new teams/<team>/ folder whose
# name is already a team's in the console (created by hand, or a purged
# team's, whose name is reserved). apply-teams.yml would otherwise make
# the new folder that team's, its namespace and history included. An
# existing team folder's team is expected to exist, so only new folders count.
#
# Make it a required status check on main (Settings -> Branches). No paths
# filter, since a required check that never starts blocks the pull request.
on:
  pull_request: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: find-new
        name: Find team folders newly added by this PR
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          before=$(git ls-tree -d --name-only "${PR_BASE}" teams/ 2>/dev/null \
            | xargs -n1 basename | sort -u || true)
          after=$(find teams -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort -u)
          new_teams=$(comm -13 <(echo "$before") <(echo "$after"))
          echo "Existing teams (base): $(echo "$before" | tr '\n' ' ')"
          echo "Teams in this PR: $(echo "$after" | tr '\n' ' ')"
          echo "Newly added by this PR: ${new_teams:-<none>}"
          {
            echo "new_teams<<TEAMS_EOF"
            echo "$new_teams"
            echo "TEAMS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fail if any newly-added team's name collides with an existing team
        if: steps.find-new.outputs.new_teams != ''
        env:
          ACYCLIX_TOKEN: ${{ secrets.ACYCLIX_TOKEN }}
          NEW_TEAMS: ${{ steps.find-new.outputs.new_teams }}
          ACYCLIX_CONSOLE_URL: ${{ vars.ACYCLIX_CONSOLE_URL }}
        run: |
          failed=0
          while IFS= read -r team; do
            [ -z "$team" ] && continue
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $ACYCLIX_TOKEN" \
              "${ACYCLIX_CONSOLE_URL}/api/teams/$team")
            if [ "$status" = "200" ]; then
              echo "::error::Team '$team' is new to this catalog, but a team named '$team' already exists in the Acyclix console. A new team folder must not silently attach to an existing team's namespace -- rename this folder, or get explicit sign-off before merging if reusing that team is actually intentional."
              failed=1
            elif [ "$status" != "404" ]; then
              echo "::error::Unexpected response ($status) checking whether team '$team' exists."
              failed=1
            else
              echo "OK: '$team' has no existing team -- safe to onboard as new."
            fi
          done <<< "$NEW_TEAMS"
          exit $failed
