name: purge-team

# Irreversible deletion of a team that retire-teams.yml already retired.
# Run by hand from the Actions tab after the grace period.
#
# The console purges the team (memberships, secrets, products, its bots'
# tokens; the name stays reserved forever and execution history is kept).
# It refuses unless the team is retired and none of its executions are
# still running. Its namespace stays, labelled retired so nothing new runs
# there, for a cluster administrator to delete (the job summary says so),
# unless the console is set up to delete it (teamNamespaces.purge). Then, where
# this catalog's registry is configured for it, the team's images go
# too (<registry>/<team>/*).
#
# Guard rails: the `purge` Environment must have required reviewers and be
# limited to main. It holds the only credential this needs,
# ACYCLIX_PURGE_TOKEN: a console bot token with just teams:delete, never the
# everyday catalog token. Every step is idempotent, so a failed run can
# simply be re-run.
on:
  workflow_dispatch:
    inputs:
      team:
        description: "Team to purge (must already be retired: its catalog folder removed)"
        required: true
        type: string
      confirm:
        description: "Type the team name again to confirm. This can't be undone."
        required: true
        type: string

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    environment: purge
    permissions:
      contents: read
      id-token: write   # registry sign-in through OIDC, where configured
    env:
      # Via env, never pasted into a script: typed input must not be able to
      # run as shell.
      TEAM: ${{ inputs.team }}
      ACYCLIX_REGISTRY: ${{ vars.ACYCLIX_REGISTRY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the request
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$TEAM" != "$CONFIRM" ]; then
            echo "::error::The confirmation doesn't match the team name."; exit 1
          fi
          if ! printf '%s' "$TEAM" | grep -Eq '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'; then
            echo "::error::'$TEAM' isn't a valid team name."; exit 1
          fi

      - name: Purge the team
        env:
          ACYCLIX_CONSOLE_URL: ${{ vars.ACYCLIX_CONSOLE_URL }}
          ACYCLIX_TOKEN: ${{ secrets.ACYCLIX_PURGE_TOKEN }}
        run: ./catalogctl teams purge "$TEAM"

      # Images: registry-specific, so only where this catalog says how.
      # Artifact Registry, signed in the way ci.yml publishes.
      - id: gcp
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.ACYCLIX_REGISTRY != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PURGE_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        if: steps.gcp.outcome == 'success'
      - name: Delete the team's images (Artifact Registry)
        if: steps.gcp.outcome == 'success'
        # Every image under <registry>/<team>/, all tags. A failed list
        # is never read as "nothing left".
        run: |
          prefix="$ACYCLIX_REGISTRY/$TEAM"
          if ! images=$(gcloud artifacts docker images list "$prefix" --format='value(package)' | sort -u); then
            echo "::error::Couldn't list the images under $prefix."; exit 1
          fi
          for image in $images; do
            gcloud artifacts docker images delete "$image" --delete-tags --quiet
            echo "Deleted $image (all tags)."
          done
          echo "${images:-No images under $prefix.}"

      - name: Summary and remaining manual steps
        if: always()
        env:
          IMAGES_DELETED: ${{ steps.gcp.outcome == 'success' }}
        run: |
          {
            echo ""
            if [ "$IMAGES_DELETED" != "true" ]; then
              echo "Images under \`$ACYCLIX_REGISTRY/$TEAM/\` weren't deleted here (no registry sign-in configured for it): delete them in your registry."
            fi
            echo "For a repo admin:"
            echo ""
            echo '```bash'
            echo "gh api -X DELETE repos/${GITHUB_REPOSITORY}/environments/$TEAM"
            echo '```'
            if grep -q "^/teams/$TEAM/" .github/CODEOWNERS 2>/dev/null; then
              echo "- Remove the \`/teams/$TEAM/\` line from .github/CODEOWNERS."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
