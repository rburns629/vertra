# Copy to teams/<your-team>/team.yaml. Merging it creates your
# team: a namespace on the cluster, a team in the console, and a GitHub
# Environment in this repo, all named after the folder.
#
# CHANGE every value. The folder name is your team's name everywhere:
# lowercase letters, digits and dashes, never used before.
apiVersion: vertra.dev/v2
kind: Team
name: try-anna                 # CHANGE: must match the folder name
displayName: Anna's trial team   # CHANGE
description: >-
  CHANGE: a sentence on what your team offers.
owner: anna                    # CHANGE: your team
contact: anna@example.com      # CHANGE: how to reach your team
