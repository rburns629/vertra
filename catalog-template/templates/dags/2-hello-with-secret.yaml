# Step 4: run hello with its secret. First add the secret hello-secret for
# the product "hello" in the console (Team page, Secrets, Add a secret).
# CHANGE: try-anna (twice) to your team.
apiVersion: acyclix.dev/v2
kind: Dag
name: hello-with-secret
tasks:
  - id: say-hello
    # CHANGE: <registry>/<your-team>/hello:latest. The console pins it to
    # its digest when you submit.
    image: localhost:5001/try-anna/hello:latest
    action: greet
    team: try-anna
    # Your team's secret, added in the console. Only your products'
    # tasks may list one.
    secretRefs: [hello-secret]
    inputs:
      name: Anna
      useSecret: true
