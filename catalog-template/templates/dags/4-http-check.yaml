# Optional: a product that calls the internet. Without a token first; for
# the token version, add the secret http-check-token in the console, then
# set secretRefs: [http-check-token] and useToken: true.
# CHANGE: try-anna (twice) to your team.
apiVersion: vertra.dev/v2
kind: Dag
name: check-a-site
tasks:
  - id: check-site
    # CHANGE: <registry>/<your-team>/http-check:latest. The console pins it to
    # its digest when you submit.
    image: localhost:5001/try-anna/http-check:latest
    action: check
    team: try-anna
    inputs:
      url: https://www.example.com
