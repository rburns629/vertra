# A template: what someone runs from the console, filling in only its
# parameters. Its steps name actions, not images, so it keeps working as the
# products release new images. This one shouts the text, then writes it
# backwards: upper-case (PowerShell), then reverse (TypeScript).
apiVersion: acyclix.dev/v2
kind: Template
name: shout-backwards
displayName: Shout it backwards
description: >-
  Upper-cases the text, then writes the result backwards: two of the local
  samples, one feeding the other.
shareWith: ["*"]
parameters:
  type: object
  additionalProperties: false
  required: [text]
  properties:
    text:
      type: string
      title: Text
      description: What to shout backwards, up to 1,000 characters.
      maxLength: 1000
steps:
  - id: shout
    action: upper-case.transform
    inputs:
      text: {$param: text}
  - id: backwards
    action: reverse.transform
    dependsOn: [shout]
    inputs:
      text: {$fromStep: shout, $output: text}
