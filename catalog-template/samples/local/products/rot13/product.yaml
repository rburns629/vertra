# One of five language samples (Python, TypeScript, Go, PowerShell, Rust):
# the same contract, text in and text out, in each language. Chain them with
# the DAG in its team's README.md (samples/local/README.md).
apiVersion: vertra.dev/v2
kind: Product
name: rot13
team: local
displayName: ROT13 (Rust)
description: >-
  Moves each Latin letter 13 places along the alphabet; running it twice gives
  the original back. A Rust sample of the product contract.
owner: local
runtime: rust1.90
# What the error codes its actions report mean: shown on the run page when a
# step fails with one, with whether a retry is safe and where to ask.
errors:
  TEXT_TOO_LONG:
    means: The text is longer than the 1,000 characters this takes.
    do: Shorten it, or split it across runs.
  MISSING_INPUT:
    means: It wasn't given the text to change.
    do: Fill in Text and run it again.
actions:
  - name: transform
    idempotent: true   # the same text in, the same text out
    maxAttempts: 2
    # Anyone may run it, or use it in their templates: these samples are
    # for every team to try. Left out, only this team could.
    shareWith: ["*"]
    # Another team's run waits for one of this team's maintainers to
    # approve it (never whoever ran it); this team's own runs don't.
    approval: otherTeams
    script: src/main.rs
    input:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          title: Text
          description: The text to change, up to 1,000 characters.
          maxLength: 1000
    output:
      type: object
      additionalProperties: false
      required: [text, language]
      properties:
        text:
          type: string
          title: Text
          description: The text with its Latin letters rotated, such as "uryyb jbeyq".
        language:
          type: string
          title: Language
          description: The language this product is written in, Rust.
