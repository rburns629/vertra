# What a run made, and deleting it later: open reports the ticket it opens
# as a resource, and cleanup names close as what removes one; plan says what
# open would do, for Preview. watch shows wiring: it needs a ticket
# (types.yaml), and its watch depends on it. The console
# keeps the ticket after the run is gone, and its Delete runs close. Nothing
# is really created here (a no-cloud sample): the ticket's id comes from its
# title, so opening the same one twice gives the same ticket.
apiVersion: vertra.dev/v2
kind: Product
name: ticket
team: local
displayName: Ticket (Python)
description: >-
  Opens a pretend ticket and reports it as a resource, which the console
  can later delete by running close. A sample of resources and cleanup.
owner: local
runtime: python3.12
# Each install runs check (no inputs) when this is registered and daily, and
# shows whether it's ready there.
check: check
# At most two of its steps at once, open or close, in any run: a ticketing
# system that limits how many calls it takes. The rest wait their turn.
maxRunning: 2
errors:
  MISSING_INPUT:
    means: It wasn't given what it needs.
    do: Fill in the missing input and run it again.
actions:
  - name: open
    idempotent: true   # the same title, the same ticket
    maxAttempts: 2
    shareWith: ["*"]
    script: actions/open.py
    # Close removes what open reports, given {"resource": {type, id, name}}.
    cleanup:
      action: close
    # Preview runs plan first: what open would do, changing nothing.
    plan: plan
    input:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          title: Title
          description: What the ticket is about, up to 200 characters.
          maxLength: 200
          pattern: "\\S"
          x-vertra-pattern-message: can't be blank
    output:
      type: object
      additionalProperties: false
      required: [ticket, resources]
      properties:
        ticket:
          type: string
          title: Ticket
          description: Its id, such as T-1a2b3c4d.
          x-vertra-provides: local.ticket  # what watch's ticket is wired from
        resources:
          type: array
          title: Resources
          description: What it opened, for the console to keep.
          items:
            type: object
            required: [type, id]
            properties:
              type: {type: string}
              id: {type: string}
              name: {type: string}
              link: {type: string}
  - name: close
    idempotent: true   # closing a closed ticket closes nothing
    maxAttempts: 2
    shareWith: ["*"]
    script: actions/close.py
    input:
      type: object
      additionalProperties: false
      required: [resource]
      properties:
        resource:
          type: object
          title: Resource
          description: The ticket, as open reported it.
          required: [type, id]
          properties:
            type: {type: string}
            id: {type: string}
            name: {type: string}
            link: {type: string}
    output:
      type: object
      additionalProperties: false
      required: [closed]
      properties:
        closed:
          type: string
          title: Closed
          description: The ticket it closed.
  - name: watch
    idempotent: true   # the same ticket and watcher, the same watch
    maxAttempts: 2
    shareWith: ["*"]
    script: actions/watch.py
    # Unwatch removes what watch reports. The watch depends on its ticket
    # (the input typed local.ticket), so deleting a watched ticket waits for
    # an admin, unless its watches are deleted with it.
    cleanup:
      action: unwatch
    input:
      type: object
      additionalProperties: false
      required: [ticket, watcher]
      properties:
        ticket:
          type: string
          title: Ticket
          description: The ticket to watch.
          x-vertra-needs: local.ticket  # one of yours, or open added to the order
          pattern: "^T-[0-9a-f]{8}$"
        watcher:
          type: string
          title: Watcher
          description: Who is told when it changes, up to 100 characters.
          maxLength: 100
          pattern: "\\S"
          x-vertra-pattern-message: can't be blank
    output:
      type: object
      additionalProperties: false
      required: [watch, resources]
      properties:
        watch:
          type: string
          title: Watch
          description: Its id, such as W-1a2b3c4d.
        resources:
          type: array
          title: Resources
          description: What it made, for the console to keep.
          items:
            type: object
            required: [type, id]
            properties:
              type: {type: string}
              id: {type: string}
              name: {type: string}
              link: {type: string}
  - name: unwatch
    idempotent: true   # removing a removed watch removes nothing
    maxAttempts: 2
    shareWith: ["*"]
    script: actions/unwatch.py
    input:
      type: object
      additionalProperties: false
      required: [resource]
      properties:
        resource:
          type: object
          title: Resource
          description: The watch, as watch reported it.
          required: [type, id]
          properties:
            type: {type: string}
            id: {type: string}
            name: {type: string}
            link: {type: string}
    output:
      type: object
      additionalProperties: false
      required: [unwatched]
      properties:
        unwatched:
          type: string
          title: Unwatched
          description: The watch it removed.
  - name: plan
    idempotent: true   # it only reports
    maxAttempts: 2
    shareWith: ["*"]
    script: actions/plan.py
    input:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          title: Title
          maxLength: 200
          pattern: "\\S"
          x-vertra-pattern-message: can't be blank
    output:
      type: object
      additionalProperties: false
      required: [changes, summary]
      properties:
        summary:
          type: string
          title: Summary
          description: What open would do, in a sentence.
        changes:
          type: array
          title: Changes
          description: What open would create, change or delete.
          items:
            type: object
            required: [action, type, id]
            properties:
              action: {type: string, enum: [create, update, delete, none]}
              type: {type: string}
              id: {type: string}
              name: {type: string}
              detail: {type: string}
  - name: check
    idempotent: true   # it only reports
    maxAttempts: 2
    shareWith: ["*"]
    script: actions/check.py
    input:
      type: object
      additionalProperties: false
    output:
      type: object
      additionalProperties: false
      required: [ready]
      properties:
        ready: {type: boolean, title: Ready}
        principal: {type: string, title: Principal, description: What it acts as here.}
        missing:
          type: array
          title: Missing
          description: What it lacks to work here.
          items: {type: string}
        detail: {type: string, title: Detail}
