# Two aws products chained: an S3 bucket, then an App Runner service that's
# told its name. Real, billed calls. Paste into the console's Submit page
# with <registry> and the CHANGE values replaced. `:latest` is pinned to its
# digest when you submit.
apiVersion: vertra.dev/v2
kind: Dag
name: aws-hello-world
tasks:
  - id: bucket
    image: <registry>/aws/s3-bucket:latest
    action: create
    team: aws
    inputs:
      bucketName: my-team-hello-world-data     # CHANGE: bucket names are global
      region: eu-west-1                        # CHANGE

  - id: web
    image: <registry>/aws/app-runner:latest
    action: create
    team: aws
    dependsOn: [bucket]
    timeoutSeconds: 1200                       # a new service takes a few minutes
    inputs:
      serviceName: hello-world
      image: public.ecr.aws/aws-containers/hello-app-runner:latest
      region: eu-west-1                        # CHANGE
      port: 8000
      public: true                             # a demo: anyone may reach it
      environment:
        BUCKET: {$fromTask: bucket, $output: bucketName}
