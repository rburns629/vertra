# A sample: RDS for PostgreSQL, with real AWS API calls (billed).
# Its own IAM role, by EKS Pod Identity: see the aws team's README.md.
apiVersion: vertra.dev/v2
kind: Product
name: rds-postgres
team: aws
displayName: RDS for PostgreSQL
description: 'Finds an RDS for PostgreSQL instance by id, or creates it (encrypted, not publicly
  accessible, its master password generated and kept by AWS Secrets Manager) and waits until
  it''s available. A first create takes several minutes: set the step''s timeoutSeconds to
  1500 or more.'
owner: aws-team
runtime: python3.12
# Its own identity: bound to only what it does (README.md, Credentials).
serviceAccount: aws-rds-postgres
# Each install runs check (no inputs, as this identity) when this is
# registered and daily, and shows whether it's ready there: whether it can
# sign in, and may do what its actions do. It changes nothing.
check: check
actions:
- name: create
  # Finds what it would create before creating it, so a step that
  # failed on the platform's side (a reclaimed node, a timeout) is
  # retried, up to three attempts in all.
  idempotent: true
  maxAttempts: 3
  script: actions/create.py
  # An instance it creates is tagged vertra-made=true and reported as a
  # resource; delete removes it, keeping a final snapshot (and refuses any
  # instance without the tag).
  cleanup:
    action: delete
  input:
    type: object
    additionalProperties: false
    required:
    - instanceId
    - region
    properties:
      instanceId:
        type: string
        description: 'The instance id: a letter, then letters, digits or single hyphens.'
      region:
        type: string
        description: The AWS region, such as eu-west-1.
        pattern: ^[a-z]{2}(-[a-z]+)+-[0-9]$
      instanceClass:
        type: string
        description: The instance class.
        default: db.t4g.micro
      allocatedStorageGb:
        type: integer
        description: Storage in GiB.
        default: 20
      engineVersion:
        type: string
        description: A PostgreSQL version; the default is RDS's.
      masterUsername:
        type: string
        description: The master user's name.
        default: vertra_admin
  output:
    type: object
    required:
    - instanceId
    - endpoint
    - port
    properties:
      instanceId:
        type: string
        description: The instance.
      endpoint:
        type: string
        description: Its host name.
      port:
        type: integer
        description: Its port.
      masterUserSecretArn:
        type: string
        description: 'The Secrets Manager secret holding the master password: grant an app''s
          own role access to it, never pass the password on.'
      resources:
        type: array
        description: The instance, when this product made it (now, or on an earlier attempt).
        items:
          type: object
          required: [type, id]
          properties:
            type: {type: string}
            id: {type: string}
            name: {type: string}
            link: {type: string}
- name: delete
  # Deleting an instance that's already gone or going is a no-op.
  idempotent: true
  maxAttempts: 3
  script: actions/delete.py
  input:
    type: object
    additionalProperties: false
    required:
    - resource
    properties:
      resource:
        type: object
        description: The instance, as create reported it.
        required: [type, id]
        properties:
          type: {type: string, const: aws/rds-instance}
          id: {type: string, description: Its ARN.}
          name: {type: string}
          link: {type: string}
  output:
    type: object
    required:
    - deleted
    properties:
      deleted:
        type: string
        description: The instance's ARN.
      finalSnapshot:
        type: string
        description: 'The snapshot kept of it: delete it once nobody needs the data (it''s billed
          as storage).'
- name: check
  idempotent: true   # it only asks
  maxAttempts: 2
  script: actions/check.py
  input:
    type: object
    additionalProperties: false
  output:
    type: object
    additionalProperties: false
    required: [ready]
    properties:
      ready: {type: boolean, title: Ready}
      principal: {type: string, title: Principal, description: Who it signs in as here.}
      missing:
        type: array
        title: Missing
        description: What an admin must grant it here.
        items: {type: string}
      detail: {type: string, title: Detail}
