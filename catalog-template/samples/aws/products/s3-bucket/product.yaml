# A sample: S3 bucket, with real AWS API calls (billed).
# Its own IAM role, by EKS Pod Identity: see the aws team's README.md.
apiVersion: vertra.dev/v2
kind: Product
name: s3-bucket
team: aws
displayName: S3 bucket
description: 'Finds an S3 bucket by name, or creates it with every kind of public access blocked.
  Bucket names are global: a name another account owns fails with BUCKET_NAME_TAKEN.'
owner: aws-team
runtime: python3.12
# Its own identity: bound to only what it does (README.md, Credentials).
serviceAccount: aws-s3-bucket
actions:
- name: create
  # Finds what it would create before creating it, so a step that
  # failed on the platform's side (a reclaimed node, a timeout) is
  # retried, up to three attempts in all.
  idempotent: true
  maxAttempts: 3
  script: actions/create.py
  # A bucket it creates is tagged vertra-made=true and reported as a
  # resource; delete removes it (and refuses any bucket without the tag).
  cleanup:
    action: delete
    inputs:
      bucketName: {$resource: id}
      region: {$input: region}
  input:
    type: object
    additionalProperties: false
    required:
    - bucketName
    - region
    properties:
      bucketName:
        type: string
        description: 'The bucket''s name: 3 to 63 lowercase letters, digits, dots or hyphens.'
        pattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
      region:
        type: string
        description: The AWS region, such as eu-west-1.
        pattern: ^[a-z]{2}(-[a-z]+)+-[0-9]$
  output:
    type: object
    required:
    - bucketName
    - region
    - arn
    properties:
      bucketName:
        type: string
        description: The bucket.
      region:
        type: string
        description: Where it is.
      arn:
        type: string
        description: Its ARN, for IAM policies.
      resources:
        type: array
        description: The bucket, when this product made it (now, or on an earlier attempt).
        items:
          type: object
          required: [type, id]
          properties:
            type: {type: string}
            id: {type: string}
            link: {type: string}
- name: delete
  # Deleting a bucket that's already gone is a no-op.
  idempotent: true
  maxAttempts: 3
  script: actions/delete.py
  input:
    type: object
    additionalProperties: false
    required:
    - bucketName
    - region
    properties:
      bucketName:
        type: string
        description: The bucket create made.
        pattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
      region:
        type: string
        description: Its region.
        pattern: ^[a-z]{2}(-[a-z]+)+-[0-9]$
  output:
    type: object
    required:
    - deleted
    properties:
      deleted:
        type: string
        description: The bucket deleted.
