# A sample: App Runner service, with real AWS API calls (billed).
# Its own IAM role, by EKS Pod Identity: see the aws team's README.md.
apiVersion: vertra.dev/v2
kind: Product
name: app-runner
team: aws
displayName: App Runner service
description: Deploys a container image as an App Runner service and waits for it to run, or
  returns the existing service's URL. Private (reachable through a VPC interface endpoint)
  unless public is true.
owner: aws-team
runtime: python3.12
# Its own identity: bound to only what it does (README.md, Credentials).
serviceAccount: aws-app-runner
actions:
- name: create
  # Finds what it would create before creating it, so a step that
  # failed on the platform's side (a reclaimed node, a timeout) is
  # retried, up to three attempts in all.
  idempotent: true
  maxAttempts: 3
  script: actions/create.py
  # A service it creates is tagged vertra-made=true and reported as a
  # resource; delete removes it (and refuses any service without the tag).
  cleanup:
    action: delete
  input:
    type: object
    additionalProperties: false
    required:
    - serviceName
    - image
    - region
    properties:
      serviceName:
        type: string
        description: The service's name.
        pattern: ^[A-Za-z0-9][A-Za-z0-9-_]{3,39}$
      image:
        type: string
        description: An ECR or ECR Public image reference.
      region:
        type: string
        description: The AWS region, such as eu-west-1.
        pattern: ^[a-z]{2}(-[a-z]+)+-[0-9]$
      port:
        type: integer
        description: The port the container listens on.
        default: 8080
      public:
        type: boolean
        description: Whether anyone on the internet may reach it.
        default: false
      accessRoleArn:
        type: string
        description: An IAM role App Runner pulls a private ECR image with.
      environment:
        type: object
        description: 'Environment variables for the container: names to string values. Never
          a secret: these are visible to anyone who can read the execution.'
        additionalProperties:
          type: string
  output:
    type: object
    required:
    - serviceArn
    properties:
      serviceUrl:
        type: string
        description: 'The service''s HTTPS URL, for a public one: a private one has none, and
          is reached through a VPC ingress connection.'
      serviceArn:
        type: string
        description: Its ARN.
      resources:
        type: array
        description: The service, when this product made it (now, or on an earlier attempt).
        items:
          type: object
          required: [type, id]
          properties:
            type: {type: string}
            id: {type: string}
            name: {type: string}
            link: {type: string}
- name: delete
  # Deleting a service that's already gone or going is a no-op.
  idempotent: true
  maxAttempts: 3
  script: actions/delete.py
  input:
    type: object
    additionalProperties: false
    required:
    - resource
    properties:
      resource:
        type: object
        description: The service, as create reported it.
        required: [type, id]
        properties:
          type: {type: string, const: aws/app-runner-service}
          id: {type: string, description: Its ARN.}
          name: {type: string}
          link: {type: string}
  output:
    type: object
    required:
    - deleted
    properties:
      deleted:
        type: string
        description: The service's ARN.
