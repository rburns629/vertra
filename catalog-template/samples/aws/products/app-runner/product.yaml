# A sample: App Runner service, with real AWS API calls (billed).
# Its own IAM role, by EKS Pod Identity: see the aws team's README.md.
name: app-runner
team: aws
displayName: App Runner service
description: Deploys a container image as an App Runner service and waits for it to run, or
  returns the existing service's URL. Private (reachable through a VPC interface endpoint)
  unless public is true.
owner: aws-team
runtime: python3.12
actions:
- name: create
  script: actions/create.py
  input:
    type: object
    additionalProperties: false
    required:
    - serviceName
    - image
    - region
    properties:
      serviceName:
        type: string
        description: The service's name.
        pattern: ^[A-Za-z0-9][A-Za-z0-9-_]{3,39}$
      image:
        type: string
        description: An ECR or ECR Public image reference.
      region:
        type: string
        description: The AWS region, such as eu-west-1.
        pattern: ^[a-z]{2}(-[a-z]+)+-[0-9]$
      port:
        type: integer
        description: The port the container listens on.
        default: 8080
      public:
        type: boolean
        description: Whether anyone on the internet may reach it.
        default: false
      accessRoleArn:
        type: string
        description: An IAM role App Runner pulls a private ECR image with.
      environment:
        type: object
        description: 'Environment variables for the container: names to string values. Never
          a secret: these are visible to anyone who can read the execution.'
        additionalProperties:
          type: string
  output:
    type: object
    required:
    - serviceUrl
    - serviceArn
    properties:
      serviceUrl:
        type: string
        description: The service's HTTPS URL.
      serviceArn:
        type: string
        description: Its ARN.
