openapi: 3.1.0
info:
  title: Orders
  version: 1.0.0
servers:
  - url: https://abcdefghijklmnopqrstuvwxyz012345.lambda-url.us-east-2.on.aws
paths:
  /orders:
    post:
      operationId: placeOrder
      summary: Places an order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sku, quantity]
              properties:
                sku: {type: string, pattern: "^[A-Z0-9-]{3,32}$"}
                quantity: {type: integer, minimum: 1, maximum: 100}
      responses:
        "201":
          description: The order placed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Looks up an order.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: "^ord_[a-z0-9]{12}$"}
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "404":
          description: No such order.
components:
  schemas:
    Order:
      type: object
      required: [id, sku, quantity, state]
      properties:
        id: {type: string}
        sku: {type: string}
        quantity: {type: integer}
        state: {type: string, enum: [placed, shipped, cancelled]}
