# Keyless: ESO signs in as the ServiceAccount eso-aws in this namespace, which
# EKS lets act as an IAM role that may read this team's secrets in AWS
# Secrets Manager. With IRSA, the annotation below names the role; with EKS
# Pod Identity, drop the annotation and create a Pod Identity association
# for eso-aws instead. A scope reference only, never a secret value; the
# console applies it from the catalog's release after merge, checking it
# holds nothing else. Not yet proven against a real account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-aws
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/vertra-eso-aws   # CHANGE
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1                   # CHANGE: where the secrets live
      auth:
        jwt:
          serviceAccountRef:
            name: eso-aws
