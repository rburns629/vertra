# Keyless: ESO asks EKS for a token for the ServiceAccount eso-aws in this
# namespace and trades it for the IAM role the annotation names (IRSA), one
# that may read only this team's secrets in AWS Secrets Manager. That needs
# the cluster's OIDC issuer registered in IAM, and the role trusting exactly
# system:serviceaccount:<team>:eso-aws (audience sts.amazonaws.com). EKS Pod
# Identity doesn't apply: it gives credentials to Pods, not to the tokens ESO
# asks for. A scope reference only, never a secret value; the console applies
# it from the catalog's release after merge, checking it holds nothing else,
# and that no other team's store signs in as the same role. Proven on EKS
# (2026-10-27).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-aws
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/vertra-eso-aws   # CHANGE
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1                   # CHANGE: where the secrets live
      auth:
        jwt:
          serviceAccountRef:
            name: eso-aws
