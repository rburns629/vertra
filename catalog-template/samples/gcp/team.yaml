# Descriptive metadata about the gcp team itself -- see the top-level
# README.md's own team.yaml section for the full convention and why
# this deliberately lists no products.
apiVersion: vertra.dev/v2
kind: Team
name: gcp
displayName: GCP
description: >-
  Real, GCP-API-calling products: provisioning a project, building a
  container image, deploying it to Cloud Run, and provisioning a Cloud
  SQL instance for it to use. Every action in this team makes a real
  Google Cloud API call -- see samples/local for products that need no
  cloud account at all.
owner: gcp-team
contact: gcp-team@example.com
# Where people running these products ask when a step fails.
help:
  chat: "#gcp-team-help"
  url: https://example.com/runbooks
# Where other teams may aim these products. Each projectId input is a
# gcp.project target (x-vertra-needs in product.yaml): when another team
# runs one, the project must match a rule for that team, or the run is
# refused before it starts. Your own team isn't limited. Narrow it to each
# consumer's projects, for example:
#   - teams: [web]
#     gcp.project: ["web-*"]
allowedTargets:
  - teams: ["*"]
    gcp.project: ["sandbox-*"]
  # Shared projects too, once one of this team's maintainers approves.
  - teams: ["*"]
    gcp.project: ["shared-*"]
    approval: true
