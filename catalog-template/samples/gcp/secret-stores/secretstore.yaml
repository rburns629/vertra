# Keyless: GKE Workload Identity, so no stored credential anywhere. ESO signs
# in as the ServiceAccount eso-gcp in this namespace, bound (by the annotation
# below) to a Google service account that may read this project's secrets.
# The console's Team page (Secrets → Connect a source) writes this file, with
# the gcloud commands that create that binding, for your project. A scope
# reference only: it never holds a secret value, which is why it's reviewed
# and versioned here like any other file. The console applies it after merge
# (apply-secret-stores.yml), checking it holds nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-gcp
  annotations:
    iam.gke.io/gcp-service-account: eso-gcp@my-gcp-project.iam.gserviceaccount.com   # CHANGE
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager-demo
spec:
  provider:
    gcpsm:
      projectID: my-gcp-project            # CHANGE: where the secrets live
      auth:
        workloadIdentity:
          clusterLocation: us-central1     # CHANGE: your cluster's
          clusterName: my-cluster          # CHANGE
          serviceAccountRef:
            name: eso-gcp
