apiVersion: vertra.dev/v2
kind: Product
name: project
team: gcp
displayName: GCP Project
description: >-
  Looks up a Google Cloud project by id, creating it (and linking billing)
  only if it doesn't already exist. Idempotent: re-running against an
  existing project id is a no-op that still returns its projectId, so the
  same DAG works whether the caller is a new user (project gets created) or
  an existing one (project is found and left untouched).
owner: gcp-team
runtime: python3.12
# Its own identity: bound to only what it does (README.md, Credentials).
serviceAccount: gcp-project
actions:
  - name: create
    # Finds what it would create before creating it, so a step that
    # failed on the platform's side (a reclaimed node, a timeout) is
    # retried, up to three attempts in all.
    idempotent: true
    maxAttempts: 3
    script: actions/create.py
    # Deleting the project it made (only one it made: create labels it
    # vertra-made, and delete refuses any other). The console offers it to
    # whoever the run was for, and admins.
    cleanup:
      action: delete
    input:
      type: object
      additionalProperties: false
      required: [projectId]
      properties:
        projectId:
          type: string
          x-vertra-needs: gcp.project  # a target: checked against allowedTargets for other teams
          pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
          description: >-
            The GCP project id to look up or create. If a project with this
            id already exists, it is returned unchanged -- this action
            never modifies an existing project's settings.
        billingAccountId:
          type: string
          pattern: "^[A-Za-z0-9]{6}-[A-Za-z0-9]{6}-[A-Za-z0-9]{6}$"
          description: >-
            Billing account linked ONLY when a new project is created;
            ignored if the project already exists. Required before the
            project can run billable services like Cloud Run.
    output:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: string
          x-vertra-provides: gcp.project  # Compose wires it into inputs that need one
          description: >-
            Echoed back either way, for downstream tasks to reference via
            $fromTask/$output.
        resources:
          type: array
          description: >-
            The project, when this product made it (now, or on an earlier
            attempt): what the console keeps, to delete later.
          items:
            type: object
            required: [type, id]
            properties:
              type: {type: string}
              id: {type: string}
              link: {type: string}
  - name: delete
    # Shutting down a project already gone or going is a no-op.
    idempotent: true
    maxAttempts: 3
    script: actions/delete.py
    input:
      type: object
      additionalProperties: false
      required: [resource]
      properties:
        resource:
          type: object
          description: The project, as create reported it.
          required: [type, id]
          properties:
            type: {type: string, const: gcp/project}
            id: {type: string}
            link: {type: string}
    output:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: string
          description: The project shut down (Google keeps it 30 days, restorable).
