apiVersion: vertra.dev/v2
kind: Product
name: cloud-sql
team: gcp
displayName: GCP Cloud SQL
description: >-
  Looks up a Cloud SQL instance by name within a project, creating it only
  if it doesn't already exist. Idempotent, same as gcp/_project: re-running
  against an existing instance name is a no-op that still returns its
  connection info. A real Cloud SQL instance is genuinely billed
  infrastructure and takes several minutes to provision on first create --
  submit this with a generous `timeoutSeconds` (900+) on the task, not the
  kernel's default.
owner: gcp-team
runtime: python3.12
# Its own identity: bound to only what it does (README.md, Credentials).
serviceAccount: gcp-cloud-sql
actions:
  - name: create
    # Finds what it would create before creating it, so a step that
    # failed on the platform's side (a reclaimed node, a timeout) is
    # retried, up to three attempts in all.
    idempotent: true
    maxAttempts: 3
    script: actions/create.py
    # Deleting the instance it made (only one it made: create labels it
    # vertra-made, and delete refuses any other), its databases with it.
    cleanup:
      action: delete
    input:
      type: object
      additionalProperties: false
      required: [projectId, instanceName]
      properties:
        projectId:
          type: string
          x-vertra-needs: gcp.project  # a target: checked against allowedTargets for other teams
          description: >-
            The already-existing GCP project this instance should live in
            -- typically gcp/_project's own output, via $fromTask/$output.
        instanceName:
          type: string
          pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
          description: >-
            The Cloud SQL instance id to look up or create. If an instance
            with this name already exists in the project, it is returned
            unchanged -- this action never modifies an existing instance's
            settings.
        databaseVersion:
          type: string
          default: POSTGRES_15
          description: One of Cloud SQL's supported database engine/version strings.
        tier:
          type: string
          default: db-f1-micro
          description: >-
            The machine tier -- db-f1-micro is the smallest, cheapest
            shared-core tier, the sane default for a demo.
        region:
          type: string
          x-vertra-needs: gcp.region
          default: us-central1
    output:
      type: object
      required: [instanceConnectionName, ipAddress]
      properties:
        instanceConnectionName:
          type: string
          x-vertra-provides: gcp.cloud-sql-instance
          description: >-
            "<project>:<region>:<instanceName>" -- what the Cloud SQL Auth
            Proxy/connector expects, and exactly what gcp/app-hosting's
            optional cloudSqlConnectionName input wants. Echoed back either
            way (existing or newly created), for downstream tasks to
            reference via $fromTask/$output.
        ipAddress:
          type: string
          description: The instance's assigned (typically public) IP address.
        resources:
          type: array
          description: >-
            The instance, when this product made it (now, or on an earlier
            attempt): what the console keeps, to delete later.
          items:
            type: object
            required: [type, id]
            properties:
              type: {type: string}
              id: {type: string}
              name: {type: string}
              link: {type: string}
  - name: delete
    # Deleting an instance that's already gone is a no-op.
    idempotent: true
    maxAttempts: 3
    script: actions/delete.py
    input:
      type: object
      additionalProperties: false
      required: [resource]
      properties:
        resource:
          type: object
          description: The instance, as create reported it.
          required: [type, id]
          properties:
            type: {type: string, const: gcp/cloud-sql-instance}
            id: {type: string}
            name: {type: string}
            link: {type: string}
    output:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: string
          description: The instance deleted, by its connection name.
        finishing:
          type: boolean
          description: Google was still finishing the delete when the step ended (it can't be stopped once accepted).
