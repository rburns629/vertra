# Where this catalog publishes, read by ./catalogctl, the
# same in CI and on a laptop. Anything here can be overridden per run with
# environment variables (shown on each line), which is how CI points the
# same files at a hosted registry and console.

# Images are pushed to <registry>/<team>/<product>, the path derived
# from the product's folder: teams/<team>/products/<product>/.
# ACYCLIX_REGISTRY. On kind: the local registry from `make kind-registry`.
registry: localhost:5001

# The console products are registered with (ProductService/RegisterProduct).
# ACYCLIX_CONSOLE_URL. The token comes from ACYCLIX_TOKEN: a bot token with
# products:register, minted on the console's Admin page.
console: http://localhost:18080

signing:
  # ACYCLIX_SIGNING_MODE:
  #   none     not signed (local installs, which don't verify signatures)
  #   key      a cosign key: a generated key pair or a cloud KMS key
  #   keyless  CI's OIDC identity, recorded in the public transparency log
  mode: none
  # ACYCLIX_SIGNING_KEY, for mode "key": a cosign key reference, such as
  # env://COSIGN_PRIVATE_KEY (a generated key, its password in
  # COSIGN_PASSWORD), gcpkms://..., awskms://..., azurekms://... or
  # hashivault://...
  key: ""
