name: release

# On a version tag (v1.2.3, or v1.2.3-rc.1 for a pre-release):
#
#   images  builds the kernel and console images, scans them with the same
#           gate CI uses (.github/scripts/scan-image.sh), then builds them
#           for linux/amd64 and linux/arm64, pushes them to
#           ghcr.io/<owner>/<repo>/execution-{kernel,console,gateway} as the version
#           (and as latest, unless it's a pre-release), and signs each by
#           digest, keyless, with this workflow's own identity.
#   charts  packages both Helm charts at that version (their appVersion
#           too, so they run the images just pushed), pushes them to
#           oci://ghcr.io/<owner>/<repo>/charts, signs them, and creates the
#           GitHub release with the packaged charts attached.
#   cli     builds vertra for linux and darwin, amd64 and arm64, from this
#           tag, pushes each binary to ghcr.io/<owner>/<repo>/cli as one
#           blob (tag <version>-<os>-<arch>; its digest is the binary's
#           SHA-256), signs each, and attaches the binaries and
#           vertra-checksums.txt to the release. A catalog's ./vertra
#           downloads its platform's blob anonymously by that SHA-256:
#           pin a release with .github/scripts/pin-vertra.sh <version>.
#
# Verify an image: cosign verify ghcr.io/<owner>/<repo>/execution-kernel:<v> \
#   --certificate-identity-regexp 'https://github.com/<owner>/<repo>/.github/workflows/release.yml@.*' \
#   --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# The packages are private on first push: make them public on GitHub (the
# package's settings) once, so `helm install`, image pulls and a catalog's
# ./vertra need no login.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless signing
    strategy:
      fail-fast: true
      matrix:
        component: [kernel, console, gateway]
    env:
      COMPONENT: ${{ matrix.component }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/install-scanners.sh trivy osv-scanner cosign
      - name: Build for the scan
        run: docker build --pull -t "vertra-release/$COMPONENT:scan" "$COMPONENT/"
      - name: Scan
        # The amd64 build; the arm64 one is built from the same Dockerfile
        # and base image, by digest.
        run: bash .github/scripts/scan-image.sh "vertra-release/$COMPONENT:scan" "$COMPONENT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push (amd64, arm64)
        id: push
        run: |
          version="${TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/execution-$COMPONENT"
          tags=(-t "$image:$version")
          case "$version" in *-*) ;; *) tags+=(-t "$image:latest") ;; esac
          docker buildx build --platform linux/amd64,linux/arm64 --pull \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.licenses=MIT" \
            "${tags[@]}" --metadata-file "$RUNNER_TEMP/meta.json" --push "$COMPONENT/"
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")
          echo "ref=$image@$digest" >> "$GITHUB_OUTPUT"
      - name: Sign
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: cosign sign --yes "$REF"

  charts:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub release
      packages: write
      id-token: write   # keyless signing
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - run: bash .github/scripts/install-scanners.sh cosign
      - name: Sign in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Helm keeps its own credentials; cosign reads Docker's.
        run: |
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Package, push and sign the charts
        run: |
          version="${TAG#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY,,}/charts"
          mkdir -p dist
          for chart in execution-kernel execution-console; do
            helm package "helm/charts/$chart" --version "$version" --app-version "$version" -d dist
            helm push "dist/$chart-$version.tgz" "oci://$registry" 2>&1 | tee "$RUNNER_TEMP/push.log"
            digest=$(grep -o 'sha256:[0-9a-f]\{64\}' "$RUNNER_TEMP/push.log" | tail -1)
            cosign sign --yes "$registry/$chart@$digest"
          done
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/*.tgz --verify-tag --generate-notes "${prerelease[@]}"

  cli:
    needs: charts   # the GitHub release it attaches to
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach to the GitHub release
      packages: write
      id-token: write   # keyless signing
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/install-scanners.sh oras cosign
      - name: Build vertra for each platform
        # In the Go image CI uses, pinned by digest (the Makefile's GO_IMAGE).
        run: |
          image=$(sed -n 's/^GO_IMAGE ?= *//p' Makefile)
          mkdir -p dist
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            docker run --rm -v "$PWD":/repo -w /repo/cli -e CGO_ENABLED=0 \
              -e GOOS="${platform%-*}" -e GOARCH="${platform#*-}" "$image" \
              go build -trimpath -ldflags "-s -w -X main.Version=$TAG" -o "/repo/dist/vertra-$platform" ./cmd/vertra
          done
          (cd dist && sha256sum vertra-* > vertra-checksums.txt && cat vertra-checksums.txt)
      - name: Sign in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push and sign each binary
        run: |
          version="${TAG#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY,,}/cli"
          cd dist
          {
            echo "### vertra $TAG"
            echo
            echo "Pin it in a catalog's ./vertra: \`.github/scripts/pin-vertra.sh $version\`"
            echo
            echo '| Platform | SHA-256 (the blob a catalog downloads) |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            oras push "$registry:$version-$platform" \
              --artifact-type application/vnd.vertra.cli.v1 \
              "vertra-$platform:application/vnd.vertra.cli.binary.v1"
            digest=$(oras resolve "$registry:$version-$platform")
            cosign sign --yes "$registry@$digest"
            echo "| $platform | \`$(sha256sum "vertra-$platform" | cut -d' ' -f1)\` |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/vertra-* --clobber
