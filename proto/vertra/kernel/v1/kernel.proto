syntax = "proto3";

package vertra.kernel.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// kernel-api: runs DAGs that were already resolved and authorized. It is
// internal: its one caller is the console, which checks every request
// against the caller's teams, identities, secrets and images first, and
// it's reachable only inside the cluster. kernel-api checks only that the
// caller is the console (a ServiceAccount token, by TokenReview). It has
// no users or teams, and never will.
//
// What it stores, kernel-scheduler runs: the two share nothing but the
// database.
service KernelService {
  // Validates a DAG (ids, dependencies, cycles, $fromTask references,
  // credential-shaped inputs) and stores it to run. A request_id seen
  // before returns that execution (created false) instead of a new one.
  // An invalid DAG is invalid_argument with ValidationIssues details,
  // every problem at once.
  rpc SubmitExecution(SubmitExecutionRequest) returns (SubmitExecutionResponse);
  // An execution and its tasks, as they are now.
  rpc GetExecution(GetExecutionRequest) returns (GetExecutionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Many executions' states at once, for list views. Ids that don't exist
  // are left out, not refused.
  rpc GetExecutionStates(GetExecutionStatesRequest) returns (GetExecutionStatesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // An execution's events, oldest first, a page at a time.
  rpc ListExecutionEvents(ListExecutionEventsRequest) returns (ListExecutionEventsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Every task's captured output, in one call.
  rpc GetExecutionLogs(GetExecutionLogsRequest) returns (GetExecutionLogsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Cancels an execution: its unstarted tasks at once, its running ones at
  // the scheduler's next pass. Cancelling a cancelled execution is fine;
  // a finished one is failed_precondition.
  rpc CancelExecution(CancelExecutionRequest) returns (CancelExecutionResponse);
  // One more attempt for a FAILED task (failed_precondition otherwise),
  // whatever its max_attempts: the execution resumes, and the tasks its
  // failure cancelled come back.
  rpc RetryTask(RetryTaskRequest) returns (RetryTaskResponse);
  // Approves or declines a task in AWAITING_APPROVAL (failed_precondition
  // otherwise). Approved, it becomes READY and stays approved across
  // retries; declined, it fails with APPROVAL_DECLINED, failing its
  // execution. Who may decide is the caller's to check.
  rpc DecideApproval(DecideApprovalRequest) returns (DecideApprovalResponse);
  // The tasks awaiting approval in the given teams, oldest first.
  rpc ListAwaitingApproval(ListAwaitingApprovalRequest) returns (ListAwaitingApprovalResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Attempts the cluster refused to start since a time (an admission
  // policy's code: DISPATCH_REJECTED, IMAGE_NOT_ALLOWED, IMAGE_NOT_PINNED,
  // IMAGE_SCAN_FAILED, IMAGE_NOT_SIGNED, IDENTITY_NOT_ALLOWED), newest
  // first, at most 500.
  rpc ListRefusals(ListRefusalsRequest) returns (ListRefusalsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // What the steps did: started and waited per hour over the last day,
  // why they failed over the last day, and how long each image's action
  // took over the last week. From the kernel's own tables, so it needs no
  // metrics system.
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

enum ExecutionState {
  EXECUTION_STATE_UNSPECIFIED = 0;
  EXECUTION_STATE_PENDING = 1;
  EXECUTION_STATE_RUNNING = 2;
  EXECUTION_STATE_SUCCEEDED = 3;
  EXECUTION_STATE_FAILED = 4;
  EXECUTION_STATE_CANCELLED = 5;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_BLOCKED = 1;
  TASK_STATE_READY = 2;
  TASK_STATE_CLAIMED = 3;
  TASK_STATE_RUNNING = 4;
  TASK_STATE_SUCCEEDED = 5;
  TASK_STATE_FAILED = 6;
  TASK_STATE_CANCELLED = 7;
  // Would be READY, but waits for a person to approve it (Task.approval_required).
  TASK_STATE_AWAITING_APPROVAL = 8;
}

// One step of a DAG.
message Task {
  // Unique in its DAG; how other tasks name it.
  string id = 1;
  string image = 2;
  // Passed to the container as its args.
  string action = 3;
  // The namespace it runs in.
  string team = 4;
  // The ServiceAccount its Pod runs as.
  string service_account = 5;
  repeated string depends_on = 6;
  // Secrets mounted at /platform/secrets/<name>/.
  repeated string secret_refs = 7;
  // Its request.json inputs. A value of exactly {"$fromTask": id,
  // "$output": name} is replaced by that dependency's output when it runs.
  google.protobuf.Struct inputs = 8;
  // Default 300.
  optional int32 timeout_seconds = 9;
  // Default 1.
  optional int32 max_attempts = 10;
  // Unset: the deployment's default size.
  Resources resources = 11;
  // Audiences to project a short-lived token for, for the step to sign in
  // to another cloud with (OIDC federation): each one's token is at
  // /platform/tokens/<audience>, its characters outside [A-Za-z0-9._-]
  // replaced by "_". The console sets them from the product's declaration;
  // the cluster's identity policy refuses any its product didn't declare.
  repeated string token_audiences = 12;
  // The product's input and output schemas (JSON Schema), as the console
  // attaches them: the step's resolved inputs are checked before it starts
  // (INPUT_INVALID) and its outputs when it finishes (OUTPUT_INVALID).
  // Unset: not checked. Neither may refer outside itself.
  google.protobuf.Struct input_schema = 13;
  google.protobuf.Struct output_schema = 14;
  // Holds this step while another with the same key is claimed or running
  // (product.yaml's concurrencyKey): the key is the scope (the product)
  // and these inputs' values, resolved, as the step is about to start.
  ConcurrencyKey concurrency_key = 15;
  // Waits in AWAITING_APPROVAL, instead of becoming READY, until someone
  // approves it (DecideApproval); expires with APPROVAL_EXPIRED after the
  // scheduler's approval timeout.
  bool approval_required = 16;
  // Holds this step while its product already has max_running steps
  // claimed or running (product.yaml's maxRunning): all of the product's
  // actions share the scope.
  ProductCap product_cap = 17;
  // The capacity its product asks for (product.yaml's capacity): "spot" or
  // "onDemand", each a placement the install sets
  // (scheduler.capacityPlacements); empty, or one the install has none for:
  // the install's own (scheduler.taskPlacement).
  string capacity = 18;
}

message ProductCap {
  // Whose cap it is: the product (its catalog path), so its actions share it.
  string scope = 1;
  // How many of its steps may be claimed or running at once; 1 to 100.
  int32 max_running = 2;
}

message ConcurrencyKey {
  // Whose key it is: the product, so two products never share one.
  string scope = 1;
  // The inputs that name what the step changes; 1 to 8.
  repeated string inputs = 2;
}

// A Pod's size, as Kubernetes quantities ("250m", "512Mi").
message Resources {
  string cpu = 1;
  string memory = 2;
  // Unset: memory.
  string memory_limit = 3;
}

message SubmitExecutionRequest {
  // A label for people; may repeat.
  string name = 1;
  // Makes a resubmission safe. Unset: every submission is a new execution.
  string request_id = 2;
  repeated Task tasks = 3;
  // Who asked, in the caller's own terms ("user:<id>"): recorded on each
  // task's first attempt and returned as is. The kernel never resolves it.
  string requested_by = 4;
}

message SubmitExecutionResponse {
  string execution_id = 1;
  ExecutionState state = 2;
  // False when request_id was used before: this is that execution.
  bool created = 3;
}

// The details of an invalid_argument SubmitExecution.
message ValidationIssues {
  repeated ValidationIssue issues = 1;
}

message ValidationIssue {
  // EMPTY_DAG, DUPLICATE_TASK_ID, UNKNOWN_DEPENDENCY, CYCLE_DETECTED, ...
  string code = 1;
  string message = 2;
  // The task it's about, if any.
  string task_id = 3;
}

message GetExecutionRequest {
  string execution_id = 1;
}

message GetExecutionResponse {
  Execution execution = 1;
}

message Execution {
  string execution_id = 1;
  string name = 2;
  ExecutionState state = 3;
  repeated TaskStatus tasks = 4;
}

message TaskStatus {
  string task_id = 1;
  TaskState state = 2;
  int32 attempt_count = 3;
  // Once it succeeded.
  google.protobuf.Struct outputs = 4;
  // Once it failed: {code, message, retryable}.
  google.protobuf.Struct failure = 5;
  repeated string depends_on = 6;
  // The current attempt's.
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp completed_at = 8;
  // Every attempt, first to last.
  repeated Attempt attempts = 9;
  bool approval_required = 10;
  // Once approved: who (decided_by) and when.
  string approved_by = 11;
  google.protobuf.Timestamp approved_at = 12;
  // While AWAITING_APPROVAL: since when.
  google.protobuf.Timestamp awaiting_since = 13;
  // While READY but held because another step with the same concurrency
  // key (Task.concurrency_key) is claimed or running: the key's inputs,
  // with their values.
  google.protobuf.Struct waiting_for = 14;
  // While READY but held because its product already has its most steps
  // claimed or running (Task.product_cap).
  bool waiting_for_cap = 15;
}

message Attempt {
  int32 number = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp completed_at = 3;
  // How it ended, when it failed: {code, message, retryable}.
  google.protobuf.Struct failure = 4;
  // Who asked for it (requested_by); empty for an automatic retry.
  string requested_by = 5;
  // submitted, retried or automatic_retry.
  string trigger = 6;
  // What acted: <team>/<serviceAccount>, and the image it ran.
  string acted_as = 7;
  string image = 8;
}

message GetExecutionStatesRequest {
  // At most 1000.
  repeated string execution_ids = 1;
}

message GetExecutionStatesResponse {
  repeated ExecutionStateEntry states = 1;
}

message ExecutionStateEntry {
  string execution_id = 1;
  ExecutionState state = 2;
  // How many of its steps are in each state (PENDING, RUNNING, SUCCEEDED,
  // ...), for a list's progress.
  map<string, int32> steps = 3;
  google.protobuf.Timestamp created_at = 4;
  // Its last change: when it finished, once it has.
  google.protobuf.Timestamp updated_at = 5;
}

message ListExecutionEventsRequest {
  string execution_id = 1;
  // Events after this id; unset, from the first.
  optional int64 after = 2;
  // 1 to 1000; unset or 0, 100.
  int32 limit = 3;
}

message ListExecutionEventsResponse {
  repeated ExecutionEvent events = 1;
  // Set when the page was full: pass it as after for the next one.
  optional int64 next_cursor = 2;
}

message ExecutionEvent {
  int64 id = 1;
  // EXECUTION_CREATED, TASK_CLAIMED, ...
  string event_type = 2;
  // The task's id in its DAG, for a task's event.
  string task_id = 3;
  google.protobuf.Struct payload = 4;
  google.protobuf.Timestamp created_at = 5;
}

message GetExecutionLogsRequest {
  string execution_id = 1;
}

message GetExecutionLogsResponse {
  repeated TaskLogs tasks = 1;
}

message TaskLogs {
  string task_id = 1;
  // [] until it has printed something.
  repeated string lines = 2;
}

message CancelExecutionRequest {
  string execution_id = 1;
}

message CancelExecutionResponse {
  string execution_id = 1;
  ExecutionState state = 2;
}

message RetryTaskRequest {
  string execution_id = 1;
  string task_id = 2;
  // Who asked for the retry, as for SubmitExecutionRequest.requested_by:
  // recorded on the next attempt of the task and of every task it revives.
  string requested_by = 3;
}

message RetryTaskResponse {
  string execution_id = 1;
  ExecutionState state = 2;
}

message DecideApprovalRequest {
  string execution_id = 1;
  string task_id = 2;
  // false declines it.
  bool approve = 3;
  // Who decided, in the caller's own terms ("user:<id>"), recorded as is.
  string decided_by = 4;
  // Why, when declining; shown in the task's failure.
  string reason = 5;
}

message DecideApprovalResponse {
  string execution_id = 1;
  ExecutionState state = 2;
}

message ListAwaitingApprovalRequest {
  // At most 1000.
  repeated string teams = 1;
}

message ListAwaitingApprovalResponse {
  repeated AwaitingApproval tasks = 1;
}

message AwaitingApproval {
  string execution_id = 1;
  string execution_name = 2;
  string task_id = 3;
  string team = 4;
  string image = 5;
  string action = 6;
  // The execution's requested_by.
  string requested_by = 7;
  google.protobuf.Timestamp awaiting_since = 8;
}

message ListRefusalsRequest {
  google.protobuf.Timestamp since = 1;
}

message ListRefusalsResponse {
  repeated Refusal refusals = 1;
}

message Refusal {
  string execution_id = 1;
  string task_id = 2;
  string team = 3;
  string image = 4;
  string code = 5;
  string message = 6;
  google.protobuf.Timestamp at = 7;
}

message GetStatsRequest {}

message GetStatsResponse {
  // The last 24 hours, an hour at a time, oldest first.
  repeated HourStats hours = 1;
  // Failed attempts over the last 24 hours, by error code.
  repeated FailureCount failures = 2;
  // The last 7 days, by image repository (no tag or digest) and action.
  repeated StepStats steps = 3;
  // Now: tasks waiting to start, and running.
  int32 ready = 4;
  int32 running = 5;
}

message HourStats {
  google.protobuf.Timestamp hour = 1;
  int32 started = 2;
  // The 95th percentile of how long a step waited, ready to start, before
  // it started (seconds).
  double wait_p95_seconds = 3;
}

message FailureCount {
  string code = 1;
  int32 count = 2;
  // Some of them were retried automatically.
  bool retried = 3;
}

message StepStats {
  string repository = 1;
  string action = 2;
  string team = 3;
  int32 attempts = 4;
  int32 succeeded = 5;
  double p50_seconds = 6;
  double p95_seconds = 7;
}
