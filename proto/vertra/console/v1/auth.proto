syntax = "proto3";

package vertra.console.v1;

// Signing in, and who you are. Bots don't sign in: they send their API
// token as the bearer token directly.
service AuthService {
  // Which deployment this is. Anyone, signed in or not.
  rpc GetEnvironment(GetEnvironmentRequest) returns (GetEnvironmentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Creates your own account, when open registration is on (off by
  // default: admins create accounts with UserService.CreateUser).
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Returns a session token. Rate limited per client and per email, and
  // spaced out after repeated failures on one account (resource_exhausted,
  // with a Retry-After).
  rpc Login(LoginRequest) returns (LoginResponse);
  // Who you are, and your teams.
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Changes your password (people only), signing out your other sessions;
  // returns a fresh token for this one.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
}

message GetEnvironmentRequest {}

message GetEnvironmentResponse {
  // Shown on every page, such as "local" or "production".
  string label = 1;
  bool self_registration = 2;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message RegisterResponse {
  string user_id = 1;
  string email = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  // Send as Authorization: Bearer <token>.
  string token = 1;
}

message GetMeRequest {}

message GetMeResponse {
  string user_id = 1;
  string email = 2;
  repeated string team_names = 3;
  bool is_admin = 4;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {
  string token = 1;
}
