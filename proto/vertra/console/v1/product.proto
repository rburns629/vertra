syntax = "proto3";

package vertra.console.v1;

import "vertra/console/v1/common.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Products: reviewed images and their actions, registered from the catalog.
// A product name and an image repository belong to the first team that
// registers them, the repository even after its products are deleted.
service ProductService {
  // Products the caller can run.
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Registers or updates a product: a member of its team, an admin, or a
  // token with products:register. With no team it's a platform product:
  // admins only. Refused (already_exists) when another team owns its name
  // or its image repository.
  rpc RegisterProduct(RegisterProductRequest) returns (RegisterProductResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Unregisters a product. Its name and image repository stay its team's.
  rpc DeleteProduct(DeleteProductRequest) returns (DeleteProductResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Which team owns each image repository. Admins only.
  rpc ListImageRepositories(ListImageRepositoriesRequest) returns (ListImageRepositoriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Lets any team register a repository next. Refused while a registered
  // product uses it. Admins only.
  rpc ReleaseImageRepository(ReleaseImageRepositoryRequest) returns (ReleaseImageRepositoryResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // The catalog's wiring types: what inputs can need and outputs provide.
  rpc ListWiringTypes(ListWiringTypesRequest) returns (ListWiringTypesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces every wiring type with the catalog's schema/types.yaml. An
  // admin, or a token with products:register.
  rpc ReplaceWiringTypes(ReplaceWiringTypesRequest) returns (ReplaceWiringTypesResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message Product {
  string id = 1;
  // <team>-<product>-<action>, as catalog CI registers it.
  string name = 2;
  string image = 3;
  string action = 4;
  // Unset for a platform product.
  optional string team_id = 5;
  optional string team_name = 6;
  // JSON Schema of the action's inputs, and of what it outputs.
  google.protobuf.Struct input_schema = 7;
  google.protobuf.Struct output_schema = 8;
  optional string display_name = 9;
  optional string description = 10;
  // The ServiceAccount its tasks run as, in the owning team's namespace.
  optional string service_account = 11;
  // The team secrets it uses (product.yaml's secretRefs): its bindings.
  repeated string secret_refs = 12;
  optional TaskResources resources = 13;
  google.protobuf.Timestamp created_at = 14;
  repeated ProductRelease releases = 15;
  // The other teams that may run it or include it in their templates, or
  // "*" for every team; empty, only its own team.
  repeated string share_with = 16;
  // Why it's deprecated and what to use instead, or empty when it isn't.
  string deprecated = 17;
}

message ProductRelease {
  string image = 1;
  google.protobuf.Timestamp registered_at = 2;
}

message ImageRepository {
  string repository = 1;
  optional string team_name = 2;
  google.protobuf.Timestamp created_at = 3;
  // How many registered products use it: it can be released only at zero.
  int32 products = 4;
}

message WiringType {
  // Such as gcp.project.
  string name = 1;
  // string, integer, number or boolean.
  string json_type = 2;
  string description = 3;
  // Asked once per order when no task in it provides the type.
  bool shared = 4;
  // <team>/<product>.<action> added to an order that needs the type and
  // has no provider.
  optional string default_provider = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ListProductsRequest {}

message ListProductsResponse {
  repeated Product products = 1;
}

message RegisterProductRequest {
  string name = 1;
  string image = 2;
  string action = 3;
  // Unset for a platform product.
  optional string team = 4;
  // Each field below left unset keeps what's stored, except secret_refs,
  // share_with and deprecated, which are always replaced: a registration is
  // the whole product.yaml, and an empty list can't be told from an unset
  // one.
  google.protobuf.Struct input_schema = 5;
  google.protobuf.Struct output_schema = 6;
  optional string display_name = 7;
  optional string description = 8;
  optional string service_account = 9;
  repeated string secret_refs = 10;
  optional TaskResources resources = 11;
  repeated string share_with = 12;
  string deprecated = 13;
}

message RegisterProductResponse {
  Product product = 1;
}

message DeleteProductRequest {
  string name = 1;
}

message DeleteProductResponse {}

message ListImageRepositoriesRequest {}

message ListImageRepositoriesResponse {
  repeated ImageRepository repositories = 1;
}

message ReleaseImageRepositoryRequest {
  string repository = 1;
}

message ReleaseImageRepositoryResponse {}

message ListWiringTypesRequest {}

message ListWiringTypesResponse {
  repeated WiringType types = 1;
}

message ReplaceWiringTypesRequest {
  // Name to type; 1 to 500 of them. Names look like gcp.project.
  map<string, WiringTypeSpec> types = 1;
}

message WiringTypeSpec {
  string json_type = 1;
  string description = 2;
  bool shared = 3;
  optional string default_provider = 4;
}

message ReplaceWiringTypesResponse {
  repeated WiringType types = 1;
}
