syntax = "proto3";

package vertra.console.v1;

import "google/protobuf/timestamp.proto";

// What happened that you'd want to know (the console's notifier.ts): a run
// of yours failed or finished, a step waits for your team's approval, the
// catalog isn't being pulled (admins). Each is in your inbox, and a team's
// are posted to its chat webhook (Slack, Google Chat, Teams) when it has
// one.
service NotificationService {
  // Your notifications, newest first (at most 50), and how many are unread.
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Marks some of yours read, or all of them.
  rpc MarkNotificationsRead(MarkNotificationsReadRequest) returns (MarkNotificationsReadResponse);
  // A team's webhook, for its members: its host and what it's sent; never
  // its URL.
  rpc GetTeamWebhook(GetTeamWebhookRequest) returns (GetTeamWebhookResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Sets a team's webhook (its maintainers): the URL, kept encrypted and
  // never shown again, under a host the install allows, and which kinds it
  // gets.
  rpc SetTeamWebhook(SetTeamWebhookRequest) returns (SetTeamWebhookResponse);
  // Removes a team's webhook (its maintainers): nothing more is posted.
  rpc DeleteTeamWebhook(DeleteTeamWebhookRequest) returns (DeleteTeamWebhookResponse);
  // Posts a test message to it (its maintainers), and says whether it went.
  rpc TestTeamWebhook(TestTeamWebhookRequest) returns (TestTeamWebhookResponse);
  // A team's outcome webhook (its members): where each of its runs'
  // outcomes is posted as signed JSON, for its own systems; its host and
  // last post, never the URL.
  rpc GetTeamCallback(GetTeamCallbackRequest) returns (GetTeamCallbackResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Sets it (its maintainers), under the install's allowed hosts; an empty
  // url removes it. Its signing secret is returned when it's first set or
  // rotated, and never again.
  rpc SetTeamCallback(SetTeamCallbackRequest) returns (SetTeamCallbackResponse);
  // The admins' chat channel: the team whose webhook may also get admins'
  // alerts (platform_alert, catalog_failing, and every team's step_refused).
  // Admins only.
  rpc GetAdminChannel(GetAdminChannelRequest) returns (GetAdminChannelResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Chooses it (a team's name), or none (empty). Admins only.
  rpc SetAdminChannel(SetAdminChannelRequest) returns (SetAdminChannelResponse);
  // Which of your notifications are emailed to you too, and whether this
  // install sends email at all.
  rpc GetEmailPreferences(GetEmailPreferencesRequest) returns (GetEmailPreferencesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Chooses which kinds are emailed to you (any of run_failed,
  // run_succeeded, approval_waiting, product_not_ready, catalog_failing,
  // step_refused, platform_alert).
  rpc SetEmailPreferences(SetEmailPreferencesRequest) returns (SetEmailPreferencesResponse);
}

message Notification {
  string id = 1;
  // run_failed, run_succeeded, approval_waiting, catalog_failing,
  // product_not_ready, step_refused or platform_alert.
  string kind = 2;
  string title = 3;
  string body = 4;
  // The console page it's about, such as /runs/<id>.
  string link = 5;
  google.protobuf.Timestamp created_at = 6;
  bool read = 7;
}

message ListNotificationsRequest {
  bool unread_only = 1;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  int32 unread_count = 2;
}

message MarkNotificationsReadRequest {
  repeated string ids = 1;
  // Every one of yours, instead.
  bool all = 2;
}

message MarkNotificationsReadResponse {}

message TeamWebhook {
  // Whether the team has one.
  bool configured = 1;
  // Its host, such as hooks.slack.com.
  string host = 2;
  // The kinds it's sent: run_failed, approval_waiting, product_not_ready,
  // step_refused; and on the admins' channel, platform_alert and
  // catalog_failing.
  repeated string kinds = 3;
  google.protobuf.Timestamp last_sent_at = 4;
  // Why the last post failed, if it did.
  string last_error = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetTeamWebhookRequest {
  string team = 1;
}

message GetTeamWebhookResponse {
  TeamWebhook webhook = 1;
  // The hosts this install allows.
  repeated string allowed_hosts = 2;
  // Whether this team is the admins' channel: its webhook may also get
  // platform_alert and catalog_failing.
  bool admin_channel = 3;
}

message GetAdminChannelRequest {}

message GetAdminChannelResponse {
  // The team's name; empty: none.
  string team = 1;
}

message SetAdminChannelRequest {
  string team = 1;
}

message SetAdminChannelResponse {
  string team = 1;
}

message SetTeamWebhookRequest {
  string team = 1;
  // Empty: keep the one set, and change only the kinds.
  string url = 2;
  repeated string kinds = 3;
}

message SetTeamWebhookResponse {
  TeamWebhook webhook = 1;
}

message DeleteTeamWebhookRequest {
  string team = 1;
}

message DeleteTeamWebhookResponse {}

message TestTeamWebhookRequest {
  string team = 1;
}

message TestTeamWebhookResponse {
  bool sent = 1;
  // Why not, when it wasn't.
  string error = 2;
}

message GetEmailPreferencesRequest {}

message GetEmailPreferencesResponse {
  // Whether this install sends email (its SMTP server is set).
  bool available = 1;
  repeated string kinds = 2;
}

message SetEmailPreferencesRequest {
  repeated string kinds = 1;
}

message SetEmailPreferencesResponse {
  repeated string kinds = 1;
}

message TeamCallback {
  // Whether the team has one.
  bool configured = 1;
  string host = 2;
  google.protobuf.Timestamp last_sent_at = 3;
  // Why the last post failed, if it did.
  string last_error = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message GetTeamCallbackRequest {
  string team = 1;
}

message GetTeamCallbackResponse {
  TeamCallback callback = 1;
  // The hosts this install allows; empty: none, so it can't have one.
  repeated string allowed_hosts = 2;
}

message SetTeamCallbackRequest {
  string team = 1;
  // https://, under the install's allowed hosts; empty: remove it.
  string url = 2;
  // A new signing secret, the old one no longer valid.
  bool rotate_secret = 3;
}

message SetTeamCallbackResponse {
  TeamCallback callback = 1;
  // Set only when it's new (first set, or rotated): shown once.
  string signing_secret = 2;
}
