syntax = "proto3";

package vertra.console.v1;

import "google/protobuf/timestamp.proto";

// What runs made, and deleting it (decision 21, docs/assessment.md). A step
// reports what it made or changed as `resources` in its outputs, each
// {type, id, name, link}; the console keeps them, with the step's inputs
// and outputs, once its run finishes, so they can be deleted after the
// run is gone. You see what was made for your teams, by your teams'
// products, or by you; you delete what was made for your teams or by you.
service ResourceService {
  // What you may see, newest first, at most 200: a run's, a team's, or
  // those matching a search.
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Deletes resources made for one team: a run of their products' cleanup
  // actions (product.yaml's cleanup), newest first and anything depending on
  // another of them before it, for that team. Each is deleted once its step
  // succeeds. Refused with HAS_DEPENDENTS while other resources still depend
  // on them: the delete is recorded as a request (its id in the Failure
  // detail's requestId) and the admins are alerted; it runs once one
  // approves it.
  rpc DeleteResources(DeleteResourcesRequest) returns (DeleteResourcesResponse);
  // Deletes what a run made that's still there, in the reverse of the
  // order it was made.
  rpc DeleteRunResources(DeleteRunResourcesRequest) returns (DeleteRunResourcesResponse);
  // Deletes waiting for an admin because others depended on them, and the
  // recent decisions: every one for an admin, else your own.
  rpc ListDeleteRequests(ListDeleteRequestsRequest) returns (ListDeleteRequestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Approves a waiting delete (it runs now, as yours) or denies it. Admins only.
  rpc DecideDeleteRequest(DecideDeleteRequestRequest) returns (DecideDeleteRequestResponse);
}

// What a resource's step provided: an output its product types as a wiring
// type (x-vertra-provides), and its value.
message Provided {
  string type = 1;
  string value = 2;
  string output = 3;
}

// Another resource, at the end of a dependency.
message ResourceRef {
  string id = 1;
  string type = 2;
  string external_id = 3;
  string name = 4;
  // The run that last reported it.
  string execution_id = 5;
  // The input of the dependent's step it came in through.
  string input = 6;
}

message Resource {
  string id = 1;
  // What the product said: such as "gcp/project", its id there, a name for
  // people, and a link to it.
  string type = 2;
  string external_id = 3;
  string name = 4;
  string link = 5;
  // The registered product that made it (<team>-<product>-<action>), and
  // its team.
  string product = 6;
  string product_team = 7;
  // The team it was made for; empty when it was for whoever ran it alone.
  string owner_team = 8;
  // Who ran it; empty once their account is gone.
  string owner_email = 9;
  // The run and step that last reported it.
  string execution_id = 10;
  string task_id = 11;
  google.protobuf.Timestamp first_reported_at = 12;
  google.protobuf.Timestamp reported_at = 13;
  // "exists", "deleting", "delete_failed" (its last delete's run finished
  // without deleting it) or "deleted".
  string state = 14;
  // The last delete's run, if one was asked for.
  string deleting_execution_id = 15;
  google.protobuf.Timestamp deleted_at = 16;
  // Whether you may delete it now.
  bool can_delete = 17;
  // What its step provided, by wiring type: what a later order can use.
  repeated Provided provides = 18;
  // What it depends on, and what still depends on it, of what you may see:
  // recorded when each run finished, across runs.
  repeated ResourceRef depends_on = 19;
  repeated ResourceRef dependents = 20;
  // Live dependents you may not see.
  int32 hidden_dependents = 21;
}

message ResourceDeleteRequest {
  string id = 1;
  // What it would delete, and what depended on it when asked (what you may see).
  repeated ResourceRef resources = 2;
  repeated ResourceRef dependents = 3;
  string owner_team = 4;
  string requested_by = 5;
  google.protobuf.Timestamp created_at = 6;
  // "approved", "denied", "deleted" (all it would delete was deleted
  // another way first, with what depended on it), or empty while it waits.
  string decision = 7;
  string decided_by = 8;
  google.protobuf.Timestamp decided_at = 9;
  // The cleanup run an approval started.
  string execution_id = 10;
}

message ListDeleteRequestsRequest {}

message ListDeleteRequestsResponse {
  // Waiting first, then decided, newest first; at most 100.
  repeated ResourceDeleteRequest requests = 1;
}

message DecideDeleteRequestRequest {
  string id = 1;
  bool approve = 2;
}

message DecideDeleteRequestResponse {
  // The cleanup run, when approved.
  string execution_id = 1;
}

message ListResourcesRequest {
  string execution_id = 1;
  string team = 2;
  // Matched against type, id and name.
  string query = 3;
  bool include_deleted = 4;
}

message ListResourcesResponse {
  repeated Resource resources = 1;
}

message DeleteResourcesRequest {
  // 1 to 50.
  repeated string resource_ids = 1;
}

message DeleteResourcesResponse {
  // The cleanup run.
  string execution_id = 1;
}

message DeleteRunResourcesRequest {
  string execution_id = 1;
}

message DeleteRunResourcesResponse {
  // The cleanup run.
  string execution_id = 1;
}
