syntax = "proto3";

package vertra.console.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "vertra/console/v1/order.proto";

// The chat agent (decision 24): answers from the docs and the catalog,
// looks at what the person's teams have, and proposes carts, all as the
// signed-in person, through the console's own checks. It never orders: a
// cart it proposes is the person's to open and place.
service ChatService {
  // Whether chat is on here, and with which model.
  rpc GetChatSettings(GetChatSettingsRequest) returns (GetChatSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // An answer to the conversation's last message. Nothing is kept: send
  // the conversation each time. CHAT_OFF without a model here;
  // MODEL_UNAVAILABLE when it doesn't answer; CONVERSATION_TOO_LONG when
  // the conversation won't fit the chat's context window. A question that
  // isn't about Vertra gets the same short answer (off_topic), and an
  // answer from neither the docs nor the platform isn't shown (uncited).
  rpc Ask(AskRequest) returns (AskResponse);
  // Ask, with each step as it's taken (a tool used, whether it worked),
  // then the answer. The answer's words come only at the end, checked:
  // what the model says isn't shown until the console has checked it.
  rpc AskStream(AskStreamRequest) returns (stream AskStreamResponse);
  // The chat agent's model as it's set: the install's (the chart's chat
  // values) or an admin's. Admins only. Never the key.
  rpc GetChatConfig(GetChatConfigRequest) returns (GetChatConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // An admin's own settings, checked as the install's are
  // (BAD_CHAT_SETTINGS), in effect on every console within seconds.
  rpc SetChatConfig(SetChatConfigRequest) returns (SetChatConfigResponse);
  // Back to the install's settings; the admins' are forgotten, key and all.
  rpc ResetChatConfig(ResetChatConfigRequest) returns (ResetChatConfigResponse);
  // Settings tried before they're saved: one real question through the
  // agent, as the admin. Says whether the model answered, not what another
  // server said.
  rpc TestChatConfig(TestChatConfigRequest) returns (TestChatConfigResponse);
  // Thumbs up or down on an answer you got, sent with its question and
  // answer, for the admins (kept 90 days).
  rpc RateAnswer(RateAnswerRequest) returns (RateAnswerResponse);
  // The ratings, newest first, at most 200. Admins only.
  rpc ListChatFeedback(ListChatFeedbackRequest) returns (ListChatFeedbackResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message RateAnswerRequest {
  // "up" or "down".
  string rating = 1;
  string team = 2;
  // At most 4,000 characters.
  string question = 3;
  // At most 20,000 characters.
  string answer = 4;
  repeated ChatCitation citations = 5;
  // The tools it used, in order.
  repeated string steps = 6;
  string model = 7;
  // What was wrong, or right; at most 2,000 characters.
  string comment = 8;
}

message RateAnswerResponse {
  string id = 1;
}

message ListChatFeedbackRequest {
  // "up", "down", or empty for both.
  string rating = 1;
}

message ChatRating {
  string id = 1;
  string rating = 2;
  string team = 3;
  string question = 4;
  string answer = 5;
  repeated ChatCitation citations = 6;
  repeated string steps = 7;
  string model = 8;
  string comment = 9;
  // Who rated it; empty once their account is gone.
  string email = 10;
  google.protobuf.Timestamp created_at = 11;
}

message ListChatFeedbackResponse {
  repeated ChatRating ratings = 1;
}

message GetChatSettingsRequest {}

message GetChatSettingsResponse {
  bool enabled = 1;
  string model = 2;
}

message ChatTurn {
  // "user" or "assistant".
  string role = 1;
  string content = 2;
}

message AskRequest {
  // The team they're working for; empty for none chosen.
  string team = 1;
  // Oldest first, the question last; at most 40, each at most 4,000
  // characters.
  repeated ChatTurn messages = 2;
}

message ChatCitation {
  // As the answer cites it: [S1].
  string id = 1;
  string guide = 2;
  string title = 3;
  string heading = 4;
  // The doc's kind: guide, current, operating or history.
  string kind = 5;
  // The console's page for it, built by the console, never by the model.
  string link = 6;
}

// A cart for the person to open, check and place: never placed by the agent.
message ProposedCart {
  string team = 1;
  repeated string actions = 2;
  // What the person chose, of the plan's options (PreviewOrder's).
  repeated OrderChoice choices = 3;
  // What they said to fill in, by step, then input, as PlaceOrder's values.
  google.protobuf.Struct values = 4;
}

message ChatStep {
  string tool = 1;
  bool ok = 2;
}

// As AskRequest.
message AskStreamRequest {
  string team = 1;
  repeated ChatTurn messages = 2;
}

message AskStreamResponse {
  oneof event {
    // A step it took: the tool, and whether it worked.
    ChatStep step = 1;
    // The answer, as Ask gives it: the last message.
    AskResponse answer = 2;
  }
}

message AskResponse {
  // Markdown, with citations like [S1] kept only when they name a section
  // retrieved for this answer.
  string text = 1;
  repeated ChatCitation citations = 2;
  // It found nothing to answer from, in the docs or the platform: the text
  // says so, in the console's words, not the model's.
  bool uncited = 3;
  optional ProposedCart cart = 4;
  // What it did: each tool, in order, and whether it worked.
  repeated ChatStep steps = 5;
  string model = 6;
  // Not about Vertra: the text says what it helps with, and the model
  // wasn't asked.
  bool off_topic = 7;
  // How much of the chat's context window the conversation takes, with this
  // answer: 0 to 100. At 100 the next question is refused
  // (CONVERSATION_TOO_LONG): start a new conversation.
  int32 context_percent = 8;
}

// The chat agent's model, as it's set.
message ChatConfig {
  // install (the chart's chat values) or admins (set here).
  string source = 1;
  bool enabled = 2;
  // vertex, bedrock, anthropic or openai-compatible.
  string provider = 3;
  string model = 4;
  // openai-compatible's base URL (.../v1), or Anthropic's when not its own.
  string endpoint = 5;
  string vertex_project = 6;
  string vertex_location = 7;
  // low, medium, high; empty: the model's own.
  string effort = 8;
  int32 max_steps = 9;
  int32 context_tokens = 10;
  int32 max_tokens = 11;
  // A key is kept (sealed) or comes from the install: it's never sent.
  bool key_set = 12;
  // Why an admin's settings can't be used now (chat is off meanwhile).
  string problem = 13;
  string updated_by = 14;
  google.protobuf.Timestamp updated_at = 15;
  // What Reset returns to: the install's provider and model, empty for none.
  string install_provider = 16;
  string install_model = 17;
  // bedrock's AWS region (Claude in Amazon Bedrock, as the console's own
  // AWS identity).
  string bedrock_region = 18;
}

// Settings to save or try.
message ChatConfigInput {
  bool enabled = 1;
  string provider = 2;
  string model = 3;
  string endpoint = 4;
  string vertex_project = 5;
  string vertex_location = 6;
  string effort = 7;
  // 0: the default.
  int32 max_steps = 8;
  int32 context_tokens = 9;
  int32 max_tokens = 10;
  // Empty: keep the one kept, or use the install's for its own provider.
  // Ignored on Vertex, which signs in as the console.
  string api_key = 11;
  string bedrock_region = 12;
}

message GetChatConfigRequest {}

message GetChatConfigResponse {
  ChatConfig config = 1;
}

message SetChatConfigRequest {
  ChatConfigInput config = 1;
}

message SetChatConfigResponse {
  ChatConfig config = 1;
}

message ResetChatConfigRequest {}

message ResetChatConfigResponse {
  ChatConfig config = 1;
}

message TestChatConfigRequest {
  ChatConfigInput config = 1;
}

message TestChatConfigResponse {
  // The model answered.
  bool ok = 1;
  // Why it didn't, when it didn't.
  string problem = 2;
  double seconds = 3;
  string model = 4;
  // The start of its answer to the test question.
  string answer = 5;
  // How many sections it cited.
  int32 citations = 6;
}
