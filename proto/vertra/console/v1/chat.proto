syntax = "proto3";

package vertra.console.v1;

import "google/protobuf/timestamp.proto";

// The chat agent (decision 24): answers from the docs and the catalog,
// looks at what the person's teams have, and proposes carts, all as the
// signed-in person, through the console's own checks. It never orders: a
// cart it proposes is the person's to open and place.
service ChatService {
  // Whether chat is on here, and with which model.
  rpc GetChatSettings(GetChatSettingsRequest) returns (GetChatSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // An answer to the conversation's last message. Nothing is kept: send
  // the conversation each time. CHAT_OFF without a model here;
  // MODEL_UNAVAILABLE when it doesn't answer.
  rpc Ask(AskRequest) returns (AskResponse);
  // Thumbs up or down on an answer you got, sent with its question and
  // answer, for the admins (kept 90 days).
  rpc RateAnswer(RateAnswerRequest) returns (RateAnswerResponse);
  // The ratings, newest first, at most 200. Admins only.
  rpc ListChatFeedback(ListChatFeedbackRequest) returns (ListChatFeedbackResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message RateAnswerRequest {
  // "up" or "down".
  string rating = 1;
  string team = 2;
  // At most 4,000 characters.
  string question = 3;
  // At most 20,000 characters.
  string answer = 4;
  repeated ChatCitation citations = 5;
  // The tools it used, in order.
  repeated string steps = 6;
  string model = 7;
  // What was wrong, or right; at most 2,000 characters.
  string comment = 8;
}

message RateAnswerResponse {
  string id = 1;
}

message ListChatFeedbackRequest {
  // "up", "down", or empty for both.
  string rating = 1;
}

message ChatRating {
  string id = 1;
  string rating = 2;
  string team = 3;
  string question = 4;
  string answer = 5;
  repeated ChatCitation citations = 6;
  repeated string steps = 7;
  string model = 8;
  string comment = 9;
  // Who rated it; empty once their account is gone.
  string email = 10;
  google.protobuf.Timestamp created_at = 11;
}

message ListChatFeedbackResponse {
  repeated ChatRating ratings = 1;
}

message GetChatSettingsRequest {}

message GetChatSettingsResponse {
  bool enabled = 1;
  string model = 2;
}

message ChatTurn {
  // "user" or "assistant".
  string role = 1;
  string content = 2;
}

message AskRequest {
  // The team they're working for; empty for none chosen.
  string team = 1;
  // Oldest first, the question last; at most 40, each at most 4,000
  // characters.
  repeated ChatTurn messages = 2;
}

message ChatCitation {
  // As the answer cites it: [S1].
  string id = 1;
  string guide = 2;
  string title = 3;
  string heading = 4;
  // The doc's kind: guide, current, operating or history.
  string kind = 5;
  // The console's page for it, built by the console, never by the model.
  string link = 6;
}

message ProposedCart {
  string team = 1;
  repeated string actions = 2;
}

message ChatStep {
  string tool = 1;
  bool ok = 2;
}

message AskResponse {
  // Markdown, with citations like [S1] kept only when they name a section
  // retrieved for this answer.
  string text = 1;
  repeated ChatCitation citations = 2;
  // It searched the docs and cites nothing it found: not from the docs.
  bool uncited = 3;
  optional ProposedCart cart = 4;
  // What it did: each tool, in order, and whether it worked.
  repeated ChatStep steps = 5;
  string model = 6;
}
