syntax = "proto3";

package vertra.console.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// A team's secrets: registered by name, their values written straight into
// the team's namespace (pasted) or synced from its vault (External Secrets
// Operator). Values are never stored by the console or returned by it.
// Any of the team's registered products may mount any of them, when a task
// lists it in secret_refs.
service SecretService {
  // A team's secrets: names and key names, never values.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Where a team's secrets can come from: its SecretStores.
  rpc ListSecretStores(ListSecretStoresRequest) returns (ListSecretStoresResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Adds or replaces a pasted secret.
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Syncs a secret from one of the team's SecretStores: only the reference
  // goes through the console; the value goes from the vault to the namespace.
  rpc SyncSecret(SyncSecretRequest) returns (SyncSecretResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Removes the registration and what the console created. Tasks already
  // running keep what they mounted.
  rpc RevokeSecret(RevokeSecretRequest) returns (RevokeSecretResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // What the "connect a source" guide needs to know about this install.
  rpc GetSecretSources(GetSecretSourcesRequest) returns (GetSecretSourcesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

enum SecretSource {
  SECRET_SOURCE_UNSPECIFIED = 0;
  // Pasted in the console.
  SECRET_SOURCE_LITERAL = 1;
  // Synced from a vault.
  SECRET_SOURCE_EXTERNAL = 2;
}

message TeamSecret {
  string id = 1;
  string secret_name = 2;
  repeated string keys = 3;
  SecretSource source = 4;
  // False for a sync created outside the console.
  bool managed = 5;
  google.protobuf.Timestamp updated_at = 6;
  // For a synced secret: its ExternalSecret's reference, as stored.
  google.protobuf.Struct external = 7;
}

message SecretStore {
  string name = 1;
  // ESO's provider id: gcpsm, azurekv, aws, onepasswordSDK and so on.
  string provider = 2;
  string provider_label = 3;
  optional string location = 4;
  optional string identity = 5;
  bool uses_stored_credential = 6;
  optional bool ready = 7;
  optional string message = 8;
  int32 shared_with_count = 9;
  repeated string shared_with = 10;
}

message ListSecretsRequest {
  string team = 1;
}

message ListSecretsResponse {
  repeated TeamSecret secrets = 1;
}

message ListSecretStoresRequest {
  string team = 1;
}

message ListSecretStoresResponse {
  repeated SecretStore stores = 1;
}

message PutSecretRequest {
  string team = 1;
  string secret_name = 2;
  // Key to value; at least one. Never logged or stored by the console.
  map<string, string> data = 3;
}

message PutSecretResponse {}

message SyncSecretRequest {
  string team = 1;
  string secret_name = 2;
  string secret_store_name = 3;
  // At least one.
  repeated SyncedKey keys = 4;
}

// One key of the Secret, and where it comes from in the vault.
message SyncedKey {
  string secret_key = 1;
  string remote_key = 2;
  optional string property = 3;
}

message SyncSecretResponse {}

message RevokeSecretRequest {
  string team = 1;
  string secret_name = 2;
}

message RevokeSecretResponse {}

message GetSecretSourcesRequest {}

message GetSecretSourcesResponse {
  // owner/repo of the catalog, where teams/<team>/secret-stores/ lives.
  string catalog_repo = 1;
  // This cluster's ServiceAccount token issuer, for clouds to federate with.
  string cluster_issuer = 2;
  string gcp_workload_identity_pool = 3;
  string gke_cluster_name = 4;
  string gke_cluster_location = 5;
}
