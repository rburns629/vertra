syntax = "proto3";

package vertra.catalog.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// A catalog release: everything a catalog's main branch says, as of one
// commit, for every install that uses the catalog. Catalog CI writes it
// (`vertra catalog release`), only from main, as an OCI artifact beside the
// images, <registry>/catalog-release, tagged with the commit and "latest",
// and signs it as it signs the images. Each console reads it, verifies it,
// and applies it: so CI holds no console credential, and one catalog serves
// any number of installs.
//
// A release is complete, not a change: whatever it doesn't name, the
// catalog no longer has. Its JSON form (proto3 JSON) is the artifact's one
// layer, media type application/vnd.vertra.catalog.release.v1+json.
message Release {
  // The catalog commit it describes.
  string commit = 1;
  // The repository, for people: "github.com/my-org/vertra-catalog".
  string repository = 2;
  google.protobuf.Timestamp created_at = 3;
  repeated Team teams = 4;
  // Every product action of every team, with its image pinned to a digest.
  repeated ProductAction products = 5;
  // Every team's templates (teams/<team>/dags/*.yaml of kind Template), as
  // vertra catalog checked them: what consumers run, with parameters only.
  repeated Template templates = 6;
  // Every team's API products (teams/<team>/apis/<name>/api.yaml), as vertra
  // catalog checked them, each with its OpenAPI document.
  repeated Api apis = 7;
}

message Team {
  // Its folder's name, teams/<name>/: the team and its namespace.
  string name = 1;
  // Its SecretStore files' documents (teams/<name>/secret-stores/*.yaml), as
  // vertra catalog checked them; none when it has no file. The stored
  // credential such a store may use is never here: each install sets its
  // own in the console.
  repeated google.protobuf.Struct secret_store_documents = 2;
  // team.yaml's allowedTargets: where other teams may aim its products.
  repeated TargetRule allowed_targets = 3;
  // team.yaml's contact and help: where people ask when its steps fail.
  string contact = 4;
  string help_chat = 5;
  string help_url = 6;
}

// One rule of a team's allowedTargets: the teams it covers ("*" for every
// team) and, per kind of target, the values or patterns ("*" matches any
// run of characters) they may supply.
message TargetRule {
  repeated string teams = 1;
  repeated Targets targets = 2;
  // Steps aimed at these targets still wait for a maintainer of the
  // owning team to approve them.
  bool approval = 3;
}

message Targets {
  // gcp.project, gcp.folder, aws.account or azure.subscription.
  string type = 1;
  repeated string values = 2;
}

// One action of a product.yaml, as the console registers it.
message ProductAction {
  // <team>-<product>-<action>.
  string name = 1;
  // <registry>/<team>/<product>@sha256:...: what CI built, tested, scanned,
  // pushed and signed.
  string image = 2;
  string action = 3;
  string team = 4;
  google.protobuf.Struct input_schema = 5;
  google.protobuf.Struct output_schema = 6;
  string display_name = 7;
  string description = 8;
  // Empty: "default".
  string service_account = 9;
  repeated string secret_refs = 10;
  Resources resources = 11;
  repeated string share_with = 12;
  // Why it's deprecated and what to use instead; empty when it isn't.
  string deprecated = 13;
  // Audiences its tasks get a projected ServiceAccount token for
  // (product.yaml's tokenAudiences, the product's).
  repeated string token_audiences = 14;
  // visibility: hidden: only its own team sees it (it has no share_with).
  bool hidden = 15;
  // Its product.yaml in the catalog repository, for people:
  // "teams/<team>/products/<product>/product.yaml".
  string path = 16;
  // Running it again with the same inputs does no harm (product.yaml's
  // idempotent), which maxAttempts above 1 needs.
  bool idempotent = 17;
  // How many times a step of it may run in all; 0 is the default, 1.
  int32 max_attempts = 18;
  // The inputs naming what a step of it changes: one step per set of
  // values at a time (product.yaml's concurrencyKey). Empty: never held.
  repeated string concurrency_key = 19;
  // product.yaml's errors: what each error code its actions report means,
  // and what to do.
  map<string, ErrorHelp> errors = 20;
  // When a step of it waits for a maintainer of its team to approve it:
  // "always", "otherTeams" (only when another team runs it), or empty
  // (never, unless an allowedTargets rule asks).
  string approval = 21;
  // What removes the resources its steps report (product.yaml's cleanup):
  // unset when nothing does.
  Cleanup cleanup = 22;
}

// An action's cleanup: which action of the same product removes one
// resource a step of it reported, and with what inputs.
message Cleanup {
  string action = 1;
  // Unset: {"resource": <the resource>}. Set: exactly these, with
  // {"$input": name}, {"$output": name} and {"$resource": field} filled in
  // from what was recorded.
  google.protobuf.Struct inputs = 2;
}

message ErrorHelp {
  string means = 1;
  // What to do; may be empty.
  string do = 2;
}

// A template: a DAG of actions with parameters, which a consumer runs by
// filling in only the parameters. Each step runs its action's product, as
// that product's ServiceAccount, with that action's own secrets, in that
// product's team's namespace.
message Template {
  // Its file's name, dags/<name>.yaml; unique within its team.
  string name = 1;
  string team = 2;
  string display_name = 3;
  string description = 4;
  // A JSON Schema (draft 2020-12) for an object: what the person running it
  // fills in, and the form the console shows.
  google.protobuf.Struct parameters = 5;
  repeated TemplateStep steps = 6;
  // The other teams that may run it, or "*" for every team; empty, only its
  // own.
  repeated string share_with = 7;
  // Why it's deprecated and what to use instead; empty when it isn't.
  string deprecated = 8;
  // visibility: hidden: only its own team sees it (it has no share_with).
  bool hidden = 9;
  // Its file in the catalog repository: "teams/<team>/dags/<name>.yaml".
  string path = 10;
}

message TemplateStep {
  // Unique within the template.
  string id = 1;
  // <team>/<product>.<action>, always with its team (vertra catalog fills in the
  // template's own for an action of its team).
  string action = 2;
  repeated string depends_on = 3;
  // The action's inputs: a value, {"$param": name} for a parameter, or
  // {"$fromStep": id, "$output": name} for an output of a step it depends on.
  google.protobuf.Struct inputs = 4;
  optional int32 timeout_seconds = 5;
  optional int32 max_attempts = 6;
}

// The Pod size its tasks get, as Kubernetes quantities.
message Resources {
  string cpu = 1;
  string memory = 2;
  string memory_limit = 3;
}

// An API product: a backend a team already runs, published through the
// install's gateway, which forwards only what its OpenAPI document
// describes (decision 20).
message Api {
  // Its folder's name, apis/<name>/: callers reach it at /<team>/<name>/.
  string name = 1;
  string team = 2;
  string display_name = 3;
  string description = 4;
  // Its OpenAPI document (3.0 or 3.1), as JSON, references inside it only.
  string openapi = 5;
  // Where requests go: https, or http to a Service in the cluster.
  string backend_url = 6;
  // How the gateway signs in to the backend; unset: it doesn't.
  BackendAuth backend_auth = 7;
  // The Kubernetes ServiceAccount, in the team's namespace, its
  // credentials are minted for.
  string service_account = 8;
  // The other teams that may call it, or "*".
  repeated string share_with = 9;
  // visibility: hidden: only its own team sees it (it has no share_with).
  bool hidden = 10;
  // Why it's deprecated and what to use instead; empty when it isn't.
  string deprecated = 11;
  // reachable: internet: also on the gateway's public address, where the
  // install allows its team.
  bool internet = 12;
  // Requests a minute per calling team: "default", and teams by name.
  // Empty: the install's default.
  map<string, int32> per_minute = 13;
  // How long the backend has to start answering.
  int32 timeout_seconds = 14;
  // The largest request body forwarded.
  int64 max_request_bytes = 15;
  // Its api.yaml in the catalog repository: "teams/<team>/apis/<name>/api.yaml".
  string path = 16;
}

message BackendAuth {
  // 3 was a team secret, dropped before any release: the gateway reads no
  // Secrets.
  reserved 3;
  reserved "secret";
  oneof kind {
    ServiceAccountTokenAuth service_account_token = 1;
    GoogleIdTokenAuth google_id_token = 2;
    AwsSigV4Auth aws_sig_v4 = 4;
  }
}

// A token for the API's own ServiceAccount, for this audience.
message ServiceAccountTokenAuth {
  string audience = 1;
}

// A Google ID token, as service_account, for audience; minted per request
// through the API ServiceAccount's federation.
message GoogleIdTokenAuth {
  string service_account = 1;
  string audience = 2;
}

// AWS SigV4 for service in region, as role_arn, assumed per request with
// the API ServiceAccount's token (AssumeRoleWithWebIdentity).
message AwsSigV4Auth {
  string role_arn = 1;
  string region = 2;
  string service = 3;
}
